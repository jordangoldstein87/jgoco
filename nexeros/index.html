<style>
:root{--bg:#f4efe6;--card:#fffdf8;--ink:#1d2620;--mut:#646a60;--line:#e2dacb;--green:#24382c;--deep:#14201a;--honey:#d9a44e;--clay:#b8613f;--sage:#a9b8a0;--good:#3f7a52;--warn:#c4862a;--bad:#b2452f;--fd:'Fraunces',Georgia,serif;--fb:'Inter',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--fb);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
img{max-width:100%}
button{font:inherit;cursor:pointer}
.eyebrow{display:inline-block;font:600 12px/1 var(--fb);letter-spacing:.16em;text-transform:uppercase;color:var(--clay)}
h1,h2,h3{font-family:var(--fd);font-weight:400;letter-spacing:-.015em;margin:0}
.rise{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}.rise.in{opacity:1;transform:none}
.cap .rise{opacity:1;transform:none;transition:none}
.cap .wh-scene,.cap .wh-body,.cap .wh-open{transition:none!important}.cap .wh *{animation-duration:0s!important;animation-delay:0s!important}

/* ---------- shell: side nav on desktop, header on phones ---------- */
#lnav{position:fixed;inset:0 auto 0 0;width:236px;background:var(--deep);color:#efe8da;padding:22px 14px;display:flex;flex-direction:column;gap:18px;z-index:40;overflow-y:auto}
#lnav-logo{text-decoration:none;padding:4px 10px 10px;display:block}
#lnav-logo small{display:block;font:500 11px var(--fb);letter-spacing:.14em;text-transform:uppercase;color:#a9b8a0;margin-top:6px}
#lnav-links,#mnav{display:flex;flex-direction:column;gap:2px}
#lnav-links a,#mnav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;text-decoration:none;font:500 14.5px var(--fb);color:#d8d2c4}
#lnav-links a:hover{background:#ffffff10}
#lnav-links a.on{background:#efe8da;color:var(--deep)}
.nv-head{font:600 11px var(--fb);letter-spacing:.16em;text-transform:uppercase;color:var(--honey);padding:16px 10px 6px}
#lnav-foot{margin-top:auto;font-size:12px;color:#8f9a8c;padding:0 10px}
#lnav-foot a{color:#d8d2c4}
#hd{display:none}
#view{margin-left:236px;min-height:100vh}
body[data-view=welcome] #lnav{display:none}body[data-view=welcome] #view{margin-left:0}
body[data-view=welcome] #hd{display:none!important}
.cap #lnav{display:none}.cap #view{margin-left:0}
@media (max-width:900px){
  #lnav{display:none}#view{margin-left:0}

  #menu-btn{background:none;border:1px solid #ffffff30;color:#efe8da;border-radius:10px;padding:7px 12px;font-size:14px}
  #mnav{position:fixed;top:56px;left:0;right:0;bottom:0;background:var(--deep);padding:12px 16px;z-index:39;overflow-y:auto}
  #mnav a{font-size:17px;padding:12px 10px}
  #mnav a.on{background:#efe8da;color:var(--deep)}
}

/* ---------- brand marks ---------- */
.nx-logo{display:inline-flex;align-items:center;gap:.28em;font-size:var(--s);line-height:1;color:var(--b1);white-space:nowrap}
.nx-logo b{font-family:var(--fd);font-weight:var(--fdw);font-style:var(--fds);letter-spacing:var(--trk)}
.lg-rooted b{font-weight:450;letter-spacing:-.02em}
.lg-golden b{font-size:1.08em}
.lg-still b{font-style:italic;color:var(--ink)}.lg-still i{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--b2);font-size:1.25em;margin-left:-.05em}
.lg-label b{font-weight:600;letter-spacing:-.02em;color:var(--ink)}.lg-label small{font:500 .5em 'IBM Plex Mono',monospace;border:1.5px solid var(--b2);color:var(--b2);padding:.2em .35em;border-radius:4px}
#lnav .nx-logo b,#hd .nx-logo b{color:#efe8da}

/* ---------- welcome: the opening ---------- */
.wh{position:relative;height:100vh;min-height:560px;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#22372b 0%,#14201a 60%,#0d1611 100%);color:#f3ede2}
.wh-plants{position:absolute;inset:-10%;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;justify-items:center;opacity:.22;transform:scale(1.04);--ln:#cfe0c4;--fl:#2f4a3a;--b3:#d9a44e;--b2:#b8613f}
.wh-plants span{transform:rotate(calc(var(--i)*23deg - 40deg))}.wh-plants svg{width:min(22vw,260px);height:auto}
.wh.on .wh-plants{animation:push 80s linear forwards}
@keyframes push{to{transform:scale(1.4) translateY(-3%)}}
.wh-veil{position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 50%,transparent 0,#0d161188 80%)}
.wh-open{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;transition:opacity .8s}
.nx-lock{display:flex;flex-direction:column;align-items:center;color:#f3ede2;line-height:1}.nx-lock .lk-logo{display:flex;align-items:center;gap:.16em;font-size:clamp(64px,8.4vw,128px)}.nx-lock .lk-logo .gk-art{width:1.05em;height:auto;margin:0 0 .08em;filter:drop-shadow(0 8px 24px #0006)}.nx-lock .lk-logo b{font:450 1em/1 "Fraunces",Georgia,serif;letter-spacing:-.025em;color:#f3ede2;margin:0}.nx-lock .lk-bot{margin-top:.9em}
.nx-lock .lk-bot{font:600 clamp(11px,1.1vw,15px) var(--fb);letter-spacing:.42em;text-transform:uppercase;color:#d9a44e;padding-left:.42em}
.nx-lock .lk-bot{display:flex;align-items:center;gap:1.1em}.nx-lock .lk-bot i{display:block;width:clamp(36px,4vw,64px);height:1px;background:#d9a44e;opacity:.7}
.wh-k,.wh-k2{font:600 12px var(--fb);letter-spacing:.3em;text-transform:uppercase;color:#a9b8a0}
.wh-play{margin-top:22px;width:88px;height:88px;border-radius:50%;border:0;background:var(--honey);color:var(--deep);display:grid;place-items:center;box-shadow:0 0 0 10px #d9a44e22;transition:transform .2s}
.wh-play:hover{transform:scale(1.06)}
.wh-open small{font:600 11px var(--fb);letter-spacing:.24em;text-transform:uppercase;color:#cfc6b4}

.wh.at-logo .wh-open,.wh.at-end .wh-open{opacity:1;pointer-events:none}
.wh.on .wh-play,.wh.on .wh-open small,.wh.on .wh-k2{visibility:hidden}
.wh.on .wh-open{transition:opacity .45s}
.wh.at-end .wh-k{visibility:hidden}
.wh-lines{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.wh-lines p{grid-area:1/1;margin:0;font:400 clamp(30px,5vw,64px)/1.1 var(--fd);opacity:0;transform:translateY(10px);transition:opacity .9s,transform .9s;text-align:center;padding:0 20px}
.wh-lines p.on{opacity:1;transform:none}
.wh:not(.at-lines) .wh-lines p{opacity:0}
.wh-stage{position:absolute;inset:0}
.wh-scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vh;padding:5vh 5vw 11vh;opacity:0;transition:opacity .7s ease}
.wh-scene.on{opacity:1}
.wh-cap{text-align:center}.wh-cap .eyebrow,.wh-cap2 .eyebrow{color:var(--honey)}
.wh-cap h2,.wh-cap2 h2{font-size:clamp(26px,3.6vw,46px);margin-top:10px;color:#f3ede2}
.wh-body{width:100%;display:flex;justify-content:center;transform:translateY(14px) scale(.98);transition:transform 1.2s ease}
.wh-scene.on .wh-body{transform:none}
.wh-t{font-size:clamp(32px,4.6vw,58px);color:#f3ede2}
.wh-logos{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;width:min(1100px,100%)}
.wh-logos span{background:var(--paper);border-radius:18px;padding:34px 12px 18px;display:flex;flex-direction:column;align-items:center;gap:16px;opacity:0;transform:translateY(16px);animation:pop .6s ease forwards;animation-delay:calc(.25s + var(--i)*.35s)}
.wh-logos small{font:600 11px var(--fb);letter-spacing:.2em;text-transform:uppercase;color:var(--ink);opacity:.6}
@keyframes pop{to{opacity:1;transform:none}}
@keyframes popc{from{opacity:0;transform:translate(-50%,-50%) scale(.85)}to{opacity:1;transform:translate(-50%,-50%)}}
.wh-dirhead{display:flex;align-items:center;gap:16px;background:var(--paper);border-radius:99px;padding:10px 22px}
.wh-dirhead span{font:500 14px var(--fb);color:var(--ink)}
.wh-win{width:min(1060px,92vw);border-radius:12px;overflow:hidden;box-shadow:0 30px 80px #0008;background:#fff}
.ww-bar{display:flex;align-items:center;gap:6px;background:#ece7de;padding:9px 12px}.ww-bar i{width:10px;height:10px;border-radius:50%;background:#cfc6b4}
.ww-bar span{margin-left:12px;background:#fff;border-radius:6px;padding:3px 12px;font:12px var(--fb);color:#555;flex:0 1 320px}
.ww-pg{height:min(54vh,520px);overflow:hidden;position:relative}
.wh-win.short .ww-pg{height:auto}
.ww-in{width:1280px;transform-origin:0 0}
.wh-win.site .ww-in{animation:scrolldown 9s ease-in-out forwards}
@keyframes scrolldown{0%,20%{translate:0 0}100%{translate:0 -420px}}
.ww-in .st-switch,.ww-in .st-url{display:none}
.wh-today{width:min(980px,90vw,calc(52vh * 1.6));aspect-ratio:16/10;border-radius:12px;overflow:hidden;box-shadow:0 30px 80px #0008;position:relative;background:#f4efe6}
.wh-today img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.wh-ring7{position:relative;width:min(560px,80vw,60vh);aspect-ratio:1}
.wh-ring7 span{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;--ln:#dfe9d6;--fl:#2f4a3a;opacity:0;animation:popc .5s ease forwards;animation-delay:calc(.3s + var(--i)*.22s)}
.wh-ring7 span svg{width:clamp(56px,9vh,96px);height:auto}
.wh-ring7 b{font:500 13px var(--fb);color:#e6dccb}
.wh-jar{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}.wh-jar svg{width:clamp(80px,14vh,120px);height:auto}
.wh-score{width:min(720px,88vw);display:flex;flex-direction:column;gap:14px}
.wh-score div{display:grid;grid-template-columns:150px 1fr 60px;align-items:center;gap:16px;opacity:0;animation:pop .5s ease forwards;animation-delay:calc(.3s + var(--i)*.25s)}
.wh-score span{font:500 17px var(--fb);color:#e6dccb}.wh-score b{font:500 22px var(--fd);color:#f3ede2}
.wh-score i{height:14px;border-radius:9px;background:#ffffff18;position:relative;overflow:hidden}
.wh-score i::after{content:"";position:absolute;inset:0;width:var(--w);background:linear-gradient(90deg,var(--clay),var(--honey));border-radius:9px}
.wh-flow{position:relative;width:min(900px,90vw);height:min(46vh,420px)}
.wh-flow span{position:absolute;background:#f3ede2;color:var(--deep);font:600 15px var(--fb);padding:10px 18px;border-radius:99px;opacity:0;animation:pop .5s ease forwards;animation-delay:calc(.2s + var(--i)*.18s)}
.wh-hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:200px;height:200px;border-radius:50%;background:#f3ede2;color:var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;box-shadow:0 0 0 16px #f3ede222,0 0 0 34px #f3ede20d}
.wh-hub b{font:500 17px/1.25 var(--fd)}
.wh-mk3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:min(1000px,92vw)}.wh-mk3 div{background:#f3ede2;color:var(--deep);border-radius:16px;padding:26px 22px;opacity:0;animation:pop .5s ease forwards;animation-delay:calc(.3s + var(--i)*.35s)}.wh-mk3 b{display:block;font:400 54px/1 var(--fd);color:var(--clay);margin-bottom:10px}.wh-mk3 span{font-size:15px;color:#4a5148}
.wh-mkt{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;width:min(1000px,92vw)}
.wh-mkt div{background:#f3ede2;color:var(--deep);border-radius:16px;padding:24px 20px;min-height:170px;opacity:0;animation:pop .5s ease forwards;animation-delay:calc(.3s + var(--i)*.3s)}
.wh-mkt b{display:block;font:500 26px var(--fd);margin-bottom:10px}.wh-mkt span{font-size:15px;color:#4a5148}
.wh-leads{padding:22px 26px;background:#fffdf8;font-family:var(--fb)}
.wl-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}.wl-h b{font:500 22px var(--fd)}.wl-h span{color:#777;font-size:13px}
.wl-r{display:grid;grid-template-columns:1.4fr 1.1fr 1fr 1.2fr 40px;align-items:center;gap:14px;padding:11px 0;border-top:1px solid #eee5d6;font-size:14px;color:#444;opacity:0;animation:pop .4s ease forwards}
.wl-r:nth-child(2){animation-delay:.3s}.wl-r:nth-child(3){animation-delay:.6s}.wl-r:nth-child(4){animation-delay:.9s}.wl-r:nth-child(5){animation-delay:1.2s}.wl-r:nth-child(6){animation-delay:1.5s}
.wl-r b{color:#1d2620}.wl-r i{height:8px;border-radius:5px;background:#eee5d6;position:relative;overflow:hidden}.wl-r i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--good)}.wl-r em{font-style:normal;font-weight:600;color:var(--good)}
.wh-hq{position:relative;width:min(940px,92vw);height:min(470px,54vh)}
.wh-wires{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.wh-wires line{stroke:#d9a44e;stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-dasharray:4 5;opacity:0;animation:wire .5s ease forwards;animation-delay:calc(1.4s + var(--i)*.08s)}
@keyframes wire{to{opacity:.55}}
.wh-hq span{position:absolute;transform:translate(-50%,-50%);background:#f3ede2;color:var(--deep);font:600 14px var(--fb);padding:8px 15px;border-radius:99px;white-space:nowrap;opacity:0;animation:popc .45s ease forwards;animation-delay:calc(.2s + var(--i)*.1s);z-index:1}
.wh-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(230px,42vh,46vw);aspect-ratio:1;border-radius:50%;border:1.5px solid #d9a44e;background:#14201a;box-shadow:0 0 0 14px #d9a44e14,0 0 60px #0008;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;--mk:#f3ede2;--paper:#14201a}
.wh-core b{font:400 clamp(22px,3vh,30px) var(--fd)}.wh-core small{font:600 10px/1.5 var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--honey);max-width:72%;text-align:center}
.wh-cap2{text-align:center}
.wh-ctl{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:6px;padding:14px 18px;background:linear-gradient(transparent,#0008);opacity:0;transition:opacity .4s}
.wh.on:not(.at-end) .wh-ctl{opacity:1}
.wh-ctl button{background:none;border:0;color:#f3ede2;padding:6px;border-radius:8px;display:grid;place-items:center}
.wh-ctl button:hover{background:#ffffff18}
.wh[data-paused] [data-pp] svg path{d:path("M8 5v14l11-7z")}
[data-mute].off{opacity:.45}
.wh-bar{flex:1;height:4px;background:#ffffff30;border-radius:3px;cursor:pointer;margin:0 10px}.wh-bar i{display:block;height:100%;width:0;background:var(--honey);border-radius:3px}
.wh-time{font:12px var(--fb);color:#cfc6b4;min-width:76px;text-align:right}
.wh-skip{position:absolute;top:16px;right:16px;background:#ffffff18;border:0;color:#f3ede2;font:600 13px var(--fb);padding:7px 14px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .4s}
.wh.on:not(.at-end) .wh-skip{opacity:1;pointer-events:auto}
.wh-endcue{position:absolute;bottom:28px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 11px var(--fb);letter-spacing:.24em;text-transform:uppercase;color:#cfc6b4;opacity:0;transition:opacity 1s}
.wh.at-end .wh-endcue{opacity:1}.wh.at-end .wh-endcue svg{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.wh.at-end .wh-open::after{content:"One portal. One database. Every channel.";font:400 clamp(20px,2.4vw,30px) var(--fd);color:#e6dccb;margin-top:28px}

.wrap{max-width:1080px;margin:0 auto;padding:0 28px}
.wel-sect{padding:96px 0;text-align:center}.wel-sect.alt{background:#ebe4d6}
.wel-sect h2,.wel-cta h2{font-size:clamp(32px,4.4vw,54px);margin:14px 0 14px}
.wel-p{font-size:19px;color:var(--mut);max-width:640px;margin:0 auto 30px}
.cta-big{display:inline-flex;align-items:center;gap:12px;background:var(--green);color:#f3ede2;text-decoration:none;font:600 18px var(--fb);padding:18px 30px;border-radius:99px;border:0}
.cta-big:hover{background:var(--deep)}
.wel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:34px;text-align:left}

.wel-card:hover{transform:translateY(-3px);box-shadow:0 12px 30px #0000000f}
.wel-card svg{color:var(--clay);width:22px;height:22px}.wel-card b{font:500 21px var(--fd)}.wel-card span{color:var(--mut);font-size:15px}
.wel-cta{padding:110px 0;text-align:center;background:var(--deep);color:#f3ede2}.wel-cta p{color:#cfc6b4;font-size:18px;margin:0 0 30px}.wel-cta .eyebrow{color:var(--honey)}
.wel-cta .cta-big{background:var(--honey);color:var(--deep)}

/* ---------- pitch pages ---------- */
.pg{max-width:1120px;margin:0 auto;padding:56px 40px 100px}
.pg-hero{padding:20px 0 34px;max-width:860px}
.pg-hero h1{font-size:clamp(36px,4.8vw,62px);line-height:1.04;margin:14px 0 18px}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}

.note{font-size:13px;color:var(--mut)}
.src{font-size:12.5px;color:var(--mut)}.src a{color:var(--mut)}
.tag{display:inline-block;font:600 11px var(--fb);letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:99px;background:#e9e2d3;color:#4a5148}
