<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JGoCo</title>
<meta name="description" content="Marketing strategy, brand development and digital marketing. Brands, websites and the tools that run them.">
<meta property="og:title" content="JGoCo">
<meta property="og:description" content="Marketing strategy, brand development and digital marketing.">
<meta property="og:image" content="https://jgoco.me/img/og-card.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
<style>
  :root { --ink: #111; --paper: #fff; --muted: #6b6b6b; --soft: #c4c4c4; --bolt: #ffd400; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, system-ui, sans-serif; color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 28px clamp(16px, 5vw, 64px); }
  header img { height: 34px; width: auto; display: block; }
  header a { font-weight: 600; color: var(--ink); text-decoration: none; border-bottom: 2px solid var(--bolt); }
  .hero { padding: clamp(48px, 12vh, 140px) clamp(16px, 5vw, 64px) clamp(64px, 12vh, 140px); }
  .hero h1 { font-weight: 900; font-size: clamp(36px, 9vw, 132px); line-height: .95; letter-spacing: -.035em; text-transform: uppercase; }
  .hero h1 span { display: block; }
  .hero h1 span:nth-child(2) { color: var(--soft); }
  .hero p { margin-top: 32px; font-size: clamp(20px, 2.2vw, 28px); max-width: 26ch; line-height: 1.3; }
  .contact { background: var(--ink); color: var(--paper); padding: clamp(64px, 12vh, 140px) clamp(16px, 5vw, 64px); }
  .contact h2 { font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: #9a9a9a; margin-bottom: 20px; font-weight: 600; }
  .contact a { display: inline-flex; align-items: center; gap: .25em; color: var(--paper); text-decoration: none; font-weight: 900; font-size: clamp(28px, 6vw, 88px); letter-spacing: -.03em; overflow-wrap: anywhere; }
  .contact a svg { width: .6em; height: .85em; fill: var(--bolt); flex: none; }
  .contact a:hover span { text-decoration: underline; text-decoration-color: var(--bolt); text-underline-offset: .12em; }
  footer { padding: 24px clamp(16px, 5vw, 64px); font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <img src="img/jgoco-logo.png" alt="JGoCo">
  <a href="mailto:jordan@jgoco.me">Contact</a>
</header>
<main>
  <section class="hero">
    <h1><span>Marketing strategy</span><span>Brand development</span><span>Digital marketing</span></h1>
    <p>Brands, websites and the tools that run them.</p>
  </section>
  <section class="contact">
    <h2>Let's talk</h2>
    <a href="mailto:jordan@jgoco.me"><svg viewBox="0 0 14 20" aria-hidden="true"><path d="M9 0 0 11h6l-2 9 10-12H8z"/></svg><span>jordan@jgoco.me</span></a>
  </section>
</main>
<footer>© 2026 JGoCo</footer>
</body>
</html>
