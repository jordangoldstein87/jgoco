<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>The Slate · Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a production-office app. A dark slate rail of shows on the left, the working sheet on the right. */
:root{
  --bg:#ECEEF1; --panel:#FBFBFC; --sunk:#F3F4F6; --ink:#14161B; --soft:#424955; --mute:#5F6774; --line:#D8DCE2; --line2:#E6E8EC;
  --amber:#E3A23B; --amber-soft:#FBEFD9; --amber-tx:#7A4B06;
  --blue:#2452C7; --on-blue:#FBFBFC; --blue-soft:#E3EAFB; --blue-tx:#1D44A8;
  --over:#B03F0C; --over-soft:#FBE8DC; --under:#15659A; --under-soft:#DCEDF8; --ok:#1E7448; --ok-soft:#DDF1E5;
  --rail:#15171C; --rail-hi:#23262D; --rail-line:#2A2E36; --rail-ink:#E9EBEF; --rail-mute:#9AA2AF;
  --bubble:#E6E8EC; --bubble-ink:#14161B; --me:#2452C7; --me-ink:#FBFBFC;
  --paper:#FDFCF8; --paper-ink:#23252B; --paper-line:#D9D6CC;
  --display:'Archivo','Helvetica Neue',Arial,sans-serif; --text:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(20,22,27,.05),0 6px 20px rgba(20,22,27,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F13; --panel:#15181E; --sunk:#1B1F26; --ink:#ECEEF2; --soft:#C3C9D3; --mute:#959DAB; --line:#2B3039; --line2:#22262E;
  --amber:#EAAA4C; --amber-soft:#3A2A10; --amber-tx:#F3C77F;
  --blue:#86A8FF; --on-blue:#0D0F13; --blue-soft:#1B2643; --blue-tx:#A9C0FF;
  --over:#FF9B63; --over-soft:#3B2316; --under:#71C2F4; --under-soft:#13293A; --ok:#62D49B; --ok-soft:#133020;
  --rail:#08090C; --rail-hi:#181B21; --rail-line:#20242B; --rail-ink:#E9EBEF; --rail-mute:#8F97A5;
  --bubble:#262A32; --bubble-ink:#ECEEF2; --me:#3D66D6; --me-ink:#F4F6FA; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F13; --panel:#15181E; --sunk:#1B1F26; --ink:#ECEEF2; --soft:#C3C9D3; --mute:#959DAB; --line:#2B3039; --line2:#22262E;
  --amber:#EAAA4C; --amber-soft:#3A2A10; --amber-tx:#F3C77F;
  --blue:#86A8FF; --on-blue:#0D0F13; --blue-soft:#1B2643; --blue-tx:#A9C0FF;
  --over:#FF9B63; --over-soft:#3B2316; --under:#71C2F4; --under-soft:#13293A; --ok:#62D49B; --ok-soft:#133020;
  --rail:#08090C; --rail-hi:#181B21; --rail-line:#20242B; --rail-ink:#E9EBEF; --rail-mute:#8F97A5;
  --bubble:#262A32; --bubble-ink:#ECEEF2; --me:#3D66D6; --me-ink:#F4F6FA; --shadow:none; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--text);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rail)}
a{color:inherit;text-decoration:none}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tn{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
/* rail */
.rail{background:var(--rail);color:var(--rail-ink);position:sticky;top:0;height:100vh;overflow:auto;padding:20px 12px 20px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand b{display:block;font-family:var(--display);font-size:18px;font-weight:800;letter-spacing:.01em}
.brand small{display:block;color:var(--rail-mute);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a,.sh{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--rail-ink);font-weight:500}
.nav a:hover,.sh:hover{background:var(--rail-hi)}
.nav a.on,.sh.on{background:var(--rail-hi);box-shadow:inset 0 0 0 1px var(--rail-line)}
.nav .badge{margin-left:auto}
.rail-h{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--rail-mute);padding:0 10px}
.shows{display:flex;flex-direction:column;gap:2px;margin-top:-12px}
.sh .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh .ph{font-size:11px;color:var(--rail-mute)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--rail-line)}
.me b{display:block;font-weight:600}.me small{color:var(--rail-mute);font-size:12px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--amber);color:#2A1A03;flex:none;font-size:13px}
.demo{font-size:11.5px;color:var(--rail-mute);padding:0 10px}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--amber);color:#2A1A03;font-size:11.5px;font-weight:700;font-style:normal}
/* main */
.main{min-width:0;padding-block:28px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(0px,2vw,20px);display:flex;flex-direction:column;gap:22px}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.vh h1{font-size:32px;font-weight:800}
.season{font-weight:600;color:var(--mute);font-size:20px}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:600;margin-bottom:6px}
.sub{color:var(--soft);margin-top:6px;max-width:68ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow);min-width:0}
.panel h3{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi small{color:var(--mute);font-size:12px;font-weight:600}
.kpi b{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--soft)}
a.kpi:hover{border-color:var(--blue)}
.over{color:var(--over)}.under{color:var(--under)}.okc{color:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--soft);border:1px solid var(--line2);white-space:nowrap}
.ph-shoot{background:var(--amber-soft);color:var(--amber-tx);border-color:transparent}
.ph-prep{background:var(--blue-soft);color:var(--blue-tx);border-color:transparent}
.ph-post{background:var(--sunk);color:var(--soft)}
.ph-bid{background:var(--sunk);color:var(--mute)}
.p-ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.p-warn{background:var(--over-soft);color:var(--over);border-color:transparent}
.p-blue{background:var(--blue-soft);color:var(--blue-tx);border-color:transparent}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--soft)}
.btn.pri{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--mute)}.soft{color:var(--soft)}
.small{font-size:12.5px}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;transition:border-color .15s}
.card:hover{border-color:var(--blue)}
.c-top{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--soft);font-weight:600}
.c-top .pill{margin-left:auto}
.card h2{font-size:22px;font-weight:800}
.c-sub{color:var(--mute);font-size:13px;margin-top:-8px}
.c-prog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--soft)}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber);border-radius:99px}
.c-nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.c-nums small{display:block;font-size:11px;color:var(--mute);font-weight:600}
.c-nums b{font-size:15px;font-variant-numeric:tabular-nums}
.c-foot{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--soft);border-top:1px solid var(--line2);padding-top:10px;flex-wrap:wrap}
/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line2);align-items:flex-start}
.li:first-child{border-top:0;padding-top:0}
.li .t{font-size:12.5px;color:var(--mute);min-width:64px;font-variant-numeric:tabular-nums;padding-top:1px}
.li b{font-weight:600}
.li .grow{flex:1;min-width:0}
.ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none}
.ic svg{width:15px;height:15px}
.ic.over{background:var(--over-soft)}.ic.warn{background:var(--amber-soft);color:var(--amber-tx)}.ic.info{background:var(--blue-soft);color:var(--blue-tx)}.ic.ok{background:var(--ok-soft);color:var(--ok)}
/* tabs */
.show-h .numbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:1px;min-width:220px}
.numbox small{font-size:11px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.numbox b{font-size:19px}
.numbox span{font-size:12px;color:var(--soft)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs a{padding:9px 12px;font-weight:600;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs a.on{color:var(--ink);border-color:var(--amber)}
.tabs a:hover{color:var(--ink)}
.tabbody{display:flex;flex-direction:column;gap:16px}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.acct{font-family:var(--mono);font-size:12.5px;color:var(--soft)}
tr.grp td{background:var(--sunk);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
tr.sub td{font-weight:700;border-top:1px solid var(--line)}
tr.tot td{font-weight:800;background:var(--sunk);font-size:14px}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
tr.click td:first-child::before{content:"▸";display:inline-block;width:14px;color:var(--mute);transition:transform .15s}
tr.click.open td:first-child::before{transform:rotate(90deg)}
tr.det>td{background:var(--sunk);padding:4px 12px 14px 38px}
tr.det table{font-size:12.5px;background:var(--panel);border:1px solid var(--line2);border-radius:8px}
tr.det th{background:transparent}
/* globals */
.glob{display:flex;gap:12px;flex-wrap:wrap}
.step{display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:132px}
.step label{font-size:11.5px;color:var(--mute);font-weight:600}
.step div{display:flex;align-items:center;gap:8px}
.step button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--sunk);cursor:pointer;font-weight:700}
.step b{font-size:18px;font-family:var(--display);min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.step.chg{border-color:var(--amber)}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--amber-soft);color:var(--amber-tx);border-radius:10px;padding:10px 14px;font-weight:600}
.banner .btn{margin-left:auto}
/* ask bar */
.ask{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ask-h{display:flex;align-items:center;gap:8px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);font-size:13px;font-weight:500;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--blue)}
.chip.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-tx)}
.answer{background:var(--sunk);border-radius:10px;padding:12px 14px;line-height:1.55;max-width:90ch}
/* receipts */
.rc{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;transition:opacity .3s}
.rc.approved,.rc.returned{opacity:.72}
.slip{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:4px;padding:10px 9px;font-family:var(--mono);font-size:10.5px;line-height:1.5;display:flex;flex-direction:column;gap:1px;transform:rotate(-1.2deg);box-shadow:0 2px 6px rgba(0,0,0,.08);align-self:start}
.slip b{text-align:center;font-size:11.5px;margin-bottom:4px;letter-spacing:.04em;text-transform:uppercase}
.slip span{display:flex;justify-content:space-between;gap:6px}
.slip span i{font-style:normal;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.slip .tot{border-top:1px dashed var(--paper-line);margin-top:4px;padding-top:4px;font-weight:700}
.rc-b{display:flex;flex-direction:column;gap:8px;min-width:0}
.rc-h{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.amt{font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.rc-h .m{font-weight:600;color:var(--soft)}
.rc-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute)}
.rc-code{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);font-weight:600;flex-wrap:wrap}
select,input[type=text],input[type=number],input[type=time],textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;max-width:100%}
.flag{display:flex;gap:8px;align-items:flex-start;background:var(--over-soft);color:var(--over);border-radius:8px;padding:7px 10px;font-size:12.5px;font-weight:600}
.flag svg{width:14px;height:14px;flex:none;margin-top:2px}
.done{font-size:12.5px;font-weight:700;color:var(--ok)}
.done.returned{color:var(--over)}
.rc-list{display:flex;flex-direction:column;gap:12px}
.grid-rc{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
/* phone */
.phone{width:100%;max-width:310px;border-radius:38px;padding:10px;background:var(--rail);box-shadow:0 10px 40px rgba(0,0,0,.18);justify-self:center}
.ph-scr{background:var(--panel);border-radius:29px;overflow:hidden;height:560px;display:flex;flex-direction:column}
.ph-h{display:flex;align-items:center;gap:10px;padding:16px 14px 10px;border-bottom:1px solid var(--line2)}
.ph-h b{display:block;font-size:14px}.ph-h small{font-size:11.5px;color:var(--mute);font-family:var(--mono)}
.ph-av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.ph-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:84%;padding:8px 12px;border-radius:18px;font-size:13px;line-height:1.42}
.bub.me{align-self:flex-end;background:var(--me);color:var(--me-ink);border-bottom-right-radius:6px}
.bub.them{align-self:flex-start;background:var(--bubble);color:var(--bubble-ink);border-bottom-left-radius:6px}
.bub .slip{transform:none;font-size:9.5px;margin-bottom:6px;width:150px}
.ph-who{font-size:10.5px;color:var(--mute);align-self:flex-end;margin-bottom:-5px}
.typing{display:inline-flex;gap:4px;padding:11px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--mute);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
/* gpt */
.gpt{background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-height:580px;min-width:0}
.gpt-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.gpt-h b{font-size:15px}
.conn{margin-left:auto;font-size:12px;font-weight:600;color:var(--ok);background:var(--ok-soft);padding:3px 10px;border-radius:99px}
.gpt-m{flex:1;padding:18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.gq{align-self:flex-end;background:var(--sunk);padding:9px 14px;border-radius:18px;max-width:80%}
.ga{line-height:1.6;max-width:62ch}
.gpt-in{margin:12px 16px 16px;border:1px solid var(--line);border-radius:22px;padding:10px 16px;color:var(--mute)}
.duo{display:grid;grid-template-columns:310px 150px minmax(0,1fr);gap:18px;align-items:center}
.mem{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.mem .ln{width:100%;height:2px;background:linear-gradient(90deg,var(--line),var(--amber),var(--line))}
.mem b{font-family:var(--display);font-size:16px}
.mem span{font-size:12px;color:var(--soft)}
/* mail */
.mail{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:16px;align-items:start}
.mlist{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mi{display:flex;flex-direction:column;gap:2px;padding:11px 14px;border-top:1px solid var(--line2);cursor:pointer;width:100%;text-align:left;background:none;border-left:3px solid transparent;border-right:0;border-bottom:0}
.mi:first-child{border-top:0}
.mi:hover{background:var(--sunk)}
.mi.on{background:var(--blue-soft);border-left-color:var(--blue)}
.mi .f{font-weight:700;display:flex;justify-content:space-between;gap:8px}
.mi .f span{font-weight:500;font-size:12px;color:var(--mute)}
.mi .s{font-size:13px;color:var(--soft);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mi.unf{background:var(--amber-soft)}
.mdet{display:flex;flex-direction:column;gap:14px}
.note{border-left:3px solid var(--amber);padding:4px 0 4px 12px;line-height:1.6}
.todo{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line2);flex-wrap:wrap}

.conf{display:flex;flex-direction:column;gap:6px}
.cbar{height:10px;border-radius:99px;background:var(--line2);overflow:hidden;display:flex}

.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}

.rule{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}

 <div class="c-prog"><div class="bar"><i style="width:${Math.round(s.prog*100)}%"></i></div><span>${s.progTxt}</span></div>

function bAsks(s){const t=totals(s);
 return [
  ['Why is Locations over?',()=>{const r=rows(s).find(x=>x.n==='3600');return `Locations is at ${fmt(r.efc)} estimated against ${fmt(r.locked)} budgeted, ${fmt(r.var)} over (${pct(r.var/r.locked)}). Most of it is Pier Ten: three extra night shoots and longer police coverage. Bayside Café came in at $6,500, inside plan.`;}],
  ['What if we add two shoot days?',()=>{const g={...s.g0,SD:s.g0.SD+2};const d=budgetWith(s,g)-t.locked;return `Two more shoot days adds ${fmt(d)}, mostly crew labor, equipment weeks and catering. That takes the budget to ${mm(t.locked+d)}. Use the Shoot days control above to make it a working copy.`;}],
  ['Draft the network cost report',()=>{const o=rows(s).filter(r=>r.var/r.locked>.05);return `Drafted in Northlight’s template: ${ACCTS.length} accounts with budget, actual, committed, estimated final and variance. ${o.length} accounts are more than 5% over and need a note: ${o.map(r=>`${r.d} (${pct(r.var/r.locked)})`).join(', ')}. The notes are written. Read them before it goes.`;}],
  ['Start the pilot budget from this one',()=>{const d=SHOW.desert,dt=totals(d);return `Started Untitled Desert Project v1 from Saltwater’s accounts and rates: 1 episode, 15 shoot days, 6 prep weeks. First pass is ${mm(dt.locked)} before contingency. It’s on the Desert pilot’s Budget tab.`;}],
 ];}
TV.budget=s=>{
 const R=rows(s);const t=totals(s);const chg=['EP','SD','PW','WW'].some(k=>s.g[k]!==s.g0[k]);
 const stepper=(k,l)=>`<div class="step ${s.g[k]!==s.g0[k]?'chg':''}"><label>${l}</label><div><button data-act="g-" data-k="${k}" aria-label="Fewer ${l}">−</button><b>${s.g[k]}</b><button data-act="g+" data-k="${k}" aria-label="More ${l}">+</button></div></div>`;
 const A=bAsks(s);
 let body='';GROUPS.forEach(([g,gl])=>{const gr=R.filter(r=>r.g===g);if(!gr.length)return;const st={locked:0,work:0,act:0,com:0,efc:0};gr.forEach(r=>{for(const k in st)st[k]+=r[k];});
  body+=`<tr class="grp"><td colspan="${chg?8:7}">${gl}</td></tr>`;

 if(a==='meet'){calAdded['meet'+el.dataset.i]=1;toast('Added to Saltwater.');render();return;}
 if(a==='reqchip'){$('#reqTx').value=el.textContent;return;}
 if(a==='reqsend'){const t=$('#reqTx').value.trim();if(!t){$('#reqTx').focus();return;}const r={t,st:'Scoping',plan:PLANS[t]||['We read it and scope it with you','A preview on your real show','Live when you say so']};reqs.unshift(r);render();setTimeout(()=>{r.st='Preview ready';if(view==='build')render();},1400);return;}
});
document.addEventListener('change',e=>{const el=e.target;const a=el.dataset.act;
 if(a==='recode'){const r=RC.find(x=>x.id===el.dataset.id);r.acct=el.value;toast(`Recoded to ${el.value}. It’ll code ${r.m} this way next time.`);return;}
 if(a==='crewchk'){crewSel[el.dataset.i]=el.checked;render();return;}
 if(a==='todo'){todoDone[el.dataset.i]=el.checked;render();return;}
 if(a==='bcall'){bCall=+el.value;render();return;}
 if(a==='catcall'){CAT.call=+el.value;render();return;}
 if(a==='catsec'){CAT.second=el.value==='1';render();return;}
 if(a==='rule'){RULES[el.dataset.k]=Math.max(0,+el.value||0);toast(el.dataset.k==='limit'?`Saved. Receipts over ${fmt(RULES.limit)} now need a PO.`:`Saved. Lunch is ${fmt(RULES.lunch)} a head from Day 25.`);return;}
 if(a==='cat'){CAT[el.dataset.k]=Math.max(0,+el.value||0);render();const f=$('#c-'+el.dataset.k);f&&f.focus();return;}
});
document.addEventListener('input',e=>{if(e.target.id==='locq'){locQ=e.target.value;const p=e.target.selectionStart;render();const f=$('#locq');f.focus();f.setSelectionRange(p,p);}});
window.addEventListener('hashchange',route);
setInterval(()=>{if(view==='connect'){pipeStep=(pipeStep+1)%PIPE.length;document.querySelectorAll('.pp').forEach((p,i)=>p.classList.toggle('lit',i===pipeStep));}},1800);
const Q=new URLSearchParams(location.search);
if(Q.has('open'))openAcct=Q.get('open');if(Q.has('bask'))bAns=+Q.get('bask');if(Q.has('lochit')){locHit=true;locSel='motel';}
if(Q.has('ask'))askSel=+Q.get('ask');if(Q.has('hosp'))CS.hospital=['Harbor Medical Center, emergency','2.1 mi · 7 min from Pier Ten · open 24 hours'];
if(Q.has('crew')){[0,2,4,10].forEach(i=>crewSel[i]=true);crewAsk={n:4,rep:{0:REPLIES[0],2:REPLIES[1],4:REPLIES[2],10:null}};}
if(Q.has('cal')){calAdded.s1=1;calAdded.s2=1;}
if(Q.has('step'))bStep=+Q.get('step');if(Q.has('bfill')){bHosp=true;bOk={0:1,2:1};bOn[4]=1;}if(Q.has('bsent')){bSent=true;bConf=71;bStatus='approved';}
if(Q.has('pending')){bStatus='pending';bStep=4;bHosp=true;bOk={0:1,3:1};bOn[4]=1;}if(Q.has('lp'))bRole='sterling';
if(Q.has('week'))calMode='week';
route();
})();
</script>
