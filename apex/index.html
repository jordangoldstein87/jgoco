<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><meta property="og:type" content="website"><meta property="og:url" content="https://jgoco.me/apex/"><meta property="og:title" content="Apex Construction, rebuilt"><meta property="og:description" content="Put down the spreadsheets. Pick the details back up."><meta property="og:image" content="https://jgoco.me/apex/img/og-card.jpg?v=1"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://jgoco.me/apex/img/og-card.jpg?v=1"></head><body><title>Apex Construction · Rebuilt</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<link rel="icon" href="img/mark-blue.png">
<style>
:root{--ink:#070c26;--ink2:#0d1540;--ink3:#16205a;--blue:#0018b2;--blue2:#2a4bff;--sky:#9db4ff;--race:#ff4a1c;--gold:#ffc23d;--ok:#2fd389;--warn:#ffb020;--bad:#ff5a5a;--paper:#f3f5fb;--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.18);--mute:rgba(235,240,255,.66);--txt:#eef2ff;--disp:'Fjalla One',Impact,sans-serif;--body:'Source Sans 3',system-ui,sans-serif;--nav:240px}
*{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--txt);font:18px/1.5 var(--body);overflow-x:hidden}
a{color:inherit}button{font:inherit;cursor:pointer}img{max-width:100%;display:block}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,.disp{font-family:var(--disp);font-weight:400;letter-spacing:.01em;line-height:1.05;margin:0}
/* ---------- nav ---------- */
#lnav{position:fixed;inset:0 auto 0 0;width:var(--nav);background:linear-gradient(180deg,#050a22,#0a1236);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;padding:22px 14px}
#lnav .brandmk{display:flex;align-items:center;gap:10px;padding:0 8px 18px;text-decoration:none}
#lnav .brandmk img{width:44px}
#lnav .brandmk b{font-family:var(--disp);font-size:22px;letter-spacing:.06em;display:block;line-height:1}
#lnav .brandmk small{display:block;font-size:11px;letter-spacing:.2em;color:var(--sky);margin-top:3px}
#lnav-links{display:flex;flex-direction:column;gap:2px;overflow:auto}
.nv-head{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(157,180,255,.6);padding:16px 10px 6px}
#lnav-links a,#mnav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--mute);font-weight:600;font-size:15.5px}
#lnav-links a:hover,#mnav a:hover{background:rgba(255,255,255,.05);color:#fff}
#lnav-links a.on,#mnav a.on{background:linear-gradient(90deg,rgba(42,75,255,.35),rgba(42,75,255,.08));color:#fff;box-shadow:inset 3px 0 0 var(--race)}
#lnav .foot{margin-top:auto;font-size:12px;color:rgba(235,240,255,.4);padding:12px 10px 0;border-top:1px solid var(--line)}
#top{display:none}
main{margin-left:var(--nav);min-height:100vh}
html.rail #lnav{display:none}html.rail main{margin-left:0}
html.cap .notes-btn{display:none!important}
/* ---------- shared ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 40px}
.sec{padding:84px 0;position:relative}
.kick{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--race);font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.kick:before{content:"";width:26px;height:3px;background:var(--race);display:inline-block}
.h1{font-size:clamp(46px,6.4vw,92px)}
.h2{font-size:clamp(36px,4.6vw,62px)}
.h3{font-size:clamp(24px,2.4vw,32px)}
.lede{font-size:clamp(19px,1.6vw,23px);color:var(--mute);max-width:760px;margin:18px 0 0}
.mute{color:var(--mute)}
.sample{display:inline-block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;background:rgba(255,194,61,.14);color:var(--gold);padding:3px 8px;border-radius:6px;vertical-align:middle}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--sky)}
.tag.ok{background:rgba(47,211,137,.14);color:var(--ok)}.tag.warn{background:rgba(255,176,32,.14);color:var(--warn)}.tag.bad{background:rgba(255,90,90,.14);color:var(--bad)}.tag.race{background:rgba(255,74,28,.16);color:#ff8a66}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 22px;border-radius:12px;border:0;background:var(--race);color:#fff;font-weight:800;text-decoration:none;font-size:17px;box-shadow:0 10px 30px -10px rgba(255,74,28,.7)}
.btn.ghost{background:rgba(255,255,255,.07);box-shadow:none;border:1px solid var(--line2)}
.btn.blue{background:var(--blue2);box-shadow:0 10px 30px -10px rgba(42,75,255,.8)}
.card{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:18px;padding:24px}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.rise{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}.rise.in{opacity:1;transform:none}
html.cap .rise{opacity:1;transform:none;transition:none}
.check{background:repeating-conic-gradient(#fff 0 25%,#0b0b0b 0 50%) 0 0/16px 16px}
.stripe{height:6px;background:linear-gradient(90deg,var(--blue) 0 60%,#fff 60% 66%,var(--race) 66%)}
.src{font-size:13px;color:rgba(235,240,255,.45);margin-top:10px}
.src a{color:rgba(157,180,255,.8)}
.ic{width:20px;height:20px;flex:none}
/* ---------- welcome / video ---------- */
.wh{position:relative;height:100vh;min-height:620px;overflow:hidden;background:#000}
.wh-bg{position:absolute;inset:-4%;background:center/cover no-repeat;transform:scale(1.02);filter:saturate(1.05)}
.wh.on .wh-bg{animation:push 22s linear forwards}
@keyframes push{from{transform:scale(1.02)}to{transform:scale(1.2)}}
.wh-shade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(7,12,38,.25),rgba(7,12,38,.88) 75%),linear-gradient(180deg,rgba(7,12,38,.5),rgba(7,12,38,.1) 40%,rgba(7,12,38,.95))}
.wh-front{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;transition:opacity .8s}
.wh-front img{width:min(300px,52vw);filter:drop-shadow(0 10px 40px rgba(0,0,0,.5))}
.wh-front h1{font-size:clamp(40px,6vw,86px);margin-top:26px;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.wh-front h1 em{font-style:normal;color:var(--race)}
.wh-front p{font-size:clamp(18px,1.7vw,24px);color:#dfe6ff;margin:14px 0 30px;max-width:720px}
.play{display:inline-flex;align-items:center;gap:14px;padding:16px 28px 16px 18px;border-radius:99px;border:0;background:#fff;color:var(--ink);font-weight:800;font-size:19px;box-shadow:0 20px 60px -10px rgba(42,75,255,.8)}
.play i{width:46px;height:46px;border-radius:50%;background:var(--race);display:grid;place-items:center}
.play i svg{fill:#fff;margin-left:3px}
.wh.on .wh-front{opacity:0;pointer-events:none}
.wh-stage{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .6s}
.wh.on .wh-stage{opacity:1;pointer-events:auto}
.wh-stage{background:radial-gradient(ellipse at 50% 40%,rgba(22,32,90,.92),rgba(5,9,30,.97) 70%);transition:opacity .6s,background .8s}
.wh[data-scene=lines] .wh-stage,.wh[data-scene=race] .wh-stage,.wh[data-scene=end] .wh-stage,.wh[data-scene=headline] .wh-stage{background:transparent}
html.cap .wh-scene *,html.cap .wh-stage,html.cap .wh-front{animation:none!important;transition:none!important}
.wh-scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:70px 60px 90px}
.wh-scene>*{animation:sIn .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes sIn{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}
.wh-scene.out>*{animation:sOut .5s ease both}
@keyframes sOut{to{opacity:0;transform:translateY(-14px)}}
.wh-bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;padding:0 24px 22px;align-items:center;z-index:5}
.wh-bar .seg{flex:1;height:4px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden;cursor:pointer}
.wh-bar .seg i{display:block;height:100%;width:0;background:#fff}
.wh-bar button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:99px;width:38px;height:38px;display:grid;place-items:center;flex:none}
.wh-cap{position:absolute;left:0;right:0;bottom:46px;text-align:center;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.6);z-index:5}
.v-line{font-family:var(--disp);font-size:clamp(40px,6.4vw,96px);text-align:center;text-shadow:0 8px 40px rgba(0,0,0,.6);line-height:1.04}
.v-line em{font-style:normal;color:var(--race)}
.v-line small{display:block;font-family:var(--body);font-size:clamp(17px,1.6vw,24px);color:#dfe6ff;margin-top:18px;letter-spacing:0;font-weight:600}
.v-stack{display:flex;flex-direction:column;align-items:center;gap:26px;width:100%;max-width:1200px}
.v-title{font-family:var(--disp);font-size:clamp(30px,3.8vw,52px);text-align:center}
.v-title small{display:block;font-family:var(--body);font-size:clamp(15px,1.3vw,19px);color:var(--mute);margin-top:8px}
.v-win{width:min(1060px,92vw);border-radius:14px;overflow:hidden;box-shadow:0 40px 100px -20px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.12);background:#fff}
.v-win .bar{height:30px;background:#e9ecf3;display:flex;align-items:center;gap:6px;padding:0 12px}
.v-win .bar i{width:10px;height:10px;border-radius:50%;background:#c9cfdc}
.v-win .bar span{margin-left:12px;font-size:12px;color:#5b6378;background:#fff;border-radius:6px;padding:2px 12px}
.v-win img{width:100%;aspect-ratio:16/9;object-fit:cover;object-position:top}
.v-flow{display:grid;grid-template-columns:1fr auto 1fr;gap:30px;align-items:center;width:100%}
.v-list{display:flex;flex-direction:column;gap:10px}
.v-list div{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:700;display:flex;gap:10px;align-items:center;animation:sIn .6s both}
.v-core{width:220px;height:220px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(42,75,255,.5),rgba(42,75,255,.05) 70%);border:1px solid rgba(157,180,255,.4);position:relative}
.v-core img{width:120px}
.v-core:after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px dashed rgba(255,74,28,.5);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.v-feed{width:min(900px,92vw);display:flex;flex-direction:column;gap:10px}
.v-feed .row{display:grid;grid-template-columns:auto 1fr auto auto;gap:16px;align-items:center;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:14px;padding:14px 18px;animation:sIn .6s both}
.v-feed .row b{font-size:18px}.v-feed .row small{display:block;color:var(--mute);font-size:14px}
.score{font-family:var(--disp);font-size:26px;color:var(--ok)}
.v-rcpt{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:min(1000px,92vw)}
.v-rcpt .r{background:#fbf8f0;color:#222;border-radius:6px;padding:16px;font:14px/1.4 ui-monospace,Menlo,monospace;transform:rotate(var(--r));animation:drop .8s cubic-bezier(.2,.9,.3,1.2) both;position:relative}
.v-rcpt .r:after{content:attr(data-job);position:absolute;right:-10px;top:-12px;background:var(--race);color:#fff;font:800 12px var(--body);padding:5px 10px;border-radius:99px;letter-spacing:.04em;animation:sIn .4s both;animation-delay:inherit}
@keyframes drop{from{opacity:0;transform:translateY(-60px) rotate(0)}to{opacity:1}}
.v-end img{width:min(360px,60vw)}
/* ---------- the new site (mock) ---------- */
.ns-frame{border-radius:16px;overflow:hidden;background:#fff;color:#141a33;box-shadow:0 40px 120px -30px rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.15)}
.ns-chrome{height:40px;background:#e8ebf2;display:flex;align-items:center;gap:7px;padding:0 14px}
.ns-chrome i{width:12px;height:12px;border-radius:50%;background:#cfd4df}
.ns-chrome span{margin-left:14px;font-size:13px;background:#fff;border-radius:7px;padding:4px 14px;color:#4b5470;flex:1;max-width:420px}
.ns{--b:#0018b2;--b2:#1435e0;--r:#ff4a1c;font-family:var(--body)}
.ns a{text-decoration:none}
.ns-top{display:flex;align-items:center;gap:24px;padding:14px 34px;background:#fff;border-bottom:1px solid #e6e9f2;position:sticky;top:0;z-index:3}
.ns-top img{height:58px}
.ns-top nav{display:flex;gap:22px;margin-left:auto;font-weight:700;font-size:15px;color:#2a3150}
.ns-top .ns-call{background:var(--b);color:#fff;padding:10px 16px;border-radius:10px;font-weight:800;font-size:15px}
.ns-hero{position:relative;min-height:600px;display:flex;align-items:flex-end;color:#fff;background:#0a0f2c center/cover}
.ns-hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,12,80,.92),rgba(0,12,80,.55) 55%,rgba(0,12,80,.1)),linear-gradient(0deg,rgba(0,8,50,.6),transparent 50%)}
.ns-hero>div{position:relative;padding:60px 48px;max-width:780px}
.ns-hero h1{font-size:clamp(42px,5.2vw,74px);line-height:1}
.ns-hero p{font-size:20px;opacity:.92;margin:16px 0 26px}
.ns-hero .ns-ctas{display:flex;gap:12px;flex-wrap:wrap}
.ns-btn{display:inline-block;background:var(--r);color:#fff;font-weight:800;padding:14px 22px;border-radius:10px;font-size:17px;border:0}
.ns-btn.w{background:#fff;color:var(--b)}
.ns-trust{display:flex;gap:0;background:var(--b);color:#fff;flex-wrap:wrap}
.ns-trust div{flex:1;min-width:180px;padding:18px 24px;border-right:1px solid rgba(255,255,255,.15)}
.ns-trust b{font-family:var(--disp);font-size:28px;display:block;font-weight:400}
.ns-trust span{font-size:14px;opacity:.85}
.ns-sec{padding:70px 48px}
.ns-sec h2{font-size:clamp(32px,3.4vw,46px);color:#0b1240}
.ns-sec .ns-k{color:var(--r);font-weight:800;letter-spacing:.18em;font-size:13px;text-transform:uppercase;margin-bottom:10px}
.ns-svc{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
.ns-svc div{border:1px solid #e3e7f1;border-radius:14px;padding:22px;background:#fafbff;transition:.2s}
.ns-svc div:hover{border-color:var(--b);transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(0,24,178,.5)}
.ns-svc b{font-size:19px;display:block;color:#0b1240;margin:10px 0 6px}
.ns-svc p{font-size:15px;color:#4b5470;margin:0}
.ns-svc .ico{width:44px;height:44px;border-radius:12px;background:#eaefff;display:grid;place-items:center;color:var(--b)}
.ns-work{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:200px;gap:12px;margin-top:28px}
.ns-work figure{margin:0;border-radius:14px;overflow:hidden;position:relative;background:#ddd}
.ns-work figure:first-child{grid-row:span 2;grid-column:span 2}
.ns-work img{width:100%;height:100%;object-fit:cover}
.ns-work figcaption{position:absolute;left:0;right:0;bottom:0;padding:14px;color:#fff;font-weight:700;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);font-size:15px}
.ns-rev{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
.ns-rev .rv{border:1px solid #e3e7f1;border-radius:14px;padding:20px;background:#fff}
.ns-rev .st{color:#f5a623;letter-spacing:2px;font-size:17px}
.ns-rev p{font-size:16px;color:#2a3150;margin:10px 0}
.ns-rev small{color:#6b7390;font-size:13px;display:flex;align-items:center;gap:6px}
.ns-score{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px}
.ns-score div{display:flex;align-items:center;gap:10px;border:1px solid #e3e7f1;border-radius:12px;padding:10px 14px;background:#fff;font-size:14px;color:#4b5470}
.ns-score b{font-size:20px;color:#0b1240}
.ns-form{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;background:#0b1240;color:#fff;border-radius:22px;padding:44px;margin-top:10px}
.ns-form h2{color:#fff}
.ns-form form{display:grid;gap:12px}
.ns-form label{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#9db4ff;display:grid;gap:6px}
.ns-form input,.ns-form select,.ns-form textarea{font:inherit;font-size:16px;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;width:100%}
.ns-form select option{color:#000}
.ns-form .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ns-form .chips{display:flex;flex-wrap:wrap;gap:8px}
.ns-form .chips label{text-transform:none;letter-spacing:0;font-size:14px;color:#fff;display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.07);padding:7px 11px;border-radius:99px;font-weight:600;cursor:pointer}
.ns-form .chips input{width:auto}
.ns-race{display:grid;grid-template-columns:1.2fr 1fr;gap:0;background:#0a0a0a;color:#fff;border-radius:22px;overflow:hidden}
.ns-race img{width:100%;height:100%;object-fit:cover;min-height:360px}
.ns-race>div{padding:44px;position:relative}
.ns-race h2{color:#fff}
.ns-race .flagbar{position:absolute;left:0;right:0;top:0;height:14px}
.ns-foot{background:#060b2a;color:#c9d2f0;padding:40px 48px;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:24px;font-size:14px}
.ns-foot b{color:#fff;display:block;margin-bottom:8px;font-size:15px}
.ns-foot a{display:block;color:#c9d2f0;margin:4px 0}
.ns-area{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.ns-area span{background:#eef2ff;color:#0018b2;font-weight:700;font-size:14px;padding:6px 12px;border-radius:99px}
.ns-sync{display:flex;align-items:center;gap:8px;font-size:12px;color:#6b7390;margin-top:12px}
.ns-sync i{width:8px;height:8px;border-radius:50%;background:#2fd389;box-shadow:0 0 0 4px rgba(47,211,137,.2)}
/* ---------- hub (portal mock) ---------- */
.hb{display:grid;grid-template-columns:210px 1fr;background:#f4f6fb;color:#151b36;border-radius:18px;overflow:hidden;min-height:720px;box-shadow:0 40px 120px -30px rgba(0,0,0,.9);border:1px solid rgba(255,255,255,.14)}
.hb-side{background:#0b1240;color:#c9d2f0;padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.hb-side .hb-me{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:8px}
.hb-side .hb-me img{width:34px}
.hb-side .hb-me b{color:#fff;font-size:15px;display:block;line-height:1.1}.hb-side .hb-me small{font-size:11px;color:#8ea2e8}
.hb-side button{display:flex;align-items:center;gap:9px;background:none;border:0;color:#c9d2f0;padding:8px 10px;border-radius:9px;font-size:14px;font-weight:600;text-align:left;width:100%}
.hb-side button:hover{background:rgba(255,255,255,.06);color:#fff}
.hb-side button.on{background:#1d2a78;color:#fff;box-shadow:inset 3px 0 0 var(--race)}
.hb-side button em{margin-left:auto;font-style:normal;font-size:11px;background:var(--race);color:#fff;border-radius:99px;padding:1px 7px;font-weight:800}
.hb-main{padding:22px 26px;overflow:auto;max-height:820px}
.hb-h{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.hb-h h3{font-family:var(--body);font-weight:800;font-size:24px;color:#0b1240;line-height:1.1}
.hb-h p{margin:2px 0 0;color:#5b6378;font-size:14px}
.hb-h .sp{margin-left:auto;display:flex;gap:8px}
.hb-b{background:#0018b2;color:#fff;border:0;border-radius:9px;padding:8px 13px;font-weight:700;font-size:13px}
.hb-b.g{background:#fff;color:#0018b2;border:1px solid #d8def0}
