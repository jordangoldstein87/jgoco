<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JGoCo Office">
<title>JGoCo Office</title>
<link rel="icon" type="image/png" href="../img/favicon.png">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
<style>
  :root { --ink: #111; --paper: #fafafa; --card: #fff; --muted: #6b6b6b; --soft: #c4c4c4; --line: #e8e8e8; --bolt: #ffd400; --go: #0a7d3c; --gutter: 16px; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, system-ui, sans-serif; color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; font-size: 16px; }
  button, input, select { font: inherit; color: inherit; }
  a { color: inherit; }

  /* Lock screen */
  .lock { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px var(--gutter); background: var(--ink); color: #fff; }
  .lock form { width: min(380px, 100%); display: grid; gap: 16px; }
  .lock .logo { width: 180px; margin-bottom: 12px; }
  .lock h1 { font-weight: 900; font-size: 36px; letter-spacing: -.03em; }
  .lock input[type=password] { width: 100%; padding: 15px 16px; border-radius: 14px; border: 1px solid #333; background: #1c1c1c; font-size: 18px; }
  .lock input:focus { outline: 2px solid var(--bolt); }
  .lock label.keep { display: flex; gap: 10px; align-items: center; color: #bbb; font-size: 15px; }
  .lock .err { color: #ff8a80; font-size: 15px; min-height: 20px; }
  .btn { display: inline-flex; justify-content: center; align-items: center; gap: 10px; border: 0; border-radius: 999px; padding: 14px 22px; font-weight: 900; background: var(--bolt); color: var(--ink); cursor: pointer; text-decoration: none; }
  .btn.dark { background: var(--ink); color: #fff; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); font-weight: 600; }
  .btn img { height: 1.1em; }
  .btn[disabled] { opacity: .6; }

  /* App */
  .app { display: none; padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
  .app.on { display: block; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; padding: 14px var(--gutter); background: var(--ink); color: #fff; }
  header img { height: 22px; }
  header .meta { font-size: 13px; color: #aaa; }
  header button { background: none; border: 0; color: #fff; font-weight: 600; font-size: 14px; border-bottom: 2px solid var(--bolt); cursor: pointer; }
  main { padding: 18px var(--gutter); max-width: 1100px; margin: 0 auto; display: grid; gap: 14px; }
  h2 { font-weight: 900; font-size: 28px; letter-spacing: -.025em; margin: 8px 0 2px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile, .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .tile b { display: block; font-weight: 900; font-size: 28px; letter-spacing: -.02em; margin: 6px 0 2px; }
  .tile span { color: var(--muted); font-size: 14px; }
  .tile.hot { border: 2px solid var(--bolt); }
  .list { display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; }
  .row .name { font-weight: 700; }
  .row .sub { grid-column: 1 / -1; color: var(--muted); font-size: 14px; }
  .row .num { font-weight: 900; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #eee; color: #555; vertical-align: 2px; margin-left: 6px; }
  .pill.bill { background: #e3f4ea; color: var(--go); }
  .pill.mac { background: #fff4bf; color: #6b5800; }
  .seg { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .seg button { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; cursor: pointer; }
  .seg button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  td { padding: 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 12px; }
  tr:last-child td { border-bottom: 0; }
  tr.total td { font-weight: 900; border-top: 2px solid var(--ink); }
  .pay { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .pay div { border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .pay small { color: var(--muted); font-size: 13px; display: block; }
  .pay b { font-weight: 900; font-size: 20px; }
  .private { margin-top: 12px; background: #fffbe0; border-radius: 12px; padding: 12px; font-size: 14px; line-height: 1.45; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .tool { display: grid; gap: 4px; }
  .tool p { color: var(--muted); font-size: 14px; }
  .empty { color: var(--muted); }
  .ai-sub { display: none; }
  .form { display: grid; gap: 14px; }
  .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .fields label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .fields input, .fields select { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); font-size: 16px; font-weight: 400; }
  .fields label[hidden] { display: none; }
  .group { display: grid; gap: 10px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  .group h3 { font-weight: 900; font-size: 19px; letter-spacing: -.01em; }
  .group p { color: var(--muted); font-size: 14px; line-height: 1.4; margin-top: -6px; }
  .fields input:focus, .fields select:focus { outline: 2px solid var(--bolt); border-color: var(--ink); }
  @media (max-width: 420px) { .fields { grid-template-columns: 1fr; } }
  .section { display: grid; gap: 6px; text-decoration: none; cursor: pointer; text-align: left; width: 100%; border: 1px solid var(--line); }
  .section .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .section b.big { font-weight: 900; font-size: 30px; letter-spacing: -.02em; }
  .section p { color: var(--muted); font-size: 14px; line-height: 1.4; }
  .section .go { font-weight: 600; font-size: 14px; border-bottom: 2px solid var(--bolt); justify-self: start; }
  .section.client { border: 2px solid var(--bolt); }
  .lead { color: var(--muted); font-size: 15px; line-height: 1.45; margin-top: -4px; }
  .stat { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 4px; }
  .stat div small { display: block; color: var(--muted); font-size: 13px; }
  .stat div b { font-weight: 900; font-size: 22px; }
  @media (max-width: 560px) { td.ai { display: none; } .ai-sub { display: inline; } }

  /* Invoices */
  .lines { display: grid; gap: 8px; }
  .line { display: grid; grid-template-columns: minmax(0, 1fr) 130px 36px; gap: 8px; align-items: center; }
  .line input { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); font-size: 16px; }
  .line input:focus { outline: 2px solid var(--bolt); border-color: var(--ink); }
  .x { border: 1px solid var(--line); background: var(--card); border-radius: 10px; height: 44px; cursor: pointer; font-weight: 900; color: var(--muted); }
  .pill.sent { background: #e8f0ff; color: #1d4ed8; }
  .pill.paid { background: #e3f4ea; color: var(--go); }
  .pill.void { background: #f3f3f3; color: #999; text-decoration: line-through; }
  .pill.draft { background: #fff4bf; color: #6b5800; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions .btn { padding: 11px 16px; font-size: 15px; }
  .linkbox { display: flex; gap: 8px; align-items: center; }
  .linkbox input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; background: #f7f7f7; }
  @media (max-width: 480px) { .line { grid-template-columns: minmax(0, 1fr) 100px 36px; } }

  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: repeat(6, 1fr); background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav.tabs button { border: 0; background: none; padding: 12px 4px 14px; font-weight: 600; font-size: 13px; color: var(--muted); cursor: pointer; border-top: 3px solid transparent; }
  nav.tabs button.on { color: var(--ink); border-top-color: var(--bolt); }

  @media (min-width: 900px) {
    :root { --gutter: 32px; }
    .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    nav.tabs { position: sticky; top: 50px; bottom: auto; max-width: 1100px; margin: 0 auto; grid-template-columns: repeat(6, max-content); gap: 6px; background: none; border: 0; padding: 14px var(--gutter) 0; }
    nav.tabs button { border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; background: var(--card); }
    nav.tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
    .app { padding-bottom: 40px; }
  }
</style>
</head>
<body>
<section class="lock" id="lock">
  <form id="unlock" autocomplete="on">
    <img class="logo" src="../img/jgoco-logo-yellow.png" alt="JGoCo">
    <h1>Back office</h1>
    <input type="text" name="username" value="jordan" autocomplete="username" hidden>
    <input type="password" id="pass" autocomplete="current-password" placeholder="Password" required>
    <label class="keep"><input type="checkbox" id="keep" checked> Keep me signed in on this device</label>
    <button class="btn" type="submit" id="go"><img src="../img/bolt-black.png" alt="">Unlock</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</section>

<div class="app" id="app">
  <header>
    <img src="../img/jgoco-logo-yellow.png" alt="JGoCo">
    <span class="meta" id="updated"></span>
    <button type="button" id="lockBtn">Lock</button>
  </header>
  <nav class="tabs" id="tabs">
    <button class="on" data-tab="home">Home</button>
    <button data-tab="accounts">Accounts</button>
    <button data-tab="invoices">Invoices</button>
    <button data-tab="expenses">Expenses</button>
    <button data-tab="reference">Reference</button>
    <button data-tab="work">Projects</button>
  </nav>
  <main id="view"></main>
</div>

<script>
  // The data is AES-256-GCM encrypted with a key derived from Jordan's password (PBKDF2-SHA256).
  // Nothing readable is on the server; the page decrypts it here. "Keep me signed in" stores the
  // derived key in this browser as a key that can be used but not read back out.
  const $ = (s) => document.querySelector(s);
  const money = (n) => "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const money0 = (n) => "$" + Math.round(Number(n)).toLocaleString("en-US");
  const cents = (c) => money(c / 100);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);
  const monthName = (m) => new Date(m + "-15").toLocaleDateString("en-US", { month: "long", year: "numeric" });
  const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

  let sealed, data, cryptoKey, settings, editing = null, saveNote = "", tab = "home", month, invEditing = null, invDraft = null;

  async function deriveKey(pass, salt, iterations) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  }

  async function open(key) {
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(sealed.iv) }, key, fromB64(sealed.data));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  // A tiny IndexedDB store for the remembered key.
  function store(mode, fn) {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open("jgoco-office", 1);
      req.onupgradeneeded = () => req.result.createObjectStore("keys");
      req.onerror = () => reject(req.error);
      req.onsuccess = () => {
        const tx = req.result.transaction("keys", mode);
        const r = fn(tx.objectStore("keys"));
        tx.oncomplete = () => resolve(r && r.result);
        tx.onerror = () => reject(tx.error);
      };
    });
  }
  // v2 keys can also encrypt, which saving account settings needs.
  const saveKey = (k) => store("readwrite", (s) => s.put(k, sealed.salt + ":v2")).catch(() => {});
  const loadKey = () => store("readonly", (s) => s.get(sealed.salt + ":v2")).catch(() => null);
  const forget = () => store("readwrite", (s) => s.clear()).catch(() => {});

  async function start() {
    try {
      sealed = await (await fetch("data.enc.json", { cache: "no-store" })).json();
    } catch {
      $("#err").textContent = "Couldn't load the office data. Check your connection.";
      return;
    }
    const remembered = await loadKey();
    if (remembered) {
      try {
        data = await open(remembered);
        cryptoKey = remembered;
        return show();
      } catch {
        await forget();
      }
    }
    $("#pass").focus();
  }

  $("#unlock").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!sealed) return;
    $("#go").disabled = true;
    $("#err").textContent = "";
    try {
      const key = await deriveKey($("#pass").value, fromB64(sealed.salt), sealed.iterations);
      data = await open(key);
      cryptoKey = key;
      if ($("#keep").checked) await saveKey(key);
      $("#pass").value = "";
      show();
    } catch {
      $("#err").textContent = "That password didn't open it.";
    } finally {
      $("#go").disabled = false;
    }
  });

  $("#lockBtn").addEventListener("click", async () => {
    await forget();
    data = null;
    $("#app").classList.remove("on");
    $("#lock").style.display = "";
    $("#view").innerHTML = "";
  });

  $("#tabs").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-tab]");
    if (!b) return;
    tab = b.dataset.tab;
    editing = null;
    invEditing = null;
    saveNote = "";
    render();
    window.scrollTo({ top: 0 });
    if (tab === "invoices") refreshPaid();
  });

  function show() {
    $("#lock").style.display = "none";
    $("#app").classList.add("on");
    const when = new Date(data.builtAt);
    $("#updated").textContent = "Updated " + when.toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    month = [...new Set(data.rows.map((r) => r.month))].sort().reverse()[0];
    settings = structuredClone(data.settings);
    settings.invoices ??= [];
    settings.timeLog ??= [];
    render();
    pullSettings();
  }

  const hoursOf = (r) => (data.billHours === "attended" ? r.attendedHours : r.activeHours);
  const acct = (name) => settings.accounts.find((a) => a.name === name);
  const typeOf = (name) => acct(name)?.type ?? data.rows.find((r) => r.client === name)?.type ?? "unsorted";
  const rateOf = (name) => acct(name)?.hourlyRate ?? settings.defaults.hourlyRate;
  const markupOf = (name) => acct(name)?.aiMarkup ?? settings.defaults.aiMarkup;
  const pricingOf = (name) => acct(name)?.aiPricing ?? settings.defaults.aiPricing ?? { method: "list", percent: 100 };
  // All AI usage in the month, everything the plan paid for.
  const monthAi = (m) => data.rows.filter((r) => r.month === m).reduce((a, r) => a + r.aiCost, 0);
  const plan = () => settings.defaults.aiSubscriptionMonthly ?? 0;
  // What a slice of AI usage really cost: its share of the month's usage times the plan price.
  const realCost = (aiCost, m) => (monthAi(m) > 0 ? (plan() * aiCost) / monthAi(m) : 0);
  // Same rules as aiBase() in tracker/invoice.mjs.
  function aiBaseOf(r) {
    const p = pricingOf(r.client), hours = hoursOf(r);
    if (!(r.aiCost > 0 || hours > 0)) return 0;
    if (p.method === "share") return realCost(r.aiCost, r.month);
    if (p.method === "hourly") return (p.perHour ?? 0) * hours;
    if (p.method === "fixed") return p.fixed ?? 0;
    return (r.aiCost * (p.percent ?? 100)) / 100;
  }
  const aiBilled = (r) => aiBaseOf(r) * (1 + markupOf(r.client));
  // What unbilled work would have cost a company at your standard terms (the defaults).
  function valueAtDefaults(r) {
    const d = settings.defaults, p = d.aiPricing ?? { method: "list", percent: 100 }, hours = hoursOf(r);
    const ai = p.method === "hourly" ? (p.perHour ?? 0) * hours : p.method === "fixed" ? (p.fixed ?? 0) : p.method === "share" ? realCost(r.aiCost, r.month) : (r.aiCost * (p.percent ?? 100)) / 100;
    return hours * d.hourlyRate + ai * (1 + (d.aiMarkup ?? 0));
  }
  // The bill as the account is set up now, so an edit shows right away.
  const apiMarkupOf = (name) => acct(name)?.apiMarkup ?? settings.defaults.apiMarkup ?? 0.1;
  // Their live system's Anthropic bill for the month, passed through with the management markup.
  const liveOf = (name, m) => (Number(acct(name)?.apiUsage?.[m]) || 0) * (1 + apiMarkupOf(name));
  const billOf = (r) => hoursOf(r) * rateOf(r.client) + aiBilled(r) + liveOf(r.client, r.month) + (r.passThrough ?? 0) + (acct(r.client)?.retainer ?? 0);
  const ofType = (t, m = month) => data.rows.filter((r) => typeOf(r.client) === t && (!m || r.month === m));
  const sum = (list, f) => list.reduce((a, r) => a + f(r), 0);
  const projectsOf = (client, m = month) => data.byProject.filter((p) => p.client === client && (!m || p.month === m));
  const label = (client) => acct(client)?.label ?? (client === "jgoco" ? "JGoCo" : client);

  function render() {
    document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
    $("#view").innerHTML = { home, accounts, invoices, expenses, reference, work }[tab]();
    if (tab === "accounts" || tab === "expenses") { wireAccounts(); showPricingFields(); }
    if (tab === "invoices") wireInvoices();
    $("#view").querySelectorAll("[data-month]").forEach((b) => b.addEventListener("click", () => { month = b.dataset.month; render(); }));
    $("#view").querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => { tab = b.dataset.go; render(); window.scrollTo({ top: 0 }); }));
  }

  function months() {
    const all = [...new Set(data.rows.map((r) => r.month))].sort().reverse();
    return `<div class="seg">${all.map((m) => `<button data-month="${m}" class="${m === month ? "on" : ""}">${esc(monthName(m))}</button>`).join("")}</div>`;
  }

  // Every project as a share of the month's AI use, and what that share of the plan costs.
  function projectTable(list) {
    if (!list.length) return '<p class="empty">Nothing tracked this month.</p>';
    const all = monthAi(month);
    return `<table>${list.map((p) => `<tr><td>${esc(p.project)}</td><td class="n">${p.hours.toFixed(1)} h</td><td class="n">${all > 0 ? Math.round((p.aiCost / all) * 1000) / 10 + "%" : "·"}</td><td class="n">${plan() ? money(realCost(p.aiCost, month)) : "·"}</td></tr>`).join("")}</table>`;
  }


  function home() {
    const cl = ofType("client"), pt = ofType("pitch"), ex = ofType("expense"), rf = ofType("reference");
    const card = (go, kind, title, big, text) => `<button class="card section ${kind}" data-go="${go}"><span class="top"><span class="eyebrow">${title}</span><b class="big">${big}</b></span><p>${text}</p><span class="go">Open</span></button>`;
    return `${months()}
      ${card("accounts", "client", "Clients · to bill", money0(sum(cl, billOf)), cl.length ? cl.map((r) => `${esc(label(r.client))}: ${hoursOf(r).toFixed(1)} h, AI usage ${money0(aiBilled(r))}`).join("<br>") + (data.drafts.length ? `<br>${data.drafts.length} invoice draft${data.drafts.length > 1 ? "s" : ""} waiting` : "") : "No client work this month.")}
      ${card("expenses", "", "Expenses · JGoCo", plan() ? money0(realCost(sum(ex, (r) => r.aiCost), month)) : Math.round((monthAi(month) ? sum(ex, (r) => r.aiCost) / monthAi(month) : 0) * 100) + "%", `${plan() ? "Real cost: " : ""}JGoCo's share of your AI plan this month. ${sum(ex, hoursOf).toFixed(1)} h of your time.`)}
      ${pt.length ? card("accounts", "", "Pitches · not signed yet", sum(pt, hoursOf).toFixed(1) + " h", pt.map((r) => `${esc(label(r.client))}: ${hoursOf(r).toFixed(1)} h, real AI cost ${plan() ? money(realCost(r.aiCost, month)) : money0(r.aiCost)}, would bill ${money0(billOf(r))}`).join("<br>")) : ""}
      ${card("reference", "", "Reference · not billed", sum(rf, hoursOf).toFixed(0) + " h", `${rf.map((r) => esc(r.client)).join(", ") || "Nothing"}: ${money0(sum(rf, (r) => r.aiCost))} of AI. Use it to estimate new projects.`)}`;
  }

  const TYPE_NAMES = { client: "Client, billed", pitch: "Pitch, not signed yet", expense: "Business expense", reference: "Reference, not billed", personal: "Personal (hidden)" };
  const pct = (m) => Math.round(m * 1000) / 10;

  function accounts() {
    if (editing) return accountForm(editing === "__new" ? null : acct(editing));
    const d = settings.defaults;
    // Personal and unsorted time still counts toward total AI use, but isn't shown.
    const groups = ["client", "pitch", "expense", "reference"].map((t) => {
      const list = settings.accounts.filter((a) => a.type === t);
      if (!list.length) return "";
      return `<div class="eyebrow" style="margin-top:6px">${TYPE_NAMES[t]}</div><div class="list">${list.map((a) => {
        const r = data.rows.find((x) => x.client === a.name && x.month === month);
        // a pitch carries proposed terms: what the work so far would bill if they sign, and nothing is drafted
        const right = t === "client" && r ? money0(billOf(r)) : t === "pitch" && r ? `${hoursOf(r).toFixed(1)} h` : r ? hoursOf(r).toFixed(1) + " h" : "";
        const terms = t === "client" || t === "pitch" ? `${t === "pitch" ? "Proposed: " : ""}$${rateOf(a.name)}/h · AI ${pricingText(pricingOf(a.name))} +${pct(markupOf(a.name))}%${a.retainer ? ` · $${a.retainer}/mo Service Fee` : ""}` : r ? `AI ${money(r.aiCost)} this month` : "Nothing this month";
        return `<button class="card section" data-edit="${esc(a.name)}"><span class="top"><b style="font-size:19px">${esc(a.label)}</b><b>${right}</b></span><p>${terms}</p></button>`;
      }).join("")}</div>`;
    }).join("");
    return `${months()}<div class="top" style="display:flex;justify-content:space-between;align-items:center"><h2>Accounts</h2><button class="btn" id="newAcct" type="button"><img src="../img/bolt-black.png" alt="">New account</button></div>
      ${saveNote ? `<div class="private">${esc(saveNote)}</div>` : ""}
      ${groups}
      <form class="card form" id="defaults"><div class="eyebrow">Defaults for every account</div>
        <div class="fields">
          ${field("Hourly rate ($)", "d_rate", d.hourlyRate, "number", "step=1 min=0")}
          ${field("AI markup (%)", "d_markup", pct(d.aiMarkup), "number", "step=1 min=0")}
          ${field("Square fee (%)", "d_fee", d.cardFeePercent, "number", "step=0.1 min=0")}
          ${field("Square fee per charge (¢)", "d_fixed", d.cardFeeFixedCents ?? 30, "number", "step=1 min=0")}
          ${field("My AI plan per month ($)", "d_subs", d.aiSubscriptionMonthly ?? "", "number", 'step=1 min=0 placeholder="Claude plan plus other AI apps"')}
          ${pricingFields("d", d.aiPricing, false)}
          <label>Live system AI markup<select id="d_apimarkup">${[["0.1", "10%"], ["0.15", "15%"], ["0.2", "20%"]].map(([v, t]) => `<option value="${v}"${String(d.apiMarkup ?? 0.1) === v ? " selected" : ""}>${t}</option>`).join("")}</select></label>
          <label>Hours to bill<select id="d_hours"><option value="active"${d.billHours === "active" ? " selected" : ""}>All active time</option><option value="attended"${d.billHours === "attended" ? " selected" : ""}>Only time with you</option></select></label>
        </div>
        <button class="btn dark" type="submit">Save defaults</button></form>`;
  }

  const METHOD_NAMES = { list: "API list price", share: "My real cost (share of my AI plan)", hourly: "Flat amount per hour", fixed: "Fixed amount per invoice" };
  function pricingText(p) {
    if (p.method === "share") return "at my real cost";
    if (p.method === "hourly") return `$${p.perHour ?? 0}/h`;
    if (p.method === "fixed") return `$${p.fixed ?? 0} per invoice`;
    return p.percent && p.percent !== 100 ? `${p.percent}% of list` : "at list price";
  }

  // The pricing picker, used on an account (with "Use default") and in the defaults.
  function pricingFields(prefix, p, withDefault) {
    const method = p?.method ?? (withDefault ? "" : "list");
    return `<label>Price it as<select id="${prefix}_method" data-pricing="${prefix}">
        ${withDefault ? `<option value=""${method === "" ? " selected" : ""}>Default (${esc(pricingText(settings.defaults.aiPricing ?? { method: "list", percent: 100 }))})</option>` : ""}
        ${Object.entries(METHOD_NAMES).map(([k, v]) => `<option value="${k}"${method === k ? " selected" : ""}>${v}</option>`).join("")}
      </select></label>
      <label data-for="${prefix}" data-method="list">Percent of list price${`<input id="${prefix}_percent" type="number" step="1" min="0" value="${esc(p?.percent ?? 100)}">`}</label>
      <label data-for="${prefix}" data-method="hourly">AI per hour ($)<input id="${prefix}_perHour" type="number" step="1" min="0" value="${esc(p?.perHour ?? "")}"></label>
      <label data-for="${prefix}" data-method="fixed">AI per invoice ($)<input id="${prefix}_fixed" type="number" step="1" min="0" value="${esc(p?.fixed ?? "")}"></label>`;
  }

  function readPricing(prefix) {
    const method = val(`${prefix}_method`);
    if (!method) return null;
    if (method === "list") return { method, percent: numOrNull(`${prefix}_percent`) ?? 100 };
    if (method === "hourly") return { method, perHour: numOrNull(`${prefix}_perHour`) ?? 0 };
    if (method === "fixed") return { method, fixed: numOrNull(`${prefix}_fixed`) ?? 0 };
    return { method };
  }

  function showPricingFields() {
    document.querySelectorAll("[data-pricing]").forEach((sel) => {
      const m = sel.value;
      document.querySelectorAll(`[data-for="${sel.dataset.pricing}"]`).forEach((l) => (l.hidden = l.dataset.method !== m));
    });
  }

  function field(name, id, value, type = "text", extra = "") {
    return `<label>${name}<input id="${id}" type="${type}" ${extra} value="${esc(value ?? "")}"></label>`;
  }

  // One titled group of settings, with a sentence saying what it controls.
  const group = (title, note, body) => `<section class="group"><h3>${title}</h3><p>${note}</p><div class="fields">${body}</div></section>`;

  // This month's invoice for the account, line by line, as the settings stand now.
  function invoicePreview(a, r) {
    const hours = r ? hoursOf(r) : 0, rate = rateOf(a.name);
    const lines = [
      [`Your time · ${hours.toFixed(2)} h × $${rate}`, hours * rate],
      [`AI used to build it · ${pricingText(pricingOf(a.name))}${markupOf(a.name) ? ` +${pct(markupOf(a.name))}%` : ""}`, r ? aiBilled(r) : 0],
      [`AI in their live system · API bill +${pct(apiMarkupOf(a.name))}%`, liveOf(a.name, month)],
      ["Service Fee · upkeep, minor bugs and fixes", a.retainer || 0],
    ].filter(([, v]) => v > 0);
    const total = lines.reduce((t, [, v]) => t + v, 0);
    return `<div class="card"><div class="eyebrow">${a.type === "pitch" ? `What ${esc(monthName(month))} would bill if they sign` : `${esc(monthName(month))} invoice, as set up now`}</div>
      ${lines.length ? `<table>${lines.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="n">${money(v)}</td></tr>`).join("")}<tr class="total"><td>Total</td><td class="n">${money(total)}</td></tr></table>` : '<p class="empty">Nothing to bill this month yet.</p>'}
      ${r ? `<p class="lead" style="margin-top:10px">Your real AI cost for this work: ${plan() ? money(realCost(r.aiCost, r.month)) : "set your plan on Expenses"}. On the API it would be ${money(r.aiCost)}.</p>` : ""}</div>`;
  }

  function accountForm(a) {
    const isNew = !a;
    a = a ?? { name: "", label: "", type: "client", hourlyRate: null, aiMarkup: null, retainer: 500, cadence: "monthly", termsDays: 15, email: "", address: { line1: "", city: "", state: "", postalCode: "" }, keywords: [], apiMarkup: null, apiUsage: {} };
    const r = !isNew && data.rows.find((x) => x.client === a.name && x.month === month);
    const drafts = isNew ? [] : data.drafts.filter((x) => x.client === a.name);
    const links = isNew ? [] : data.projects.special.filter((p) => p.client === a.name).flatMap((p) => p.links);
    const d = settings.defaults;
    return `<button class="btn ghost" id="back" type="button" style="justify-self:start">Back to accounts</button>
      <h2>${isNew ? "New account" : esc(a.label)}</h2>
      ${saveNote ? `<div class="private">${esc(saveNote)}</div>` : ""}
      ${!isNew && (a.type === "client" || a.type === "pitch") ? `${months()}${invoicePreview(a, r)}` : ""}
      ${!isNew && a.type !== "client" && a.type !== "pitch" && r ? `<div class="card"><div class="eyebrow">${esc(monthName(month))}</div><div class="stat"><div><small>Hours</small><b>${hoursOf(r).toFixed(1)}</b></div><div><small>Your real AI cost</small><b>${plan() ? money0(realCost(r.aiCost, r.month)) : "Set plan"}</b></div><div><small>On the API</small><b>${money0(r.aiCost)}</b></div></div></div>` : ""}
      <form class="card form" id="acct">
        ${group("The account", "Its name, and whether you bill it.", `
          ${field("Account name", "a_label", a.label)}
          <label>Kind of account<select id="a_type">${Object.entries(TYPE_NAMES).map(([k, v]) => `<option value="${k}"${a.type === k ? " selected" : ""}>${v}</option>`).join("")}</select></label>`)}
        ${group("Your time", `Hours from your Claude sessions, times this rate. Blank uses your default, $${d.hourlyRate}.`, `
          ${field("Hourly rate ($)", "a_rate", a.hourlyRate, "number", `step=1 min=0 placeholder="${d.hourlyRate}"`)}`)}
        ${group("AI you use to build it", "The AI behind your own build work. One line on the invoice, never itemized.", `
          ${pricingFields("a", a.aiPricing, true)}
          ${field("Markup on top (%)", "a_markup", a.aiMarkup == null ? "" : pct(a.aiMarkup), "number", `step=1 min=0 placeholder="${pct(d.aiMarkup ?? 0)}"`)}`)}
        ${group("AI in their live system", "When their system runs on your Anthropic account: enter that month's API bill and it passes through with your management markup.", `
          ${field(`API bill for ${esc(monthName(month))} ($)`, "a_api", a.apiUsage?.[month] ?? "", "number", 'step=0.01 min=0 placeholder="0"')}
          <label>Management markup<select id="a_apimarkup">${[["", `Default (${pct(d.apiMarkup ?? 0.1)}%)`], ["0.1", "10%"], ["0.15", "15%"], ["0.2", "20%"]].map(([v, t]) => `<option value="${v}"${String(a.apiMarkup ?? "") === v ? " selected" : ""}>${t}</option>`).join("")}</select></label>`)}
        ${group("Service Fee", "A flat monthly fee that covers upkeep, minor bugs and fixes. New development is billed separately at your hourly rate.", `
          ${field("Service Fee per month ($)", "a_retainer", a.retainer || "", "number", "step=1 min=0 placeholder=0")}`)}
        ${group("Invoicing", "Where the invoice goes and when it's due.", `
          <label>Send an invoice<select id="a_cadence"><option value="monthly"${a.cadence !== "milestone" ? " selected" : ""}>Every month</option><option value="milestone"${a.cadence === "milestone" ? " selected" : ""}>At milestones</option></select></label>
          ${field("Payment due (days)", "a_terms", a.termsDays, "number", "step=1 min=0")}
          ${field("Billing email", "a_email", a.email, "email")}
          ${field("Street address", "a_line1", a.address.line1)}
          ${field("City", "a_city", a.address.city)}
          ${field("State", "a_state", a.address.state)}
          ${field("ZIP", "a_zip", a.address.postalCode)}`)}
        ${group("Tracking", "Claude sessions that mention any of these words count toward this account.", `
          ${field("Words to look for", "a_keywords", a.keywords.join(", "), "text", 'placeholder="bloomfield, porta via"')}`)}
        <button class="btn" type="submit" style="justify-self:start"><img src="../img/bolt-black.png" alt="">${isNew ? "Create account" : "Save account"}</button>
      </form>
      ${links.length ? `<div class="card"><div class="eyebrow">Live links</div><div class="links">${links.map((l) => `<a class="btn ghost" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}</div></div>` : ""}
      ${drafts.length ? `<div class="card"><div class="eyebrow">Invoice draft on your Mac</div>${drafts.map(draftCard).join("")}</div>` : ""}`;
  }

  const val = (id) => document.getElementById(id)?.value.trim() ?? "";
  const numOrNull = (id, scale = 1) => (val(id) === "" ? null : Math.max(0, Number(val(id)) / scale));

  function wireAccounts() {
    document.querySelectorAll("[data-pricing]").forEach((sel) => sel.addEventListener("change", showPricingFields));
    document.querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", () => { editing = b.dataset.edit; saveNote = ""; render(); window.scrollTo({ top: 0 }); }));
    $("#newAcct")?.addEventListener("click", () => { editing = "__new"; saveNote = ""; render(); window.scrollTo({ top: 0 }); });
    $("#back")?.addEventListener("click", () => { editing = null; render(); });
    $("#planForm")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      settings.defaults = { ...settings.defaults, aiSubscriptionMonthly: numOrNull("p_plan") };
      await saveSettings("Plan price saved.");
    });
    $("#defaults")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      settings.defaults = { ...settings.defaults, hourlyRate: numOrNull("d_rate") ?? settings.defaults.hourlyRate, aiMarkup: numOrNull("d_markup", 100) ?? settings.defaults.aiMarkup, cardFeePercent: numOrNull("d_fee") ?? settings.defaults.cardFeePercent, cardFeeFixedCents: numOrNull("d_fixed") ?? settings.defaults.cardFeeFixedCents ?? 30, billHours: val("d_hours"), aiPricing: readPricing("d") ?? settings.defaults.aiPricing, aiSubscriptionMonthly: numOrNull("d_subs"), apiMarkup: Number(val("d_apimarkup")) };
      await saveSettings("Defaults saved.");
    });
    $("#acct")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const label = val("a_label");
      if (!label) return toast("Give the account a name.");
      const isNew = editing === "__new";
      if (isNew && settings.accounts.some((a) => a.name.toLowerCase() === label.toLowerCase())) return toast("There's already an account with that name.");
      const prev = isNew ? { name: label } : acct(editing);
      const next = {
        ...prev, label, type: val("a_type"),
        hourlyRate: numOrNull("a_rate"), aiMarkup: numOrNull("a_markup", 100), retainer: numOrNull("a_retainer") ?? 0,
        cadence: val("a_cadence"), termsDays: numOrNull("a_terms") ?? 15, email: val("a_email"),
        address: { line1: val("a_line1"), city: val("a_city"), state: val("a_state"), postalCode: val("a_zip") },
        keywords: val("a_keywords").split(",").map((w) => w.trim()).filter(Boolean),
        aiPricing: readPricing("a"),
        apiMarkup: val("a_apimarkup") === "" ? null : Number(val("a_apimarkup")),
        apiUsage: { ...(prev.apiUsage ?? {}), [month]: numOrNull("a_api") ?? 0 },
      };
      settings.accounts = isNew ? [...settings.accounts, next] : settings.accounts.map((a) => (a.name === prev.name ? next : a));
      editing = next.name;
      await saveSettings(isNew ? `${label} created.` : `${label} saved.`);
    });
  }

  // Encrypts the whole settings object with the back office key and stores it in the sheet.
  async function saveSettings(note) {
    if (!cryptoKey) return toast("Unlock again to save.");
    settings.updatedAt = new Date().toISOString();
    const iv = crypto.getRandomValues(new Uint8Array(12));
    let ct;
    try {
      ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, cryptoKey, new TextEncoder().encode(JSON.stringify(settings)));
    } catch {
      return toast("Lock and unlock once more, then save again.");
    }
    const b64 = (u) => btoa(String.fromCharCode(...new Uint8Array(u)));
    try {
      const res = await (await fetch(data.sheetUrl, { method: "POST", body: JSON.stringify({ action: "settings", iv: b64(iv), data: b64(ct) }) })).json();
      if (!res.ok) throw new Error(res.why);
      saveNote = `${note} Invoices and totals update on your Mac's next refresh.`;
    } catch {
      saveNote = "That didn't save. Check your connection and try again.";
    }
    render();
  }

  // The newest settings saved from any device, if newer than the published ones.
  async function pullSettings() {
    try {
      const res = await (await fetch(data.sheetUrl + "?action=settings", { cache: "no-store" })).json();
      for (const b of res.blobs ?? []) {
        try {
          const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(b.iv) }, cryptoKey, fromB64(b.data));
          const s = JSON.parse(new TextDecoder().decode(plain));
          if (s?.accounts && (!settings.updatedAt || s.updatedAt > settings.updatedAt)) {
            // Money Machine's numbers and statuses only arrive with a publish, so keep those.
            settings = { ...s, invoices: s.invoices ?? settings.invoices ?? [], timeLog: s.timeLog ?? settings.timeLog ?? [], moneyMachine: settings.moneyMachine ?? [] };
            if (!editing) render();
          }
          break;
        } catch {}
      }
    } catch {}
  }

  function toast(msg) {
    saveNote = msg;
    render();
  }

  function draftCard(d) {
    const w = d.working;
    return `<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px">
      <div class="eyebrow">Invoice draft · ${esc(d.from)} to ${esc(d.to)} · due ${esc(d.dueDate)}</div>
      <table>${d.lines.map((l) => `<tr><td>${esc(l.description)}</td><td class="n">${cents(l.amountCents)}</td></tr>`).join("")}<tr class="total"><td>Total</td><td class="n">${cents(w.totalCents)}</td></tr></table>
      <div class="pay"><div><small>Wire or bank transfer</small><b>${cents(w.payment.wireCents)}</b></div><div><small>Card, plus ${w.payment.feePercent}%</small><b>${cents(w.payment.cardCents)}</b></div></div></div>`;
  }

  // ------------------------------------------------------------------------------------------
  // Invoices. Kept inside the encrypted settings, so they save and sync like everything else.
  // Two prices: the card price is the regular price and covers Square's real fee; paying by
  // wire or bank transfer gets a discount back to the base. That's a discount, not a card
  // surcharge, so debit cards and card-network surcharge rules don't come into it.
  const today = () => new Date().toLocaleDateString("en-CA");
  const addDaysIso = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toLocaleDateString("en-CA"); };
  const rid = (n = 24) => { const a = crypto.getRandomValues(new Uint8Array(n)); return btoa(String.fromCharCode(...a)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
  const feePct = () => Number(settings.defaults.cardFeePercent ?? 3.3);
  const feeFixed = () => Number(settings.defaults.cardFeeFixedCents ?? 30);
  // Same rule as paymentOptions() in tracker/invoice.mjs.
  const cardOf = (base) => (base > 0 ? Math.ceil((base + feeFixed()) / (1 - feePct() / 100)) : 0);
  const baseOf = (inv) => inv.lines.reduce((t, l) => t + (Number(l.amountCents) || 0), 0);
  const invList = () => settings.invoices ?? [];
  // What Money Machine says about an invoice, when it has one with the same id.
  const mmOf = (inv) => (settings.moneyMachine ?? []).find((m) => m.id === inv.id);
  const statusOf = (inv) => (mmOf(inv)?.status === "paid" && inv.status !== "void" ? "paid" : inv.status);
  // One numbering with Money Machine: plain integers after the highest either side has used.
  function nextNumber() {
    const nums = [...invList(), ...(settings.moneyMachine ?? [])].map((i) => Number(i.number)).filter((n) => Number.isFinite(n) && n > 0);
    return String(Math.max(1111, ...nums) + 1);
  }
  const billToOf = (name) => {
    const a = acct(name);
    return a ? { name: a.label, email: a.email ?? "", line1: a.address?.line1 ?? "", city: a.address?.city ?? "", state: a.address?.state ?? "", postalCode: a.address?.postalCode ?? "" } : { name: "", email: "", line1: "", city: "", state: "", postalCode: "" };
  };
  const logFor = (name, m) => (settings.timeLog ?? []).filter((e) => e.account === name && (e.date ?? "").slice(0, 7) === m);

  // The lines an account's month adds up to: tracked plus logged hours, AI, their API bill,
  // pass-through, costs logged by hand, and the Service Fee.
  function accountLines(name, m) {
    const r = data.rows.find((x) => x.client === name && x.month === m);
    const logged = logFor(name, m);
    const hours = (r ? hoursOf(r) : 0) + logged.filter((e) => e.kind === "hours").reduce((t, e) => t + (Number(e.hours) || 0), 0);
    const rate = rateOf(name);
    const c = (n) => Math.round(n * 100);
    const lines = [
      { description: `Development · ${monthName(m)} · ${hours.toFixed(2)} h × $${rate}`, amountCents: c(hours * rate) },
      { description: `AI used to build it · ${monthName(m)}`, amountCents: r ? c(aiBilled(r)) : 0 },
      { description: `AI in your live system · ${monthName(m)} API bill + management`, amountCents: c(liveOf(name, m)) },
      { description: `Pass-through costs · ${monthName(m)}`, amountCents: r ? c(r.passThrough ?? 0) : 0 },
      ...logged.filter((e) => e.kind === "cost").map((e) => ({ description: e.note || "Cost", amountCents: Math.round(Number(e.amountCents) || 0) })),
      { description: `Service Fee · upkeep, minor bugs and fixes · ${monthName(m)}`, amountCents: c(acct(name)?.retainer ?? 0) },
    ];
    return lines.filter((l) => l.amountCents > 0);
  }

  function newInvoice(kind, from) {
    const issued = today();
    const inv = { id: "inv_" + rid(9), publicId: rid(24), number: nextNumber(), kind, account: null, month: kind === "account" ? month : null, billTo: billToOf(null), issued, due: issued, lines: [{ description: "", amountCents: 0 }], status: "draft", note: "" };
    if (from) Object.assign(inv, from);
    return inv;
  }

  function invoices() {
    if (invEditing) return invoiceForm();
    const list = [...invList()].sort((a, b) => Number(b.number) - Number(a.number));
    const open = list.filter((i) => statusOf(i) === "sent");
    const owed = open.reduce((t, i) => t + baseOf(i), 0);
    const paidM = list.filter((i) => statusOf(i) === "paid" && (i.paidAt ?? "").slice(0, 7) === today().slice(0, 7)).reduce((t, i) => t + baseOf(i), 0);
    const drafts = data.drafts.filter((d) => !list.some((i) => i.fromDraft === d.client + ":" + d.from));
    return `<div class="top" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2>Invoices</h2>
        <div class="actions"><button class="btn" id="newQuick" type="button"><img src="../img/bolt-black.png" alt="">Quick invoice</button><button class="btn dark" id="newAcctInv" type="button">From an account</button></div></div>
      ${saveNote ? `<div class="private">${esc(saveNote)}</div>` : ""}
      <div class="tiles"><div class="tile"><span>Waiting to be paid</span><b>${cents(owed)}</b><span>${open.length} invoice${open.length === 1 ? "" : "s"}</span></div><div class="tile"><span>Paid this month</span><b>${cents(paidM)}</b><span>bank-transfer price</span></div></div>
      ${drafts.length ? `<div class="card"><div class="eyebrow">Drafts from your Mac</div>${drafts.map((d, i) => `<div class="row" style="margin-top:10px"><span class="name">${esc(label(d.client))} · ${esc(d.from)} to ${esc(d.to)}</span><span class="num">${cents(d.working.totalCents)}</span><span class="sub"><button class="btn ghost" data-fromdraft="${i}" type="button" style="padding:8px 14px;margin-top:6px">Make it an invoice</button></span></div>`).join("")}</div>` : ""}
      <div class="list">${list.length ? list.map((i) => {
        const st = statusOf(i);
        return `<button class="card section" data-inv="${esc(i.id)}"><span class="top"><b style="font-size:19px">#${esc(i.number)} · ${esc(i.billTo?.name || "No client yet")}</b><b>${cents(baseOf(i))}</b></span>
          <p><span class="pill ${st}" style="margin-left:0">${st}${st === "paid" && i.paidVia ? " · " + esc(i.paidVia) : ""}${st === "paid" && mmOf(i)?.status === "paid" && i.status !== "paid" ? " · Money Machine" : ""}</span> Issued ${esc(i.issued)} · due ${esc(i.due)} · card ${cents(cardOf(baseOf(i)))}</p></button>`;
      }).join("") : '<p class="empty">No invoices yet. Make a quick one, or build one from an account\'s month.</p>'}</div>
      <p class="lead">Card price covers Square's ${feePct()}% + ${cents(feeFixed())}. Bank transfer gets the discount back to the base. Change the rate on Accounts, under Defaults.</p>`;
  }

  function invoiceForm() {
    const inv = invDraft;
    const st = statusOf(inv);
    const base = baseOf(inv), card = cardOf(base);
    const clients = settings.accounts.filter((a) => a.type === "client" || a.type === "pitch");
    const locked = st === "paid" || st === "void";
    const b = inv.billTo;
    const acctPanel = inv.kind === "account" && inv.account ? (() => {
      const m = inv.month ?? month, r = data.rows.find((x) => x.client === inv.account && x.month === m);
      const logged = logFor(inv.account, m);
      return `<div class="card"><div class="eyebrow">${esc(label(inv.account))} · ${esc(monthName(m))}</div>
        <div class="stat"><div><small>Tracked hours</small><b>${r ? hoursOf(r).toFixed(1) : "0.0"}</b></div><div><small>Logged hours</small><b>${logged.filter((e) => e.kind === "hours").reduce((t, e) => t + Number(e.hours || 0), 0).toFixed(1)}</b></div><div><small>AI at API price</small><b>${money0(r ? r.aiCost : 0)}</b></div><div><small>Your real AI cost</small><b>${plan() && r ? money0(realCost(r.aiCost, m)) : "·"}</b></div><div><small>Their API bill</small><b>${money0(Number(acct(inv.account)?.apiUsage?.[m]) || 0)}</b></div></div>
        ${logged.length ? `<table style="margin-top:10px">${logged.map((e) => `<tr><td>${esc(e.date)} · ${esc(e.note || (e.kind === "hours" ? "Time" : "Cost"))}</td><td class="n">${e.kind === "hours" ? Number(e.hours).toFixed(2) + " h" : cents(e.amountCents)}</td><td class="n" style="width:40px"><button class="x" data-unlog="${esc(e.id)}" type="button" title="Remove">×</button></td></tr>`).join("")}</table>` : ""}
        <div class="fields" style="margin-top:12px">
          <label>Log<select id="l_kind"><option value="hours">Hours</option><option value="cost">A cost (their software, etc.)</option></select></label>
          ${field("Date", "l_date", m === today().slice(0, 7) ? today() : (() => { const d = new Date(m + "-01T12:00:00"); d.setMonth(d.getMonth() + 1, 0); return d.toLocaleDateString("en-CA"); })(), "date")}
          ${field("Hours, or cost ($)", "l_amt", "", "number", 'step=0.01 min=0')}
          ${field("Note", "l_note", "", "text", 'placeholder="Call with the owner"')}
        </div>
        <div class="actions" style="margin-top:10px"><button class="btn ghost" id="logIt" type="button">Add to the log</button><button class="btn dark" id="fillAcct" type="button">Fill lines from this month</button></div></div>`;
    })() : "";
    return `<button class="btn ghost" id="invBack" type="button" style="justify-self:start">Back to invoices</button>
      <h2>Invoice #${esc(inv.number)} <span class="pill ${st}">${st}</span></h2>
      ${saveNote ? `<div class="private">${esc(saveNote)}</div>` : ""}
      ${inv.pageUrl ? `<div class="card"><div class="eyebrow">Send the client this link</div><div class="linkbox" style="margin-top:8px"><input id="pageLink" readonly value="${esc(inv.pageUrl)}"><button class="btn" id="copyLink" type="button">Copy</button></div>
        <div class="links"><a class="btn ghost" href="${esc(inv.pageUrl)}" target="_blank" rel="noopener">Open their page</a>${inv.cardUrl ? `<a class="btn ghost" href="${esc(inv.cardUrl)}" target="_blank" rel="noopener">Square checkout</a>` : ""}${b.email ? `<a class="btn ghost" href="mailto:${esc(b.email)}?subject=${encodeURIComponent("Invoice " + inv.number + " from JGoCo")}&body=${encodeURIComponent("Hi,\n\nHere's invoice " + inv.number + " for " + cents(card) + " (" + cents(base) + " by bank transfer). You can view it, download a PDF and pay here:\n" + inv.pageUrl + "\n\nThank you!")}">Email it</a>` : ""}</div>
        ${inv.cardWhy ? `<p class="lead" style="margin-top:8px">No card link yet: ${esc(inv.cardWhy)}</p>` : ""}</div>` : ""}
      ${acctPanel}
      <form class="card form" id="invForm">
        ${group("Bill to", inv.kind === "account" ? "Pick the account; its billing details fill in." : "Pick an account, or type someone new.", `
          <label>Account<select id="i_acct"${locked ? " disabled" : ""}><option value="">Someone new</option>${clients.map((a) => `<option value="${esc(a.name)}"${inv.account === a.name ? " selected" : ""}>${esc(a.label)}</option>`).join("")}</select></label>
          ${inv.kind === "account" ? `<label>Month<select id="i_month">${[...new Set(data.rows.map((r) => r.month))].sort().reverse().map((m) => `<option value="${m}"${(inv.month ?? month) === m ? " selected" : ""}>${esc(monthName(m))}</option>`).join("")}</select></label>` : ""}
          ${field("Name or business", "i_name", b.name)}
          ${field("Email", "i_email", b.email, "email")}
          ${field("Street address", "i_line1", b.line1)}
          ${field("City", "i_city", b.city)}
          ${field("State", "i_state", b.state)}
          ${field("ZIP", "i_zip", b.postalCode)}`)}
        ${group("Dates", "Due on receipt unless you change it.", `
          ${field("Issued", "i_issued", inv.issued, "date")}
          ${field("Due", "i_due", inv.due, "date")}`)}
        <section class="group"><h3>Lines</h3><p>At the bank-transfer price. The card price is worked out below.</p>
          <div class="lines">${inv.lines.map((l, i) => `<div class="line"><input data-ld="${i}" value="${esc(l.description)}" placeholder="What it's for"${locked ? " disabled" : ""}><input data-la="${i}" type="number" step="0.01" min="0" value="${l.amountCents ? (l.amountCents / 100).toFixed(2) : ""}" placeholder="0.00"${locked ? " disabled" : ""}><button class="x" data-lx="${i}" type="button" title="Remove line"${locked ? " disabled" : ""}>×</button></div>`).join("")}</div>
          ${locked ? "" : `<button class="btn ghost" id="addLine" type="button" style="justify-self:start">Add a line</button>`}
          <div class="pay"><div><small>Bank transfer or wire</small><b id="t_wire">${cents(base)}</b><small id="t_save">Saves ${cents(card - base)}</small></div><div><small>Card (invoice price)</small><b id="t_card">${cents(card)}</b><small>Covers Square's ${feePct()}% + ${cents(feeFixed())}</small></div></div>
        </section>
        ${group("Note", "Optional. Shows at the bottom of their page.", `<label style="grid-column:1/-1">Note<input id="i_note" value="${esc(inv.note ?? "")}" placeholder="Thanks for the work this month."></label>`)}
        <div class="actions">
          ${locked ? "" : `<button class="btn dark" type="submit">Save</button><button class="btn" id="sendInv" type="button"><img src="../img/bolt-black.png" alt="">${inv.pageUrl ? "Update their page" : "Make their link"}</button>`}
          ${st === "sent" ? `<button class="btn ghost" id="paidWire" type="button">Mark paid by wire</button><button class="btn ghost" id="checkPaid" type="button">Check for card payment</button>` : ""}
          ${st !== "void" && st !== "paid" ? `<button class="btn ghost" id="voidInv" type="button">Void</button>` : ""}
          ${st === "draft" && !inv.pageUrl ? `<button class="btn ghost" id="delInv" type="button">Delete draft</button>` : ""}
        </div>
      </form>`;
  }

  // Reads the form into the invoice being edited, without saving.
  function readInvoiceForm() {
    const inv = invDraft;
    if (!$("#invForm")) return inv;
    inv.account = val("i_acct") || null;
    if ($("#i_month")) inv.month = val("i_month");
    inv.billTo = { name: val("i_name"), email: val("i_email"), line1: val("i_line1"), city: val("i_city"), state: val("i_state"), postalCode: val("i_zip") };
    inv.issued = val("i_issued") || inv.issued;
    inv.due = val("i_due") || inv.due;
    inv.note = val("i_note");
    inv.lines = inv.lines.map((l, i) => ({ description: document.querySelector(`[data-ld="${i}"]`)?.value.trim() ?? l.description, amountCents: Math.round((Number(document.querySelector(`[data-la="${i}"]`)?.value) || 0) * 100) }));
    return inv;
  }

  async function storeInvoice(inv, note) {
    inv.lines = inv.lines.filter((l) => l.description || l.amountCents);
    if (!inv.lines.length) inv.lines = [{ description: "", amountCents: 0 }];
    settings.invoices = invList().some((i) => i.id === inv.id) ? invList().map((i) => (i.id === inv.id ? structuredClone(inv) : i)) : [...invList(), structuredClone(inv)];
    await saveSettings(note);
  }

  // The client's copy: lines at the card price (spread in proportion), so the invoice total is
  // the regular price and bank transfer reads as the discount.
  function clientCopy(inv) {
    const base = baseOf(inv), card = cardOf(base);
    const lines = inv.lines.filter((l) => l.amountCents > 0);
    let left = card;
    const priced = lines.map((l, i) => {
      const c = i === lines.length - 1 ? left : Math.round((l.amountCents * card) / base);
      left -= c;
      return { description: l.description, amountCents: c };
    });
    return { publicId: inv.publicId, number: inv.number, issued: inv.issued, due: inv.due, billTo: inv.billTo, lines: priced, wireCents: base, cardCents: card, status: inv.status === "draft" ? "sent" : inv.status, from: settings.defaults.invoiceFrom ?? { name: "JGoCo", email: "jordan@jgoco.me" }, note: inv.note, discountNote: `Bank transfer price: you save ${cents(card - base)} by paying this way. No card fees.` };
  }

  async function sheetCall(body) {
    const res = await (await fetch(data.sheetUrl, { method: "POST", body: JSON.stringify({ ...body, key: data.invoiceKey }) })).json();
    if (!res.ok) throw new Error(res.why === "key" ? "The Apps Script doesn't have the invoice key yet (OFFICE_KEY)." : res.why || "didn't work");
    return res;
  }

  async function sendInvoice() {
    const inv = readInvoiceForm();
    if (!inv.billTo.name) return toast("Add who it's for first.");
    if (!(baseOf(inv) > 0)) return toast("Add at least one line with an amount.");
    saveNote = "Making their page and the Square link…";
    render();
    try {
      const res = await sheetCall({ action: "invoice-publish", invoice: clientCopy(inv) });
      inv.pageUrl = res.url;
      inv.cardUrl = res.cardUrl ?? null;
      inv.cardWhy = res.cardUrl ? null : res.why ? res.why.replace(/^square: /, "Square said: ") : "Square isn't connected yet (SQUARE_TOKEN).";
      if (inv.status === "draft") { inv.status = "sent"; inv.sentAt = new Date().toISOString(); }
      await storeInvoice(inv, `Invoice #${inv.number} is ready. Copy the link and send it.`);
    } catch (e) {
      toast("Couldn't make the link: " + e.message);
    }
  }

  async function setStatus(status, paidVia) {
    const inv = readInvoiceForm();
    try {
      if (inv.pageUrl) await sheetCall({ action: "invoice-set", id: inv.publicId, status, paidVia, paidAt: today() });
    } catch (e) {
      return toast("Couldn't update their page: " + e.message);
    }
    inv.status = status;
    inv.paidVia = status === "paid" ? paidVia : null;
    inv.paidAt = status === "paid" ? today() : null;
    await storeInvoice(inv, status === "paid" ? `#${inv.number} marked paid by ${paidVia}.` : `#${inv.number} ${status === "void" ? "voided" : "updated"}.`);
  }

  // Asks Square (through the sheet) whether any sent invoice has been paid by card.
  async function refreshPaid(loud) {
    const open = invList().filter((i) => i.status === "sent" && i.pageUrl);
    if (!open.length || !data.invoiceKey) return loud && toast("Nothing waiting on a card payment.");
    try {
      const res = await sheetCall({ action: "invoice-status", ids: open.map((i) => i.publicId) });
      let changed = 0;
      settings.invoices = invList().map((i) => {
        const s = res.statuses?.[i.publicId];
        if (s && s.status === "paid" && i.status !== "paid") { changed++; return { ...i, status: "paid", paidVia: s.paidVia || "card", paidAt: s.paidAt || new Date().toISOString() }; }
        return i;
      });
      if (invDraft) invDraft = structuredClone(settings.invoices.find((i) => i.id === invDraft.id) ?? invDraft);
      if (changed) await saveSettings(`${changed} invoice${changed > 1 ? "s" : ""} paid by card.`);
      else if (loud) toast("No card payment yet.");
    } catch (e) {
      if (loud) toast("Couldn't check: " + e.message);
    }
  }

  function wireInvoices() {
    const open = (inv) => { invDraft = inv; invEditing = inv.id; saveNote = ""; render(); window.scrollTo({ top: 0 }); };
    $("#newQuick")?.addEventListener("click", () => open(newInvoice("quick")));
    $("#newAcctInv")?.addEventListener("click", () => {
      const first = settings.accounts.find((a) => a.type === "client");
      const inv = newInvoice("account", first ? { account: first.name, billTo: billToOf(first.name) } : {});
      if (first) { inv.lines = accountLines(first.name, inv.month); if (!inv.lines.length) inv.lines = [{ description: "", amountCents: 0 }]; inv.due = addDaysIso(inv.issued, acct(first.name)?.termsDays ?? 0); }
      open(inv);
    });
    document.querySelectorAll("[data-fromdraft]").forEach((btn) => btn.addEventListener("click", () => {
      const d = data.drafts.filter((x) => !invList().some((i) => i.fromDraft === x.client + ":" + x.from))[Number(btn.dataset.fromdraft)];
      // Due counts from today: the draft's own due date was set when it was drafted.
      open(newInvoice("account", { account: d.client, month: d.from.slice(0, 7), billTo: billToOf(d.client), due: addDaysIso(today(), acct(d.client)?.termsDays ?? 0), fromDraft: d.client + ":" + d.from, lines: d.lines.map((l) => ({ description: l.description, amountCents: l.amountCents })) }));
    }));
    document.querySelectorAll("[data-inv]").forEach((btn) => btn.addEventListener("click", () => open(structuredClone(invList().find((i) => i.id === btn.dataset.inv)))));
    if (!$("#invForm")) return;
    const recalc = () => {
      readInvoiceForm();
      const base = baseOf(invDraft), card = cardOf(base);
      $("#t_wire").textContent = cents(base); $("#t_card").textContent = cents(card); $("#t_save").textContent = "Saves " + cents(card - base);
    };
    document.querySelectorAll("[data-la],[data-ld]").forEach((el) => el.addEventListener("input", recalc));
    $("#invBack").addEventListener("click", () => { invEditing = null; invDraft = null; saveNote = ""; render(); });
    $("#addLine")?.addEventListener("click", () => { readInvoiceForm(); invDraft.lines.push({ description: "", amountCents: 0 }); render(); });
    document.querySelectorAll("[data-lx]").forEach((btn) => btn.addEventListener("click", () => { readInvoiceForm(); invDraft.lines.splice(Number(btn.dataset.lx), 1); if (!invDraft.lines.length) invDraft.lines.push({ description: "", amountCents: 0 }); render(); }));
    $("#i_acct")?.addEventListener("change", () => {
      readInvoiceForm();
      if (invDraft.account) { invDraft.billTo = billToOf(invDraft.account); invDraft.due = addDaysIso(invDraft.issued, acct(invDraft.account)?.termsDays ?? 0); }
      render();
    });
    $("#i_month")?.addEventListener("change", () => { readInvoiceForm(); render(); });
    $("#fillAcct")?.addEventListener("click", () => {
      readInvoiceForm();
      const lines = accountLines(invDraft.account, invDraft.month ?? month);
      if (!lines.length) return toast("Nothing tracked or logged for that month yet.");
      invDraft.lines = lines;
      saveNote = "Lines filled from the account. Check them, then save.";
      render();
    });
    $("#logIt")?.addEventListener("click", async () => {
      readInvoiceForm();
      const kind = val("l_kind"), amt = Number(val("l_amt"));
      if (!(amt > 0)) return toast(kind === "hours" ? "How many hours?" : "How much was it?");
      const entry = { id: "log_" + rid(8), account: invDraft.account, kind, date: val("l_date") || today(), note: val("l_note") };
      if (kind === "hours") entry.hours = amt; else entry.amountCents = Math.round(amt * 100);
      settings.timeLog = [...(settings.timeLog ?? []), entry];
      await saveSettings(kind === "hours" ? `Logged ${amt} h.` : `Logged a ${cents(entry.amountCents)} cost.`);
    });
    document.querySelectorAll("[data-unlog]").forEach((btn) => btn.addEventListener("click", async () => {
      readInvoiceForm();
      settings.timeLog = (settings.timeLog ?? []).filter((e) => e.id !== btn.dataset.unlog);
      await saveSettings("Removed from the log.");
    }));
    $("#invForm").addEventListener("submit", async (e) => { e.preventDefault(); await storeInvoice(readInvoiceForm(), `Invoice #${invDraft.number} saved.`); });
    $("#sendInv")?.addEventListener("click", sendInvoice);
    $("#paidWire")?.addEventListener("click", () => setStatus("paid", "wire"));
    $("#checkPaid")?.addEventListener("click", () => refreshPaid(true));
    $("#voidInv")?.addEventListener("click", () => { if (confirmVoid()) setStatus("void"); });
    $("#delInv")?.addEventListener("click", async () => { settings.invoices = invList().filter((i) => i.id !== invDraft.id); invEditing = null; invDraft = null; await saveSettings("Draft deleted."); });
    $("#copyLink")?.addEventListener("click", async () => { try { await navigator.clipboard.writeText(invDraft.pageUrl); toast("Link copied."); } catch { $("#pageLink").select(); } });
  }
  // A second press within a few seconds confirms, so nothing pops a browser dialog.
  let voidArmed = 0;
  function confirmVoid() {
    if (Date.now() - voidArmed < 5000) return true;
    voidArmed = Date.now();
    toast("Press Void again to confirm. Their link will stop working.");
    return false;
  }

  function expenses() {
    const accts = settings.accounts.filter((a) => a.type === "expense");
    const ex = ofType("expense");
    const used = sum(ex, (r) => r.aiCost), all = monthAi(month);
    const share = all > 0 ? used / all : 0;
    const allMonths = [...new Set(data.rows.map((r) => r.month))];
    const allTime = allMonths.reduce((a, m) => a + realCost(sum(ofType("expense", m), (r) => r.aiCost), m), 0);
    const projects = accts.flatMap((a) => projectsOf(a.name));
    return `${months()}<h2>Expenses</h2><p class="lead">What your own JGoCo work really costs: its share of your monthly AI plan.</p>
      ${saveNote ? `<div class="private">${esc(saveNote)}</div>` : ""}
      <form class="card form" id="planForm"><div class="fields">
        ${field("My AI plan per month ($)", "p_plan", settings.defaults.aiSubscriptionMonthly ?? "", "number", 'step=1 min=0 placeholder="Claude plan plus other AI apps"')}
      </div><button class="btn dark" type="submit" style="justify-self:start">Save plan price</button></form>
      <div class="card"><div class="eyebrow">${esc(monthName(month))}</div>
        <div class="stat"><div><small>Share of your AI use</small><b>${Math.round(share * 100)}%</b></div><div><small>Real cost</small><b>${plan() ? money(plan() * share) : "Set plan"}</b></div><div><small>Your time</small><b>${sum(ex, hoursOf).toFixed(1)} h</b></div></div>
        ${plan() ? `<p class="lead" style="margin-top:8px">All time: ${money(allTime)}.</p>` : ""}</div>
      <div class="card"><div class="eyebrow" style="margin-bottom:6px">By project</div>${projectTable(projects)}</div>
      <p class="lead">On the API this month's JGoCo work would have cost ${money(used)}.</p>`;
  }

  function reference() {
    const rf = ofType("reference");
    const allRef = ofType("reference", null);
    const perHour = sum(allRef, hoursOf) ? sum(allRef, (r) => r.aiCost) / sum(allRef, hoursOf) : 0;
    const block = (title, list, client) => { const used = sum(list, (r) => r.aiCost), all = monthAi(month);
      return `<div class="card"><div class="eyebrow">${title}</div><div class="stat"><div><small>Hours</small><b>${sum(list, hoursOf).toFixed(1)}</b></div><div><small>Share of your AI use</small><b>${all > 0 ? Math.round((used / all) * 100) + "%" : "·"}</b></div><div><small>Real cost</small><b>${plan() ? money0(realCost(used, month)) : "Set plan"}</b></div></div>${projectTable(projectsOf(client))}</div>`; };
    return `${months()}<h2>Reference</h2><p class="lead">Work you don't bill. Keep it as a record of what things take, for estimating new projects.</p>
      ${rf.length || allRef.length ? block("Grenco Science · not billed", rf, "Grenco Science") : ""}
      ${allRef.length ? (() => {
        const ms = [...new Set(allRef.map((r) => r.month))];
        const total = sum(allRef, valueAtDefaults);
        return `<div class="card"><div class="eyebrow">What Grenco would have paid you</div><div class="stat"><div><small>${esc(monthName(month))}</small><b>${money0(sum(rf, valueAtDefaults))}</b></div><div><small>All time</small><b>${money0(total)}</b></div><div><small>Per month, on average</small><b>${money0(total / ms.length)}</b></div></div><p class="lead" style="margin-top:8px">At your standard terms: $${settings.defaults.hourlyRate}/h plus AI at ${pricingText(settings.defaults.aiPricing ?? { method: "list", percent: 100 })}, over ${ms.length} month${ms.length > 1 ? "s" : ""} and ${sum(allRef, hoursOf).toFixed(0)} hours.</p></div>`;
      })() : ""}
      ${perHour ? `<div class="card"><div class="eyebrow">For estimates</div><div class="stat"><div><small>API cost per hour of work</small><b>${money0(perHour)}</b></div><div><small>All Grenco time</small><b>${sum(allRef, hoursOf).toFixed(0)} h</b></div></div><p class="lead" style="margin-top:8px">A project like this ran about ${money0(perHour)} of AI for every hour you worked on it.</p></div>` : ""}`;
  }

  function work() {
    const p = data.projects;
    const special = p.special
      .map((s) => `<div class="card"><div class="eyebrow">${esc(s.client)} · ${esc(s.status)}</div><h2 style="font-size:24px">${esc(s.name)}</h2>
        <div class="links">${s.links.map((l) => `<a class="btn ghost" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}</div></div>`)
      .join("");
    const tools = p.tools
      .map((t) => `<a class="card tool" href="${esc(t.url)}" target="_blank" rel="noopener" style="text-decoration:none"><b>${esc(t.name)}${t.macOnly ? '<span class="pill mac">On your Mac</span>' : ""}</b><p>${esc(t.note)}</p></a>`)
      .join("");
    return `<h2>Special projects</h2>${special}<h2>Tools</h2><div class="list">${tools}</div>`;
  }

  start();
</script>
</body>
</html>
