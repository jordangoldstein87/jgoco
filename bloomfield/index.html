<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%237b3b2c%22/%3E%3Cg%20transform%3D%22translate%2832%2033%29%20scale%28.72%29%20translate%28-34%20-40%29%22%3E%3Cg%20fill%3D%22%23f4efe6%22%20stroke%3D%22%237b3b2c%22%20stroke-width%3D%223%22%3E%3Cellipse%20cx%3D%2234%22%20cy%3D%2220%22%20rx%3D%2210%22%20ry%3D%2219%22%20transform%3D%22rotate%280%2034%2040%29%22/%3E%3Cellipse%20cx%3D%2234%22%20cy%3D%2220%22%20rx%3D%2210%22%20ry%3D%2219%22%20transform%3D%22rotate%2872%2034%2040%29%22/%3E%3Cellipse%20cx%3D%2234%22%20cy%3D%2220%22%20rx%3D%2210%22%20ry%3D%2219%22%20transform%3D%22rotate%28144%2034%2040%29%22/%3E%3Cellipse%20cx%3D%2234%22%20cy%3D%2220%22%20rx%3D%2210%22%20ry%3D%2219%22%20transform%3D%22rotate%28216%2034%2040%29%22/%3E%3Cellipse%20cx%3D%2234%22%20cy%3D%2220%22%20rx%3D%2210%22%20ry%3D%2219%22%20transform%3D%22rotate%28288%2034%2040%29%22/%3E%3C/g%3E%3Ccircle%20cx%3D%2234%22%20cy%3D%2240%22%20r%3D%228%22%20fill%3D%22%23e7c27a%22%20stroke%3D%22%237b3b2c%22%20stroke-width%3D%222.5%22/%3E%3C/g%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A preview of StayInBloomfield.com, the sister sites for each business on Taylorsville Road, and the Bloomfield Hub behind them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+SC:wght@500;600&family=Libre+Franklin:wght@400;500;600;700&family=Pinyon+Script&family=Parisienne&family=Yesteryear&family=Kaushan+Script&family=Yellowtail&family=Pacifico&family=Abril+Fatface&family=Poiret+One&family=Alfa+Slab+One&family=Bodoni+Moda:ital,wght@0,500;1,500&family=Rye&family=Lobster+Two:wght@700&family=Josefin+Sans:wght@300;400;600&display=swap">
<style>
/* Layout: one town site with sister sites inside it. A dark preview bar on top switches sites;
   each sister site swaps the --s-* tokens to its own branding while keeping the same grid. */
:root {
  --paper: #efece5; --paper-2: #e5e0d4; --ink: #221e1a; --ink-2: #5a5249; --line: #cfc7b8;
  --oak: #2f3b31; --bourbon: #9c5a26; --brick: #7b3b2c; --gold: #b08a3e; --creek: #50697a;
  --hub: #1f2a24; --hub-2: #2c3a32; --hub-ink: #eef0e8; --hub-line: #3e4d43; --ok: #4f7a52; --warn: #b8862f; --bad: #9c3b30;
  --display: "Cormorant Garamond", Georgia, serif; --sc: "Cormorant SC", Georgia, serif;
  --body: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
  --s-bg: var(--paper); --s-ink: var(--ink); --s-accent: var(--brick); --s-soft: var(--paper-2); --s-display: var(--display);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1a1816; --paper-2: #24211e; --ink: #ece6da; --ink-2: #b2a998; --line: #3a352f;
  --oak: #9fb39f; --bourbon: #d39556; --brick: #d0806c; --gold: #d2ae63; --creek: #8fb0c2;
  --hub: #121815; --hub-2: #1b241f; --hub-ink: #e8ece3; --hub-line: #33423a; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1a1816; --paper-2: #24211e; --ink: #ece6da; --ink-2: #b2a998; --line: #3a352f;
  --oak: #9fb39f; --bourbon: #d39556; --brick: #d0806c; --gold: #d2ae63; --creek: #8fb0c2;
  --hub: #121815; --hub-2: #1b241f; --hub-ink: #e8ece3; --hub-line: #33423a; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font: 400 15px/1.6 var(--body); -webkit-font-smoothing: antialiased }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: #161412 }
a { color: inherit }
h1, h2, h3 { font-family: var(--s-display); font-weight: 500; text-wrap: balance; line-height: 1.08; margin: 0 }
p { margin: 0 }
button { font: inherit; color: inherit; cursor: pointer }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }
img { display: block; max-width: 100% }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)) }
.sc { font-family: var(--sc); letter-spacing: .08em; text-transform: lowercase; font-size: 1.05em }
.eyebrow { font-family: var(--sc); letter-spacing: .14em; font-size: 15px; color: var(--s-accent); text-transform: lowercase }
.muted { color: var(--ink-2) }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid currentColor; background: none; padding: 11px 18px; border-radius: 2px; font: 500 14px/1 var(--body); letter-spacing: .02em; text-decoration: none }
.btn.solid { background: var(--s-accent); border-color: var(--s-accent); color: #fff }
.btn.small { padding: 8px 12px; font-size: 13px }

/* preview bar */
.pbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: #161412; color: #e9e2d3; border-bottom: 1px solid #2c2824 }
.pbar .wrap { display: flex; align-items: center; gap: 14px; min-height: 50px; max-width: none }
.pbar .brand { font: 600 15px/1 var(--display); white-space: nowrap; letter-spacing: .01em }
.pbar .brand small { font: 500 10px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: #9a8f7c; margin-left: 8px }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; mask-image: linear-gradient(90deg, #000 92%, transparent) }
.tabs::-webkit-scrollbar { display: none }
.tabs a { white-space: nowrap; text-decoration: none; font: 500 12.5px/1 var(--body); padding: 9px 11px; border-radius: 3px; color: #b9ae9a }
.tabs a:hover { color: #fff; background: #26221e }
.tabs a.on { color: #161412; background: #e9e2d3 }
.tabs .sep { width: 1px; background: #38322c; margin: 6px 4px; flex: none }
.tabs a.hubtab { color: #a9c6a6 }
.tabs a.hubtab.on { background: #a9c6a6; color: #13201a }

/* faux address bar: each sister site lives on its own domain */
.addr { display: flex; align-items: center; gap: 10px; padding: 7px 0; font: 500 12px/1 var(--body); color: var(--ink-2); border-bottom: 1px solid var(--line); background: var(--paper-2) }
.addr .url { background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 6px 12px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 }
.addr .url b { color: var(--ink); font-weight: 600 }
.addr .note { margin-left: auto; white-space: nowrap }

/* ---------- town ---------- */
.hero { position: relative; color: #f4efe6; background: #2a2622; overflow: hidden }
.hero img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(.92) }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,16,12,.15) 0%, rgba(20,16,12,.25) 45%, rgba(20,16,12,.78) 100%) }
.hero .wrap { position: relative; z-index: 1; padding-block: 140px 56px; display: grid; gap: 18px }
.hero h1 { font-size: clamp(46px, 8.6vw, 112px); font-weight: 400; letter-spacing: -.01em; max-width: 12ch }
.hero h1 em { font-style: italic; color: #e7c98a }
.hero p.lede { max-width: 54ch; font-size: 17px; color: #e7dfd0 }
.hero .meta { display: flex; flex-wrap: wrap; gap: 8px 22px; font: 500 12px/1.4 var(--body); letter-spacing: .12em; text-transform: uppercase; color: #cfc4b0 }
.credit { font-size: 11px; color: var(--ink-2) }
.hero .credit { position: absolute; right: 12px; bottom: 8px; z-index: 1; color: #bdb3a2 }

.sect { padding-block: 72px }
.sect + .sect { border-top: 1px solid var(--line) }
.sect-head { display: grid; gap: 10px; margin-bottom: 30px; max-width: 760px }
.sect-head h2 { font-size: clamp(32px, 4.6vw, 52px) }

.mapbox { position: relative; height: min(78vh, 720px); min-height: 460px; border-radius: 4px; overflow: hidden; background: #d9d3c3; border: 1px solid var(--line) }
.map-tools { position: absolute; left: 12px; top: 12px; z-index: 3; display: flex; flex-wrap: wrap; gap: 6px }
.map-tools button { background: rgba(244,239,230,.92); color: #2a2420; border: 1px solid rgba(0,0,0,.08); padding: 7px 11px; border-radius: 2px; font: 500 12px/1 var(--body) }
.map-tools button.on { background: #2a2420; color: #f4efe6 }
.map-key { position: absolute; left: 12px; bottom: 12px; z-index: 3; background: rgba(244,239,230,.92); color: #2a2420; padding: 8px 12px; border-radius: 2px; font: 500 12px/1.5 var(--body); display: flex; gap: 14px; flex-wrap: wrap }
.map-key i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0 }
.map-key .road { width: 18px; height: 3px; border-radius: 0; background: #c9a24a }
.bm-labels { position: absolute; inset: 0; pointer-events: none; z-index: 2; overflow: hidden }
.bm-pin { position: absolute; left: 0; top: 0; pointer-events: auto; border: 0; background: none; padding: 0; display: flex; align-items: center; gap: 6px; margin: -6px 0 0 -6px; color: #2a2420; font: 500 14px/1 var(--display) }
.bm-dot { width: 12px; height: 12px; border-radius: 50%; background: #7b3b2c; box-shadow: 0 0 0 2px #f4efe6, 0 1px 4px rgba(0,0,0,.35); flex: none; transition: transform .15s }
.bm-stay .bm-dot { background: #50697a } .bm-landmark .bm-dot { background: #b08a3e } .bm-other .bm-dot { background: #6b6a5a }
.bm-name { background: rgba(244,239,230,.93); padding: 4px 8px 5px; border-radius: 2px; box-shadow: 0 1px 3px rgba(0,0,0,.15); white-space: nowrap; opacity: .92 }
.bm-pin.is-hover .bm-dot, .bm-pin.is-on .bm-dot { transform: scale(1.35) }
.bm-pin.is-on .bm-name { background: #2a2420; color: #f4efe6 }
.mapbox.dim-shop .bm-shop, .mapbox.dim-stay .bm-stay, .mapbox.dim-landmark .bm-landmark, .mapbox.dim-other .bm-other { opacity: .25 }
.pincard { position: absolute; right: 12px; top: 12px; z-index: 4; width: min(340px, calc(100% - 24px)); background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 14px 40px rgba(0,0,0,.22); overflow: hidden }
.pincard img { width: 100%; aspect-ratio: 16/10; object-fit: cover }
.pincard .in { padding: 16px 18px 18px; display: grid; gap: 10px }
.pincard h3 { font-size: 28px; font-family: var(--display) }
.pincard .row { display: flex; flex-wrap: wrap; gap: 8px }
.pincard .x { position: absolute; right: 8px; top: 8px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(20,16,12,.6); color: #fff; font-size: 16px; line-height: 30px }
.pincard .tag { font: 500 11px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2) }

.story { display: grid; grid-template-columns: 1fr; gap: 0 }
.tl { display: grid; grid-template-columns: 120px 1fr; gap: 6px 28px; padding: 22px 0; border-top: 1px solid var(--line) }
.tl:first-child { border-top: 0 }
.tl .yr { font: 500 26px/1.1 var(--display); color: var(--bourbon); font-variant-numeric: oldstyle-nums }
.tl h3 { font-size: 24px; margin-bottom: 6px }
.tl p { max-width: 64ch; color: var(--ink-2) }
.two { display: grid; grid-template-columns: 1.1fr .9fr; gap: 48px; align-items: start }
.figure { display: grid; gap: 8px }
.figure img { width: 100%; border-radius: 3px; aspect-ratio: 4/3; object-fit: cover }

.press { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line) }
.press figure { margin: 0; background: var(--paper); padding: 28px 26px; display: grid; gap: 16px; align-content: space-between }
.press blockquote { margin: 0; font: italic 400 23px/1.3 var(--display) }
.press figcaption { font: 500 12px/1.4 var(--body); letter-spacing: .06em; color: var(--ink-2) }
.press figcaption b { display: block; color: var(--ink); letter-spacing: .12em; text-transform: uppercase; font-size: 11px }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 22px }
.card { display: grid; gap: 10px; text-decoration: none; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; text-align: left }
.card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 3px; transition: transform .4s }
.card .im { overflow: hidden; border-radius: 3px; position: relative }
.card:hover img { transform: scale(1.03) }
.card h3 { font-size: 26px }
.card .k { font: 500 11px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--s-accent) }
.card .badge { position: absolute; left: 10px; top: 10px; background: rgba(20,16,12,.72); color: #f4efe6; font: 500 11px/1 var(--body); padding: 6px 8px; border-radius: 2px; letter-spacing: .04em }
.also { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px }
.also .card img { aspect-ratio: 3/2 }

.tractor { display: grid; grid-template-columns: .9fr 1.1fr; gap: 40px; align-items: center; background: var(--oak); color: #eef0e8; border-radius: 4px; padding: 40px }
.tractor h2 { font-size: clamp(30px, 4vw, 46px) }
.tractor .eyebrow { color: #d8c48f }
.tractor svg { width: 100%; height: auto }

/* calendar */
.cal { display: grid; grid-template-columns: 300px 1fr; gap: 36px; align-items: start }
.month { border: 1px solid var(--line); border-radius: 3px; padding: 14px; background: var(--paper) }
.month .mh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font: 500 22px/1 var(--display) }
.month .mh button { border: 0; background: none; font-size: 18px; padding: 4px 8px }
.grid7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; font-variant-numeric: tabular-nums; text-align: center; font-size: 12.5px }
.grid7 .dow { font-size: 10px; letter-spacing: .1em; color: var(--ink-2); padding: 4px 0 }
.grid7 button { border: 0; background: none; aspect-ratio: 1; border-radius: 50%; position: relative }
.grid7 button.has::after { content: ""; position: absolute; left: 50%; bottom: 4px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--bourbon) }
.grid7 button.sel { background: var(--ink); color: var(--paper) }
.grid7 button.today { box-shadow: inset 0 0 0 1px var(--ink-2) }
.grid7 button:disabled { opacity: .3; cursor: default }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px }
.chip { border: 1px solid var(--line); background: none; border-radius: 20px; padding: 6px 11px; font: 500 12px/1 var(--body); display: inline-flex; align-items: center; gap: 6px }
.chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink) }
.chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block }
.evs { display: grid; gap: 0 }
.ev { display: grid; grid-template-columns: 74px 1fr auto; gap: 18px; padding: 18px 0; border-top: 1px solid var(--line); align-items: start }
.ev:first-child { border-top: 0 }
.ev .d { text-align: center; border: 1px solid var(--line); border-radius: 3px; padding: 8px 0 6px; font-variant-numeric: tabular-nums }
.ev .d b { display: block; font: 500 30px/1 var(--display) }
.ev .d span { font: 600 10px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2) }
.ev h3 { font-size: 23px; font-family: var(--display) }
.ev .w { font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 4px }
.ev .w i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px }
.empty { padding: 26px; border: 1px dashed var(--line); border-radius: 3px; color: var(--ink-2) }

/* ---------- sister sites ---------- */
.site { background: var(--s-bg); color: var(--s-ink) }
.site .eyebrow { color: var(--s-accent) }
.shead { border-bottom: 1px solid color-mix(in srgb, var(--s-ink) 14%, transparent) }
.shead .wrap { display: flex; align-items: center; gap: 22px; min-height: 76px; flex-wrap: wrap; padding-block: 10px }
.shead .logo { height: 44px; width: auto; max-width: 230px; object-fit: contain }
.shead .logo-txt { font: 500 28px/1 var(--s-display) }
.shead nav { display: flex; gap: 18px; flex-wrap: wrap; margin-left: auto; font: 500 13px/1 var(--body); letter-spacing: .04em }
.shead nav a { text-decoration: none; opacity: .8 }
.shead nav a:hover { opacity: 1 }
.shero { position: relative; min-height: 520px; display: grid; align-items: end; color: #fff; overflow: hidden; background: #222 }
.shero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover }
.shero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,.66) 100%) }
.shero .wrap { position: relative; z-index: 1; padding-block: 48px; display: grid; gap: 14px; width: 100% }
.shero h1 { font-family: var(--s-display); font-size: clamp(40px, 6.4vw, 84px); max-width: 15ch }
.shero p { max-width: 52ch; font-size: 17px; opacity: .92 }
.shero .row { display: flex; gap: 10px; flex-wrap: wrap }
.shero .btn { color: #fff }
.site .btn.solid { background: var(--s-accent); border-color: var(--s-accent) }
.site h2 { font-family: var(--s-display); font-size: clamp(30px, 4.2vw, 48px) }
.site .sect + .sect { border-top-color: color-mix(in srgb, var(--s-ink) 12%, transparent) }
.prose { display: grid; gap: 14px; max-width: 64ch }
.prose p { color: color-mix(in srgb, var(--s-ink) 80%, transparent) }
.gal { display: grid; grid-template-columns: repeat(12, 1fr); grid-auto-rows: 120px; gap: 8px }
.gal img { width: 100%; height: 100%; object-fit: cover; border-radius: 2px; cursor: zoom-in }
.gal img:nth-child(6n+1) { grid-column: span 7; grid-row: span 3 }
.gal img:nth-child(6n+2) { grid-column: span 5; grid-row: span 2 }
.gal img:nth-child(6n+3) { grid-column: span 5; grid-row: span 1 }
.gal img:nth-child(6n+4) { grid-column: span 4; grid-row: span 2 }
.gal img:nth-child(6n+5) { grid-column: span 4; grid-row: span 2 }
.gal img:nth-child(6n) { grid-column: span 4; grid-row: span 2 }
.menu { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 56px }
.menu h3 { grid-column: 1 / -1; font-size: 26px; margin-top: 18px; padding-bottom: 6px; border-bottom: 1px solid color-mix(in srgb, var(--s-ink) 18%, transparent) }
.mi { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; padding: 8px 0 }
.mi b { font-weight: 600 }
.mi .p { font-variant-numeric: tabular-nums; font-weight: 600 }
.mi .ds { grid-column: 1 / -1; font-size: 13.5px; color: color-mix(in srgb, var(--s-ink) 68%, transparent) }
.visit { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px }
.visit div { display: grid; gap: 6px; align-content: start }
.visit .k { font: 600 11px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; opacity: .65 }
.sfoot { padding-block: 36px; font-size: 13px; border-top: 1px solid color-mix(in srgb, var(--s-ink) 14%, transparent) }
.sfoot .wrap { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center }
.sister { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-left: auto; opacity: .75 }
.sister a { text-decoration: none }
.offer { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px }
.offer > div { border: 1px solid color-mix(in srgb, var(--s-ink) 16%, transparent); border-radius: 3px; padding: 22px; display: grid; gap: 10px; align-content: start }
.offer h3 { font-size: 26px; font-family: var(--s-display) }
.offer .price { font: 600 13px/1 var(--body); letter-spacing: .06em }
.faq details { border-top: 1px solid color-mix(in srgb, var(--s-ink) 14%, transparent); padding: 14px 0 }
.faq summary { cursor: pointer; font-weight: 600 }
.faq details p { margin-top: 8px; color: color-mix(in srgb, var(--s-ink) 75%, transparent) }

/* booking sheet */
.sheet { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: rgba(15,12,10,.55); padding: 16px }
.sheet .box { background: var(--paper); color: var(--ink); width: min(520px, 100%); max-height: calc(100dvh - 32px); overflow: auto; border-radius: 5px; padding: 26px; display: grid; gap: 16px; box-shadow: 0 30px 80px rgba(0,0,0,.35) }
.sheet h3 { font: 500 32px/1.05 var(--display) }
.sheet label { display: grid; gap: 6px; font: 500 12px/1 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2) }
.sheet input, .sheet select, .sheet textarea { font: 400 15px/1.3 var(--body); padding: 11px 12px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 3px; text-transform: none; letter-spacing: 0 }
.sheet .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.sheet .slots { display: flex; flex-wrap: wrap; gap: 6px }
.sheet .slots button { border: 1px solid var(--line); background: none; padding: 8px 12px; border-radius: 3px; font-size: 13px }
.sheet .slots button.on { background: var(--ink); color: var(--paper) }
.sheet .acts { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap }
.sheet .via { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 8px }
.sheet .done { text-align: center; display: grid; gap: 10px; padding: 18px 0 }
.lightbox { position: fixed; inset: 0; z-index: 80; background: rgba(10,8,6,.92); display: grid; place-items: center; padding: 20px; cursor: zoom-out }
.lightbox img { max-height: 90dvh; width: auto; border-radius: 2px }

/* stays */
.stay-hero { display: grid; grid-template-columns: 2fr 1fr 1fr; grid-template-rows: 220px 220px; gap: 6px; border-radius: 4px; overflow: hidden }
.stay-hero img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in }
.stay-hero img:first-child { grid-row: span 2 }
.stay-body { display: grid; grid-template-columns: 1fr 370px; gap: 48px; align-items: start }
.booker { position: sticky; top: 70px; border: 1px solid var(--line); border-radius: 4px; padding: 20px; display: grid; gap: 14px; background: var(--paper); box-shadow: 0 10px 30px rgba(0,0,0,.06) }
.booker .pr { font: 500 28px/1 var(--display) }
.booker .pr small { font: 400 13px/1 var(--body); color: var(--ink-2) }
.mini-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-size: 12px; font-variant-numeric: tabular-nums }
.mini-cal button { border: 0; background: none; aspect-ratio: 1; border-radius: 3px; font-size: 12.5px }
.mini-cal button.booked { text-decoration: line-through; opacity: .35; cursor: not-allowed }
.mini-cal button.in { background: color-mix(in srgb, var(--creek) 22%, transparent) }
.mini-cal button.end { background: var(--creek); color: #fff }
.mini-cal .dow { font-size: 10px; color: var(--ink-2); letter-spacing: .1em; padding: 3px 0 }
.lines { display: grid; gap: 6px; font-size: 14px; font-variant-numeric: tabular-nums }
.lines div { display: flex; justify-content: space-between }
.lines .tot { border-top: 1px solid var(--line); padding-top: 8px; font-weight: 600 }
.facts { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 14px; color: var(--ink-2) }
.amen { columns: 2; column-gap: 28px; font-size: 14px }
.amen li { break-inside: avoid; padding: 4px 0 }
.revs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px }
.revs blockquote { margin: 0; font: italic 400 19px/1.35 var(--display) }
.revs figure { margin: 0; display: grid; gap: 8px }
.revs figcaption { font-size: 12px; color: var(--ink-2) }
.livepill { display: inline-flex; align-items: center; gap: 6px; font: 500 11px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--ok) }
.livepill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent) }

/* footer */
.tfoot { background: #161412; color: #cfc4b0; padding-block: 48px; font-size: 13px }
.tfoot .wrap { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 30px }
.tfoot h3 { font-size: 30px; color: #f4efe6; margin-bottom: 8px }
.tfoot a { text-decoration: none; display: block; padding: 3px 0 }
.tfoot .credits { grid-column: 1 / -1; border-top: 1px solid #2c2824; padding-top: 18px; font-size: 11px; color: #8d8270 }

/* ---------- notes layer (tucked away, one spot) ---------- */
.nbtn { position: fixed; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 65; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.15); background: #161412; color: #e9e2d3; display: grid; place-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.3) }
.nbtn .ct { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #b08a3e; color: #161412; font: 600 10px/18px var(--body) }
.npanel { position: fixed; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(68px + env(safe-area-inset-bottom, 0px)); z-index: 65; width: min(360px, calc(100vw - 28px)); max-height: min(70dvh, 620px); display: grid; grid-template-rows: auto 1fr auto; background: #161412; color: #e9e2d3; border-radius: 6px; box-shadow: 0 18px 50px rgba(0,0,0,.4); overflow: hidden; font-size: 13.5px }
.npanel header { padding: 16px 16px 10px; display: grid; gap: 4px }
.npanel header b { font: 500 22px/1.1 var(--display); color: #fff }
.npanel .list { overflow: auto; padding: 0 16px; display: grid; gap: 8px; align-content: start }
.npanel .it { border: 1px solid #2f2a25; border-radius: 4px; padding: 10px; display: grid; gap: 4px }
.npanel .it .t { display: flex; gap: 8px; align-items: center; font-size: 12px; color: #b9ae9a }
.npanel .it .v { font-weight: 600 }
.npanel .it .v.love { color: #9fc49b } .npanel .it .v.hate { color: #e3a194 } .npanel .it .v.edit { color: #e7c98a }
.npanel footer { padding: 12px 16px 16px; display: grid; gap: 8px; border-top: 1px solid #2c2824 }
.npanel .pick { background: #e9e2d3; color: #161412; border: 0; padding: 11px; border-radius: 4px; font-weight: 600 }
.npanel .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px }
.npanel .row3 button { background: #26221e; border: 1px solid #38322c; padding: 9px 4px; border-radius: 4px; font-size: 12.5px }
body.picking * { cursor: crosshair !important }
.pick-hl { outline: 2px solid #b08a3e !important; outline-offset: 2px }
.npop { position: fixed; z-index: 75; width: min(300px, calc(100vw - 24px)); background: #161412; color: #e9e2d3; border-radius: 6px; padding: 12px; display: grid; gap: 8px; box-shadow: 0 18px 50px rgba(0,0,0,.45); font-size: 13px }
.npop .what { color: #b9ae9a; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.npop .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px }
.npop .row3 button { background: #26221e; border: 1px solid #38322c; padding: 10px 4px; border-radius: 4px; font-weight: 600 }
.npop .row3 button.on { background: #e9e2d3; color: #161412 }
.npop textarea { background: #0f0d0c; color: #e9e2d3; border: 1px solid #38322c; border-radius: 4px; padding: 9px; font: 400 13.5px/1.4 var(--body); min-height: 70px; resize: vertical }
.npop .acts { display: flex; justify-content: flex-end; gap: 8px }
.npop .acts button { border: 0; border-radius: 4px; padding: 8px 12px; background: #26221e }
.npop .acts .save { background: #e9e2d3; color: #161412; font-weight: 600 }
.nmark { position: absolute; z-index: 40; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 11px/1 var(--body); color: #161412; box-shadow: 0 2px 8px rgba(0,0,0,.3); pointer-events: auto; border: 2px solid #fff }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 90; background: #161412; color: #f4efe6; padding: 11px 16px; border-radius: 4px; font-size: 13.5px; box-shadow: 0 10px 30px rgba(0,0,0,.3) }

/* ---------- Hub ---------- */
.hub { background: var(--hub); color: var(--hub-ink); min-height: 100vh; --s-accent: #a9c6a6 }
.hub-shell { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 50px) }
.hub-nav { border-right: 1px solid var(--hub-line); padding: 18px 12px; display: grid; gap: 2px; align-content: start; position: sticky; top: 50px; height: calc(100vh - 50px); overflow: auto }
.hub-nav .logo { font: 600 13px/1 var(--body); letter-spacing: .22em; padding: 6px 10px 18px; color: #fff }
.hub-nav .logo span { display: block; font: 500 22px/1 var(--display); letter-spacing: 0; margin-top: 6px; color: #a9c6a6 }
.hub-nav button { text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 4px; font-size: 13.5px; color: #b9c4b9; display: flex; align-items: center; gap: 9px }
.hub-nav button:hover { background: var(--hub-2); color: #fff }
.hub-nav button.on { background: var(--hub-2); color: #fff; box-shadow: inset 2px 0 0 #a9c6a6 }
.hub-nav .grp { font: 600 10px/1 var(--body); letter-spacing: .16em; text-transform: uppercase; color: #6f806f; padding: 16px 10px 6px }
.hub-nav .dot { width: 7px; height: 7px; border-radius: 50%; margin-left: auto }
.hub-main { padding: 26px clamp(16px, 3vw, 36px) 80px; display: grid; gap: 22px; align-content: start; min-width: 0 }
.hub-main h1 { font: 500 38px/1.05 var(--display); color: #fff }
.hub-main h2 { font: 500 24px/1.1 var(--display); color: #fff }
.hub-main .sub { color: #a5b2a5; max-width: 72ch }
.hgrid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px }
.pane { background: var(--hub-2); border: 1px solid var(--hub-line); border-radius: 6px; padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0 }
.pane h3 { font: 600 11px/1 var(--body); letter-spacing: .16em; text-transform: uppercase; color: #8fa38f; font-family: var(--body) }
.span4 { grid-column: span 4 } .span5 { grid-column: span 5 } .span6 { grid-column: span 6 } .span7 { grid-column: span 7 } .span8 { grid-column: span 8 } .span12 { grid-column: span 12 } .span3 { grid-column: span 3 }
.kpi b { display: block; font: 500 34px/1 var(--display); color: #fff; font-variant-numeric: tabular-nums }
.kpi span { font-size: 12px; color: #9fae9f }
.hrow { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--hub-line); font-size: 13.5px }
.hrow:first-of-type { border-top: 0 }
.hrow .s { font-size: 12px; color: #9fae9f }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 600 10.5px/1 var(--body); letter-spacing: .06em; text-transform: uppercase; padding: 5px 8px; border-radius: 20px; background: #2f3d35; color: #cfe0cc; white-space: nowrap }
.pill.ok { background: color-mix(in srgb, var(--ok) 30%, transparent); color: #bfe0bd }
.pill.warn { background: color-mix(in srgb, var(--warn) 30%, transparent); color: #f0d39b }
.pill.bad { background: color-mix(in srgb, var(--bad) 35%, transparent); color: #f2b4a8 }
.pill.off { background: #2a332e; color: #8c9a8c }
.hbtn { border: 1px solid #4c5e51; background: none; color: #e8ece3; padding: 8px 12px; border-radius: 4px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center }
.hbtn.go { background: #a9c6a6; color: #13201a; border-color: #a9c6a6; font-weight: 600 }
.hbtn.ai { border-color: #6f9a74; box-shadow: inset 0 0 0 1px rgba(169,198,166,.25) }
.hinput, .hub select, .hub textarea { background: #142019; color: #eef0e8; border: 1px solid var(--hub-line); border-radius: 4px; padding: 9px 10px; font: 400 14px/1.3 var(--body); width: 100% }
.hub label { display: grid; gap: 5px; font-size: 12px; color: #9fae9f }
.conn { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--hub-line); border-radius: 6px; background: #18221d }
.conn .ic { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; font: 700 13px/1 var(--body); color: #fff }
.conn .n { font-weight: 600 } .conn .d { font-size: 12px; color: #9fae9f }
.flow { display: grid; gap: 0; position: relative }
.fstep { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding-bottom: 16px; position: relative }
.fstep::before { content: ""; position: absolute; left: 16px; top: 34px; bottom: 0; width: 2px; background: var(--hub-line) }
.fstep:last-child::before { display: none }
.fstep .n { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #2f3d35; font: 600 12px/1 var(--body) }
.email { background: #f6f2ea; color: #2a2420; border-radius: 4px; overflow: hidden; font-size: 14px }
.email .eh { padding: 18px; text-align: center; background: #1f1a17; }
.email .eh img { height: 34px; width: auto; margin: 0 auto }
.email .eb { padding: 22px; display: grid; gap: 12px }
.email h4 { font: 500 28px/1.1 var(--display); margin: 0; text-align: center }
.email .eprods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }
.email .eprods img { aspect-ratio: 1; object-fit: cover; width: 100% }
.email .ecta { justify-self: center; background: #7a2b23; color: #fff; padding: 11px 20px; font: 600 12px/1 var(--body); letter-spacing: .1em; text-transform: uppercase }
.table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums }
.table th { text-align: left; font: 600 10.5px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: #8fa38f; padding: 8px 10px; border-bottom: 1px solid var(--hub-line) }
.table td { padding: 10px; border-bottom: 1px solid var(--hub-line); vertical-align: middle }
.table img { width: 44px; height: 44px; object-fit: cover; border-radius: 4px }
.tscroll { overflow-x: auto }
.chans { display: flex; gap: 4px; flex-wrap: wrap }
.chans span { font: 700 9.5px/1 var(--body); padding: 4px 5px; border-radius: 3px; background: #2f3d35; color: #cfe0cc }
.chans span.off { opacity: .3 }
.hcal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--hub-line); border: 1px solid var(--hub-line); border-radius: 6px; overflow: hidden; font-size: 11.5px }
.hcal > div { background: var(--hub-2); min-height: 92px; padding: 6px; display: grid; gap: 3px; align-content: start; min-width: 0 }
.hcal .dn { color: #9fae9f; font-variant-numeric: tabular-nums }
.hcal .e { border-radius: 3px; padding: 3px 5px; color: #101510; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer }
.hcal .hd { min-height: 0; padding: 7px; font: 600 10px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: #8fa38f }
.wiring { width: 100%; height: auto }

/* ---------- shop ---------- */
.shop-grid { display: grid; grid-template-columns: 220px 1fr; gap: 36px; align-items: start }
.shop-side { display: grid; gap: 4px; position: sticky; top: 70px }
.shop-side button { border: 0; background: none; text-align: left; padding: 7px 0; font-size: 14px; opacity: .72 }
.shop-side button.on { opacity: 1; font-weight: 600; text-decoration: underline; text-underline-offset: 4px }
.prods { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 26px 20px }
.prod { display: grid; gap: 8px; cursor: pointer; border: 0; background: none; padding: 0; text-align: left }
.prod .im { aspect-ratio: 4/5; overflow: hidden; background: color-mix(in srgb, var(--s-ink) 6%, transparent); position: relative }
.prod img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s }
.prod:hover img { transform: scale(1.04) }
.prod .nm { font: 500 19px/1.2 var(--s-display) }
.prod .pr { font-size: 14px; font-variant-numeric: tabular-nums }
.prod .one { position: absolute; left: 8px; top: 8px; background: rgba(255,255,255,.9); color: #2a2420; font: 600 10px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; padding: 5px 7px }
.pdp { display: grid; grid-template-columns: 1.1fr .9fr; gap: 40px; align-items: start }
.pdp .main { aspect-ratio: 4/5; object-fit: cover; width: 100% }
.cartbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: #1f1a17; color: #f4efe6; border-radius: 30px; padding: 8px 8px 8px 18px; display: flex; gap: 14px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.3); font-size: 14px }
.cartbar button { background: #f4efe6; color: #1f1a17; border: 0; border-radius: 20px; padding: 9px 14px; font-weight: 600 }

@media (max-width: 900px) {
  .two, .cal, .tractor, .stay-body, .pdp, .shop-grid { grid-template-columns: 1fr }
  .press, .also, .visit { grid-template-columns: 1fr }
  .menu { grid-template-columns: 1fr }
  .stay-hero { grid-template-columns: 1fr 1fr; grid-template-rows: 200px 120px }
  .stay-hero img:first-child { grid-column: span 2; grid-row: auto }
  .stay-hero img:nth-child(n+4) { display: none }
  .booker, .shop-side { position: static }
  .shop-side { display: flex; flex-wrap: wrap; gap: 4px 14px }
  .tfoot .wrap { grid-template-columns: 1fr }
  .hub-shell { grid-template-columns: 1fr }
  .hub-nav { position: static; height: auto; display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--hub-line); padding: 8px }
  .hub-nav .grp, .hub-nav .logo { display: none }
  .hub-nav button { white-space: nowrap }
  .span3, .span4, .span5, .span6, .span7, .span8 { grid-column: span 12 }
  .span3.kpi { grid-column: span 6 }
  .gal { grid-auto-rows: 90px }
  .gal img:nth-child(n) { grid-column: span 6; grid-row: span 2 }
  .tl { grid-template-columns: 1fr }
  .hcal > div { min-height: 64px }
  .addr .note { display: none }
}
@media (max-width: 560px) {
  .hero .wrap { padding-block: 100px 40px }
  .ev { grid-template-columns: 60px 1fr }
  .ev .act { grid-column: 2 }
  .amen { columns: 1 }
  .sheet .grid2 { grid-template-columns: 1fr }
  .tractor { padding: 24px }
  .email .eprods { grid-template-columns: repeat(2, 1fr) }
  .pbar .brand small { display: none }
}

/* ---------- shared pieces ---------- */
.bub { width: var(--bs); height: var(--bs); flex: none; border-radius: 50%; background: var(--bc); color: var(--bi); display: inline-grid; place-items: center; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--bi) 35%, transparent), 0 1px 3px rgba(0,0,0,.18) }
.bub i { font: 400 calc(var(--bs) * .46)/1 var(--bf), Georgia, serif; font-style: normal; letter-spacing: -.02em; transform: translateY(.04em) }
.cardline { display: flex; align-items: center; gap: 12px; min-width: 0 }
.cardline h3 { margin-top: 2px }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.btn.light { color: #fff; border-color: rgba(255,255,255,.7) }
.btn.gold { background: #b08a3e; border-color: #b08a3e; color: #1d160b }
.btn.wide { width: 100%; justify-content: center }
.btn[disabled] { opacity: .45; cursor: not-allowed }
.big-p { font-size: clamp(17px, 1.6vw, 20px); line-height: 1.5; color: var(--ink-2); max-width: 46ch }
.site .big-p { color: color-mix(in srgb, var(--s-ink) 75%, transparent) }
.h1big { font-size: clamp(44px, 7vw, 88px) }
.muted.small, .small { font-size: 12.5px }
.livepill { margin-top: 6px }
.sect-head .livepill { justify-self: start }

/* town */
.town-hero .wrap { padding-block: 120px 64px }
.town-hero .logo-lock { width: 170px; opacity: .9 }
.town-hero .row { margin-top: 8px }
.big-line { display: grid; gap: 8px; margin-bottom: 26px }
.big-line h2 { font-size: clamp(34px, 5.4vw, 64px); max-width: 16ch }
.strip { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin }
.chipev { flex: none; display: flex; gap: 12px; align-items: center; padding: 12px 18px 12px 12px; border: 1px solid var(--line); border-radius: 40px; text-decoration: none; background: var(--paper) }
.chipev b { display: block; font: 500 19px/1.1 var(--display) }
.chipev small { color: var(--ink-2); font-size: 12.5px }
.always { background: var(--paper-2) }
.mapbox { height: min(82vh, 760px) }
.map-cart { position: absolute; right: 14px; bottom: 14px; z-index: 3; display: grid; justify-items: center; padding: 12px 20px 10px; background: rgba(244,239,230,.9); color: #2a2420; border: 1px solid rgba(60,40,20,.25); outline: 1px solid rgba(244,239,230,.9); outline-offset: 3px; text-align: center; pointer-events: none }
.map-cart b { font: italic 500 30px/1 var(--display) }
.map-cart span { font: 500 12px/1.4 var(--sc); letter-spacing: .14em; text-transform: lowercase }
.map-cart .est { font-size: 11px; opacity: .7 }
.map-key i { vertical-align: middle }
.bm-pin .bub { transition: transform .15s }
.bm-pin.is-hover .bub, .bm-pin.is-on .bub { transform: scale(1.18) }
.bm-name small { display: block; font: 500 10px/1.2 var(--body); color: #6b5f50; letter-spacing: .04em }

/* the revival page: Linda and Jerry Bruckheimer and the town that came back (classes start with rv- so nothing else catches them) */

.rv-nums div { display: grid; gap: 4px; border-left: 1px solid rgba(231,194,122,.4); padding-left: 16px } .rv-nums b { font: 500 clamp(40px, 4.4vw, 60px)/1 var(--display); color: #e7c27a } .rv-nums span { font-size: 15px; color: #d8cbb6 }

.rv-open-grid .rv-fig { position: sticky; top: 90px }
.rv-lead { }
.rv-note p { font: 400 clamp(19px, 1.5vw, 22px)/1.55 var(--display); color: var(--ink) }
.rv-sign { font: 600 14px var(--sc) !important; letter-spacing: .16em; text-transform: lowercase; color: var(--bourbon) !important }
.rv-honors { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; max-width: 900px }

}

.lnav-links { display: grid; gap: 2px }

.shell { margin-left: 236px; transition: margin-left .25s; min-width: 0 }

/* ---------- the travel spread and the shared film grade ---------- */
.film img { filter: sepia(.16) saturate(.86) contrast(1.06) brightness(1.03) hue-rotate(-5deg) }
.film .tile::after, .film.town-hero .slides::after { content: ""; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light; opacity: .55;
  background: linear-gradient(160deg, rgba(255,214,160,.55), rgba(120,70,40,.25) 60%, rgba(40,30,60,.3)),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>") }
.film.town-hero .slides { position: absolute; inset: 0 }
.spread { padding-block: 84px 72px; background: var(--paper) }
.spread-head { display: grid; justify-items: center; text-align: center; gap: 10px; margin-bottom: 38px }
.spread-head h2 { font: italic 400 clamp(46px, 7.4vw, 104px)/1 var(--display); letter-spacing: -.01em }
.spread-head p { font: 400 clamp(18px, 2vw, 24px)/1.4 var(--display); color: var(--ink-2) }
.mosaic { display: grid; grid-template-columns: repeat(12, 1fr); grid-auto-rows: clamp(70px, 7.4vw, 104px); gap: 10px }
.tile { position: relative; overflow: hidden; border-radius: 2px; display: block; color: #fff; text-decoration: none; background: #2a2622 }
.tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s cubic-bezier(.2,.7,.2,1) }
.tile:hover img { transform: scale(1.05) }
.tile .cap { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; padding: 40px 16px 14px; display: grid; gap: 2px; background: linear-gradient(180deg, transparent, rgba(15,10,6,.62)) }
.tile .cap i { font: italic 400 clamp(17px, 1.7vw, 24px)/1.15 var(--display) }
.tile .cap b { font: 600 10px/1.4 var(--body); letter-spacing: .18em; text-transform: uppercase; opacity: .85 }
.t0 { grid-column: 1 / 8; grid-row: span 5 } .t1 { grid-column: 8 / 13; grid-row: span 3 } .t2 { grid-column: 8 / 13; grid-row: span 2 }
.t3 { grid-column: 1 / 5; grid-row: span 4 } .t4 { grid-column: 5 / 10; grid-row: span 4 } .t5 { grid-column: 10 / 13; grid-row: span 4 }
.t6 { grid-column: 1 / 6; grid-row: span 3 } .t7 { grid-column: 6 / 13; grid-row: span 3 }
.t8 { grid-column: 1 / 4; grid-row: span 3 } .t9 { grid-column: 4 / 8; grid-row: span 3 } .t10 { grid-column: 8 / 13; grid-row: span 3 }
.cards .card img, .also .card img { filter: sepia(.12) saturate(.9) contrast(1.04) }
@media (max-width: 760px) {
  .mosaic { grid-template-columns: 1fr 1fr; grid-auto-rows: 130px }
  .mosaic .tile { grid-column: span 1; grid-row: span 2 }
  .mosaic .t0, .mosaic .t3, .mosaic .t6 { grid-column: span 2; grid-row: span 2 }
}

.bub i { font: var(--bt) var(--bw) calc(var(--bs) * var(--bk))/1 var(--bf), Georgia, serif; letter-spacing: 0 }
.lnav-links a { font: 600 14px/1 var(--sc); text-transform: uppercase; letter-spacing: .16em }

/* hero legibility: a dark wash where the words sit, lighter where they don't */

  linear-gradient(90deg, rgba(14,10,7,.78) 0%, rgba(14,10,7,.55) 38%, rgba(14,10,7,.12) 72%, rgba(14,10,7,0) 100%),
  linear-gradient(180deg, rgba(14,10,7,.25) 0%, rgba(14,10,7,0) 30%, rgba(14,10,7,.55) 100%) }
.shero::after { background:
  linear-gradient(90deg, rgba(10,8,6,.74) 0%, rgba(10,8,6,.5) 42%, rgba(10,8,6,.1) 75%, rgba(10,8,6,0) 100%),
  linear-gradient(180deg, rgba(10,8,6,0) 30%, rgba(10,8,6,.6) 100%) }

}

/* tone the parlor's hot pink toward the site's warm palette */

.be-logos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px }

.tabs { gap: 8px; align-items: center }
.marks { display: grid; gap: 0; background: #f6f2ea; border-radius: 10px; overflow: hidden }
.mk-h, .mk-r { display: grid; grid-template-columns: 1.1fr 1.4fr 1.3fr .7fr; gap: 16px; align-items: center; padding: 12px 18px }

@media (max-width: 800px) { .mk-h { display: none } .mk-r { grid-template-columns: 1fr 1fr } }
.bicon.mono i { font-style: normal; letter-spacing: 0; transform: translateY(.04em) }
.bicon.img img { width: 100%; height: 100%; object-fit: cover; border-radius: 50% }

.bicon.img.b-revival img { width: 66%; height: 66%; object-fit: contain; border-radius: 0; margin-top: -4% }
.bicon.b-pinkhouse.mono i { letter-spacing: .12em; margin-right: -.12em }
/* names beside the color dots, in the town serif */
.bchip span, .mk-dot, .ev .w span:not(.bdot), .pick-brands button span, .chipev small, .em-sales span, .em-ev span:not(.t), .doms b, #mbrand button { font-family: "Cormorant Garamond", Georgia, serif !important; font-weight: 600; letter-spacing: .01em }
.bchip span, .mk-dot { font-size: 15.5px }
.ev .w span:not(.bdot) { font-size: 15px }
.pick-brands button span, #mbrand button { font-size: 14.5px }
/* top bar: icons, with the logo on hover */
.tabs a.logo-tab .bicon { transition: transform .15s; box-shadow: 0 0 0 1px rgba(60,40,20,.12) }
.tabs a.logo-tab:hover .bicon { transform: scale(1.12) }
.tabs a.logo-tab.on .bicon { box-shadow: 0 0 0 2px #f1e8d8, 0 0 0 3.5px #7b3b2c }
.navcard { position: fixed; z-index: 90; width: 240px; padding-block: 16px !important; background: #fffaf2; color: #2a2420; border-radius: 12px; padding: 14px; display: grid; justify-items: center; gap: 6px; text-align: center; box-shadow: 0 14px 34px rgba(40,24,12,.25); opacity: 0; transform: translateY(-4px); pointer-events: none; transition: opacity .15s, transform .15s }
.navcard.on { opacity: 1; transform: none }
.navcard b { font: 600 18px/1.1 "Cormorant Garamond", Georgia, serif; margin-top: 4px }
.navcard span { font: 600 13px/1.3 var(--sc); letter-spacing: .14em; text-transform: lowercase; color: #9c5a26 }

/* shop link, top right */
.shop-link { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; flex: none; text-decoration: none; font: 600 16px var(--sc); letter-spacing: .16em; text-transform: lowercase; color: #9c5a26; padding: 7px 14px; border-radius: 30px; border: 1px solid transparent }
.shop-link:hover { border-color: #9c5a26 }
.shop-link.on { background: #9c5a26; color: #f4efe6 }
/* vintage, washed out photo on the Instagram mock */
.mk-ig img { filter: sepia(.35) saturate(.62) contrast(.86) brightness(1.06) }
.mk-ig::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(244,232,210,.10) 40%, rgba(90,62,34,.30) 100%), rgba(236,220,190,.16); pointer-events: none }
.mk-ig .mk-ov, .mk-ig span { z-index: 2 }

/* section explainers */
.intro-steps { list-style: none; counter-reset: st; display: grid; gap: 8px; margin: 2px 0; padding: 0 }
.intro-foot { display: flex; align-items: center; gap: 16px; flex-wrap: wrap } .intro-foot span { color: #8a7a66; font-size: 14px; font-style: italic }
.intro-steps li { counter-increment: st; display: flex; gap: 12px; align-items: center; font-size: 16px; color: #2a2420 }
.intro-steps li::before { content: counter(st); flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: #7b3b2c; color: #fffaf2; font: 600 14px var(--body) }
.intro-chips { display: flex; flex-wrap: wrap; gap: 6px }
.intro-chips span { font: 600 13px var(--body); padding: 6px 12px; border-radius: 20px; background: #f3e6cf; color: #7b3b2c }
.intro-chips span:first-child { background: #ff5a5f; color: #fff }

/* Nettie's script logo, bigger */
.shead .logo.logo-nj { height: 64px; max-width: 360px }
.intro-chips span:first-child { background: #f3e6cf; color: #7b3b2c }
.intro-foot a { color: #7b3b2c; font-size: 15px; font-weight: 600 }

/* Nettie: one header for the landing page and the shop */
.nj-head .wrap { gap: 14px }
.nj-head .nj-home { display: block; line-height: 0 }
.nj-head nav { margin-right: 6px }
.nj-head nav a.on { opacity: 1; text-decoration: underline; text-underline-offset: 6px; text-decoration-color: #c9a96a }
.nj-head .btn:not(.solid) { color: var(--s-headink); border-color: color-mix(in srgb, var(--s-headink) 40%, transparent); background: none }
.nj-bag { display: inline-flex; align-items: center; gap: 7px; background: #c9a96a !important; border-color: #c9a96a !important; color: #14251b !important }
.nj-bag b { min-width: 20px; height: 20px; border-radius: 10px; background: #14251b; color: #faedcd; font: 600 11px/20px var(--body); text-align: center; padding: 0 5px }
.nj-strip { padding-top: 46px }
.nj-strip .sect-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap }
.nj-cta { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; padding: 12px 20px }
.prods.four { grid-template-columns: repeat(4, 1fr) }
@media (max-width: 760px) { .prods.four { grid-template-columns: repeat(2, 1fr) } .nj-head .btn:not(.solid) { display: none } }

.site-revival .shead .logo { max-width: 260px }

/* idea cards: all gold, and a picture for each marketing idea */
.fcard, .fcard.big { background: linear-gradient(160deg, #fffaf2, #f3e6cf); border-color: #d9c39a }
.lc { margin-top: 4px; border-radius: 10px; background: #fffdf8; border: 1px dashed #c9a96a; padding: 14px; display: grid; gap: 12px; box-shadow: 0 8px 18px rgba(107,42,28,.12) }
.lc-top { display: flex; justify-content: space-between; align-items: baseline; font: 600 11px var(--body); letter-spacing: .14em; text-transform: uppercase; color: #9c5a26 } .lc-top b { font: 600 22px var(--display); letter-spacing: 0; text-transform: none; color: #2a2420 }
.lc-stamps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; justify-items: center }
.lc-stamps > span { width: 38px; height: 38px; border-radius: 50%; border: 1.5px dashed #d9c39a; display: grid; place-items: center }
.lc-stamps > span.on { border: 0; transform: rotate(-8deg) }
.lc-foot { font-size: 13px; color: #5a5249; text-align: center }
.rf { margin-top: 4px; display: grid; gap: 10px }
.rf-msg { border-radius: 10px; background: linear-gradient(160deg, #1f3a2b, #2f5240); color: #faedcd; padding: 16px; display: grid; gap: 6px; box-shadow: 0 8px 18px rgba(31,58,43,.25) }
.rf-who { font-size: 12.5px; opacity: .8 } .rf-msg b { font: 500 26px/1.1 var(--display) }
.rf-code { justify-self: start; font: 600 12px var(--body); letter-spacing: .16em; border: 1px dashed #c9a96a; color: #e7c27a; border-radius: 6px; padding: 5px 9px }
.rf-thanks { display: flex; gap: 10px; align-items: center; background: #fffdf8; border: 1px solid #e0d5c2; border-radius: 10px; padding: 10px 12px; font-size: 13.5px; color: #5a5249 } .rf-thanks b { color: #2a2420 }

.tt-phone { margin-top: 4px; background: #f6f1e8; border: 1px solid #e0d5c2; border-radius: 16px; padding: 12px; display: grid; gap: 6px }
.tt-from { font: 600 11px var(--body); letter-spacing: .12em; text-transform: uppercase; color: #9c5a26 }
.tt-msg { background: #e9e2d3; color: #2a2420; border-radius: 14px 14px 14px 4px; padding: 10px 12px; font-size: 13.5px; line-height: 1.4 }
.tt-time { font-size: 11.5px; color: #8a7a66 }
.sw { margin-top: 4px; display: grid; gap: 8px }
.sw-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px } .sw-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px }
.sw-tag { justify-self: start; font: 600 14px var(--body); color: #7b3b2c; background: #fffdf8; border: 1px solid #d9c39a; border-radius: 20px; padding: 6px 12px }
.bc { margin-top: 4px; border-radius: 10px; background: linear-gradient(160deg, #da0312, #a8020e); color: #fff6ea; padding: 16px; display: grid; gap: 4px; box-shadow: 0 8px 18px rgba(168,2,14,.25) }
.bc-k { font: 600 11px var(--body); letter-spacing: .14em; text-transform: uppercase; opacity: .85 } .bc b { font: 500 28px/1.1 var(--display) } .bc > span:not(.bc-k) { font-size: 13px; opacity: .9 }
.bc-sw { display: flex; gap: 6px; margin-top: 8px }

/* painting keeps its shape so the pins stay on their buildings */
.mapbox.painted-on { height: auto; min-height: 0; aspect-ratio: 3 / 2 }
.mapbox.painted-on .pmap { object-fit: fill }
/* footer: the painting, zoomed to this place */
.minimap { flex: none; width: var(--mm); height: var(--mm); border-radius: 50%; background-image: url(img/town/painted-dusk.jpg); background-repeat: no-repeat; position: relative; box-shadow: 0 0 0 2px #fffaf2, 0 0 0 3px #c9a96a, 0 6px 14px rgba(0,0,0,.25); overflow: hidden }
.minimap::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 50%, transparent 28%, rgba(30,18,10,.45) 78%) }
.minimap .mm-pin { position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #e7c27a; box-shadow: 0 0 0 2px #fffaf2, 0 0 12px 4px rgba(255,214,140,.9); z-index: 1 }
.minimap:hover { transform: scale(1.06); transition: transform .2s }

.visit .findus { display: flex; gap: 18px; align-items: center } .visit .findus > div { display: grid; gap: 6px }

/* Nettie's header links in the shop's own antique type */
.nj-head nav { gap: 22px }
.nj-head nav a { font: 600 15px/1 "Cormorant SC", Georgia, serif; letter-spacing: .14em; text-transform: lowercase; color: #faedcd; opacity: .85 }
.nj-head nav a:hover { opacity: 1; color: #e7c27a }
.nj-head nav a.on { opacity: 1; color: #e7c27a; text-decoration: none; box-shadow: inset 0 -1px 0 #c9a96a; padding-bottom: 4px }
.nj-head .btn { font: 600 14px/1 "Cormorant SC", Georgia, serif; letter-spacing: .1em; text-transform: lowercase }
.nj-bag span { font: inherit }

/* calendar body: warm paper like the weekend planner, soft cream cards */
.cal-body { background: linear-gradient(180deg, #efe5d3, #e8dcc6 60%, #efe5d3); padding-block: 44px 64px }
.cal-body .month { background: #fffaf2; border: 1px solid #e0d2b8; border-radius: 14px; box-shadow: 0 14px 34px rgba(80,50,20,.10) }
.cal-body .evs { display: grid; gap: 10px }
.cal-body .ev { background: #fffaf2; border: 1px solid #e6d9c2; border-radius: 12px; padding: 14px 16px; box-shadow: 0 6px 16px rgba(80,50,20,.06) }
.cal-body .ev .d { background: #7b3b2c; color: #fff6ea; border-color: #7b3b2c; border-radius: 10px }
.cal-body .ev .d span { color: #f1d9b0 }
.cal-body .month button.has-ev { background: #f3e6cf }
.cal-body .month button.has-ev:hover, .cal-body .month button.sel { background: #e9d3ac }
.cal-body .month .mh { background: #f6eedf; border-color: #e0d2b8 }
.cal-body .bchip { background: #fffaf2; border-color: #e0d2b8 }
.cal-body .bchip.on { background: #2a2420; color: #fffaf2; border-color: #2a2420 }

/* map: the logos themselves, sitting on the buildings like lit signs */
.ppin .pl.sign { background: none !important; padding: 0 !important; box-shadow: none !important; border-radius: 0 }
.ppin .pl.sign img { height: 30px; max-width: 150px; filter: drop-shadow(0 1px 1px rgba(20,10,5,.9)) drop-shadow(0 0 6px rgba(20,10,5,.7)) drop-shadow(0 0 14px rgba(255,200,120,.35)) }
.ppin[data-ppin="pizza"] .pl.sign img { height: 42px; max-width: 160px }
.ppin[data-ppin="pinkhouse"] .pl.sign img { height: 36px; max-width: 200px }
.ppin[data-ppin="doubledip"] .pl.sign img { height: 34px; max-width: 190px; filter: drop-shadow(0 0 1px #fff6ea) drop-shadow(0 0 1px #fff6ea) drop-shadow(0 2px 6px rgba(20,10,5,.8)) drop-shadow(0 0 12px rgba(255,90,90,.35)) }
@media (max-width: 760px) { .ppin .pl.sign img { height: 20px; max-width: 100px } .ppin[data-ppin="pizza"] .pl.sign img { height: 28px } }

/* fly-in: the video sits over the painting, then hands off to it; signs light up one by one */
.pmap-vid { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; z-index: 1; transition: opacity .6s }
.pmap-vid.done { opacity: 0; pointer-events: none }
.mapbox:not(.landed) .pmap-vid:not(.done) ~ .ppins { opacity: 0 }
.ppins { position: absolute; z-index: 2 }
.mapbox.flying .ppin { opacity: 0; transform: translate(-50%, -40%) }
.mapbox.flying.landed .ppin { opacity: 1; transform: translate(-50%, -50%); transition: opacity .5s, transform .5s }
.mapbox.flying.landed .ppin:nth-child(1) { transition-delay: 0.12s }
.mapbox.flying.landed .ppin:nth-child(2) { transition-delay: 0.24s }
.mapbox.flying.landed .ppin:nth-child(3) { transition-delay: 0.36s }
.mapbox.flying.landed .ppin:nth-child(4) { transition-delay: 0.48s }
.mapbox.flying.landed .ppin:nth-child(5) { transition-delay: 0.60s }
.mapbox.flying.landed .ppin:nth-child(6) { transition-delay: 0.72s }
.mapbox.flying.landed .ppin:nth-child(7) { transition-delay: 0.84s }
.mapbox.flying.landed .ppin:nth-child(8) { transition-delay: 0.96s }
.mapbox.flying.landed .ppin:nth-child(9) { transition-delay: 1.08s }
.mapbox.flying.landed .ppin:nth-child(10) { transition-delay: 1.20s }
.mapbox.flying.landed .ppin:nth-child(11) { transition-delay: 1.32s }
.mapbox.flying.landed .ppin:nth-child(12) { transition-delay: 1.44s }
.mapbox.flying.landed .ppin:nth-child(13) { transition-delay: 1.56s }

.ppin .pn { display: inline-flex; align-items: center; gap: 6px } .ppin .pn-home { color: #9c5a26; flex: none } .ppin .pn-away { font: 600 10.5px var(--body); letter-spacing: .06em; color: #9c5a26; margin-left: 2px }

/* the opening: hero fly-through, lines over it, the logo, then a one-minute look around */
.wh { position: relative; height: 100vh; min-height: 560px; overflow: hidden; background: #1c120c; color: #fff6ea }
.wh-vid, .wh-stage, .wh-stage .wh-scene, .wh-shade { position: absolute; inset: 0 }
.wh-vid { width: 100%; height: 100%; object-fit: cover; transition: opacity .9s }
.wh-vid.gone { opacity: 0 }
.wh-shade { background: radial-gradient(ellipse at 50% 55%, transparent 35%, rgba(20,10,5,.55) 100%), linear-gradient(180deg, rgba(20,10,5,.25), transparent 30%, transparent 55%, rgba(20,10,5,.7)); pointer-events: none }
.wh-scene { opacity: 0; transition: opacity .8s }
.wh-scene.on { opacity: 1 }
.wh-scene .kb { width: 100%; height: 100%; object-fit: cover; animation: kb 7s ease-out both }
@keyframes kb { from { transform: scale(1.04) } to { transform: scale(1.14) translate(-1%, -1%) } }
.wh-scene.title { display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #6b2a1c, #2a1710) }
.wh-scene.title h2 { font: 500 clamp(34px, 5vw, 68px)/1.08 var(--display); text-align: center; max-width: 16ch; animation: rise .9s ease both }
.wh-lines { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; display: grid; gap: 6px; padding-inline: 20px; pointer-events: none; transition: opacity .6s }
.wh-lines p { font: 500 clamp(30px, 4.6vw, 64px)/1.1 var(--display); text-shadow: 0 2px 24px rgba(0,0,0,.6); opacity: 0; transform: translateY(14px); transition: opacity 1s, transform 1s }
.wh-lines p:last-child { font-style: italic; color: #f3d9a4 }
.wh-lines p.on { opacity: 1; transform: none }
.wh-logo, .wh-end { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; text-align: center; gap: 18px; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 1s }
.wh-logo svg { width: min(520px, 78vw); height: auto; filter: drop-shadow(0 4px 30px rgba(0,0,0,.6)) }
.wh-end { background: radial-gradient(ellipse at 50% 45%, rgba(40,20,10,.55), rgba(20,10,5,.88)) }
.wh-endlogo svg { width: min(320px, 70vw); height: auto }
.wh-end h1 { font: 500 clamp(40px, 6vw, 80px)/1.02 var(--display) }
.wh-end p { font-size: 19px; color: #f3dfc2; max-width: 46ch }
.wh-end .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center }
.wh-cap { position: absolute; left: clamp(20px, 5vw, 72px); bottom: calc(clamp(40px, 9vh, 96px) + 40px); right: 20px; display: grid; gap: 10px; justify-items: start; opacity: 0; transform: translateY(10px); transition: opacity .6s, transform .6s; pointer-events: none }
.wh-cap.show { opacity: 1; transform: none }
.wh-cap .eyebrow { color: #e7c27a }
.wh-cap h2 { font: 500 clamp(30px, 4.2vw, 58px)/1.06 var(--display); max-width: 18ch; text-shadow: 0 2px 20px rgba(0,0,0,.6) }
.wh-cap img { display: none; height: clamp(44px, 6vw, 72px); width: auto; max-width: 70vw; filter: drop-shadow(0 2px 12px rgba(0,0,0,.7)); order: -1 }
.wh-cap.has-sign img { display: block } .wh-cap.has-sign h2 { display: none }
.wh.at-video .wh-lines { opacity: 1 }
.wh:not(.at-video) .wh-lines { opacity: 0 }
.wh.at-logo .wh-logo { opacity: 1 }
/* the dim behind the logo and the wash behind the signs are layers that fade, so nothing snaps between parts */
.wh-shade::before, .wh-shade::after { content: ""; position: absolute; inset: 0; opacity: 0; transition: opacity .9s }
.wh-shade::after { background: radial-gradient(ellipse at 50% 50%, rgba(20,10,5,.55), rgba(20,10,5,.82)) } .wh.at-logo .wh-shade::after { opacity: 1 }
.wh-logo svg { width: min(620px, 82vw) }
.wh.at-end .wh-end { opacity: 1; pointer-events: auto }
.wh.at-end .wh-cap, .wh.at-end .wh-skip { opacity: 0; pointer-events: none }
.wh-skip { position: absolute; right: 18px; top: 18px; background: rgba(20,10,5,.45); color: #fff6ea; border: 1px solid rgba(255,246,234,.35); border-radius: 20px; padding: 7px 16px; font: 600 13px var(--body); backdrop-filter: blur(6px); transition: opacity .4s }
/* the player bar along the bottom: back, play, forward, a bar to drag through, the time and the sound */
.wh-dock { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 26px 70px calc(12px + env(safe-area-inset-bottom, 0px)) clamp(12px, 2vw, 22px); background: linear-gradient(180deg, transparent, rgba(15,8,4,.55)) }
.wh-dock .wh-mute { position: static }
.wh-track { position: relative; flex: 1; height: 28px; display: flex; align-items: center; cursor: pointer; touch-action: none; margin: 0 6px }
.wh-bar { position: relative; width: 100%; height: 4px; border-radius: 4px; background: rgba(255,246,234,.25); transition: height .15s }
.wh-bar i { position: relative; display: block; height: 100%; width: 0; border-radius: 4px; background: #e7c27a }
.wh-bar b { position: absolute; right: -7px; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; background: #f4efe6; box-shadow: 0 1px 6px rgba(0,0,0,.5); transform: scale(.8); transition: transform .15s }
.wh-track:hover .wh-bar, .wh-track.drag .wh-bar { height: 6px } .wh-track:hover .wh-bar b, .wh-track.drag .wh-bar b { transform: scale(1.1) }
.wh-tip { position: absolute; bottom: 26px; transform: translateX(-50%); padding: 3px 8px; border-radius: 6px; background: rgba(20,10,5,.85); color: #fff6ea; font: 600 12px var(--body); opacity: 0; pointer-events: none; transition: opacity .15s; white-space: nowrap }
.wh-track:hover .wh-tip, .wh-track.drag .wh-tip { opacity: 1 }
.wh-time { font: 600 12px var(--body); color: #fff6ea; font-variant-numeric: tabular-nums; white-space: nowrap; text-shadow: 0 1px 4px rgba(0,0,0,.6) }
@media (max-width: 560px) { .wh-dock { gap: 4px; padding-right: 64px } .wh-time { display: none } }
.wh-scene.center { background: radial-gradient(circle at 50% 45%, #2f5240, #12201a 70%); display: grid; place-items: center }
.tc-ring { position: relative; width: min(560px, 80vw); aspect-ratio: 1; transform: translateY(-6%) }
.tc-ring > span { position: absolute; transform: translate(-50%, -50%); opacity: 0; animation: pop .6s ease both; animation-delay: calc(.3s + var(--i) * .18s) }
.tc-ring > span img { height: clamp(22px, 3vw, 34px); width: auto; max-width: 150px; filter: drop-shadow(0 2px 8px rgba(0,0,0,.6)) }
.tc-core { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 46%; aspect-ratio: 1; border-radius: 50%; background: #fffaf2; color: #1f3a2b; display: grid; place-items: center; align-content: center; gap: 6px; text-align: center; box-shadow: 0 0 0 10px rgba(231,194,122,.25), 0 0 60px rgba(231,194,122,.35); animation: pop .7s ease both }
.tc-core b { font: 500 clamp(24px, 3.4vw, 40px)/1 var(--display) } .tc-core small { font: 600 clamp(10px, 1.1vw, 12px) var(--body); letter-spacing: .08em; color: #9c5a26; padding-inline: 12% }
.tc-cap { position: absolute; left: 0; right: 0; bottom: clamp(30px, 7vh, 70px); text-align: center; display: grid; gap: 8px; justify-items: center }

@keyframes rise { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: none } }
@media (prefers-reduced-motion: reduce) { .wh-scene .kb { animation: none } }

.wh-signs { position: absolute; left: 50%; top: 50%; width: max(100%, 150vh); aspect-ratio: 3 / 2; transform: translate(-50%, -50%); pointer-events: none }

/* each logo sits in its brand color, the same pill as the menu bar */
.wh-signs { container-type: size }
.wh-signs .sg { position: absolute; display: flex; align-items: center; justify-content: center; box-sizing: border-box; height: calc(var(--h) * 1cqh); padding: 0 calc(var(--h) * .55cqh); border-radius: 999px; background: var(--bc); box-shadow: 0 0 0 1px rgba(255,246,234,.22), 0 6px 20px rgba(10,5,2,.55), 0 0 26px rgba(255,200,120,.3); transform: translate(-50%, -50%) scale(.92); opacity: 0; transition: opacity .6s, transform .6s }

.wh.at-signs .wh-signs .sg { opacity: 1; transform: translate(-50%, -50%) scale(1); transition-delay: var(--d) }


/* one grade over every shot: warm, a little faded, darker at the edges like the closing card */
.wh-scene .kb { filter: contrast(1.1) saturate(1.2) brightness(1.03) sepia(.06) }
.wh-stage::after { content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 50%, rgba(25,12,6,.42) 100%), linear-gradient(180deg, rgba(255,170,90,.06), transparent 40%, rgba(20,10,5,.28)) }
.wh-stage { z-index: 0 } .wh-stage .wh-scene { z-index: 1 } .wh-stage .wh-scene.web { z-index: 4 }

.wh-collage { position: absolute; inset: 0; display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 6px; background: #1c120c }
.wh-collage > div { overflow: hidden; opacity: 0; animation: rise .8s ease both; animation-delay: calc(var(--i) * .25s) }
.wh-collage .kb { width: 100%; height: 100%; object-fit: cover; filter: contrast(1.1) saturate(1.15) brightness(1.02) sepia(.1) }
.wh-collage > div { position: relative } .wh-collage > div::after { content: ""; position: absolute; inset: 0; background: rgba(255,160,80,.08); mix-blend-mode: soft-light }

.wh-scene.title { align-content: center; gap: 34px }
.wh-logos { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 22px 38px; max-width: min(1100px, 90vw) }
.wh-logos > span { position: relative; display: block; opacity: 0; animation: rise .6s ease both; animation-delay: calc(.4s + var(--i) * .12s) }
.wh-logos img { display: block; height: clamp(26px, 3.4vw, 44px); width: auto; max-width: 240px }
/* the logo's shape, filled with its brand color */
.wh-logos .tint img { visibility: hidden }
.wh-logos .tint::after { content: ""; position: absolute; inset: 0; background: var(--c); -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat }
.wh-scene.title:has(.wh-logos) { background: radial-gradient(circle at 50% 40%, #fbf7ef, #ece3d2) }
.wh-scene.title:has(.wh-logos) h2 { color: #2a1710 }
.doms .dom-logo { display: grid; justify-items: start; gap: 8px } .doms .dom-logo small { color: #8a7a66; font-size: 13px }

/* closing shot: the whole painted town, every logo on its building, the stays marked */
.wh-endmap { background: #1c120c }
.em-frame { position: absolute; left: 50%; top: 50%; width: max(100%, 150vh); aspect-ratio: 3 / 2; transform: translate(-50%, -50%) }
.em-frame > .em-paint { width: 100%; height: 100%; display: block }
.em-sign { position: absolute; height: 3.1%; width: auto; max-width: 11%; transform: translate(-50%, -50%); opacity: 0; animation: signin .6s ease both; animation-delay: var(--d); filter: drop-shadow(0 1px 1px rgba(20,10,5,.9)) drop-shadow(0 0 6px rgba(20,10,5,.7)) drop-shadow(0 0 14px rgba(255,200,120,.35)) }
.em-sign.em-pizza { height: 4.2% } .em-sign.em-pinkhouse { height: 3.5% }
.em-stay { position: absolute; transform: translate(-50%, -50%); display: inline-flex; align-items: center; gap: 6px; background: rgba(250,244,232,.94); color: #2a2420; font: 500 clamp(11px, 1vw, 14px)/1 var(--display); padding: 5px 9px 6px; border-radius: 3px; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.3); opacity: 0; animation: signin .6s ease both; animation-delay: var(--d) }
.em-stay .pn-home { color: #9c5a26 }
@keyframes signin { from { opacity: 0; transform: translate(-50%, -30%) } to { opacity: 1; transform: translate(-50%, -50%) } }
.wh.at-end .wh-end { background: linear-gradient(180deg, rgba(20,10,5,.55), transparent 22%, transparent 62%, rgba(20,10,5,.85)); align-content: space-between; padding-block: clamp(18px, 4vh, 40px) clamp(28px, 6vh, 60px) }
.wh.at-end .wh-endlogo svg { width: min(260px, 50vw) }
.wh-end .wh-endtext { display: grid; justify-items: center; gap: 12px }
.wh.at-end .wh-end h1 { font-size: clamp(32px, 4.4vw, 60px) }
.wh.at-end .wh-shade { background: none }
.wh.at-end .wh-stage::after { background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(20,10,5,.4) 100%) }

.wh-btn { font: 600 17px/1 var(--sc); letter-spacing: .16em; text-transform: lowercase; color: #fff6ea; background: rgba(20,10,5,.35); border: 1px solid rgba(255,246,234,.55); border-radius: 40px; padding: 14px 26px 15px; backdrop-filter: blur(6px); cursor: pointer; transition: background .2s, border-color .2s }
.wh-btn:hover { background: rgba(20,10,5,.55); border-color: #fff6ea }
.wh-btn.gold { background: #e7c27a; border-color: #e7c27a; color: #2a1710 }
.wh-btn.gold:hover { background: #f0d08c }

/* screenshots for the video: no notes button */
html.cap .nbtn { display: none }

/* the business pass: each site's real homepage in a browser window */
.wh-scene .kb.soft { filter: blur(14px) brightness(.55) saturate(1.2); transform: scale(1.1) }
.wh-browser { position: absolute; left: 50%; top: 47%; width: min(74vw, 118vh); transform: translate(-50%, -50%); border-radius: 12px; overflow: hidden; background: #f4efe6; box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,246,234,.15); animation: winrise .7s ease both }
.wh-browser .bar { display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; background: #e9e2d3 } .wh-browser .bar i { width: 10px; height: 10px; border-radius: 50%; background: #cbbfa9 }
.wh-browser .bar span { margin: 0 auto; transform: translateX(-24px); font: 500 13px var(--body); color: #6b5a48; background: #f8f4ec; padding: 4px 16px; border-radius: 6px }
.wh-browser > img { display: block; width: 100%; height: auto; animation: winscroll 2.8s ease-in-out both }
@keyframes winrise { from { opacity: 0; transform: translate(-50%, -46%) scale(.97) } to { opacity: 1; transform: translate(-50%, -50%) scale(1) } }
@keyframes winscroll { from { transform: scale(1.02) } to { transform: scale(1) } }
.tc-core { gap: 10px } .tc-core .tc-k { font: 600 clamp(10px, 1vw, 13px) var(--sc); letter-spacing: .22em; text-transform: lowercase; color: #9c5a26 }
.tc-core b { font: 500 clamp(30px, 4vw, 50px)/1 var(--display); color: #1f3a2b } .tc-core .tc-rule { width: 38%; height: 1px; background: #c9a96a }

.wh-webcap { position: absolute; left: 0; right: 0; top: clamp(28px, 7vh, 70px); text-align: center; display: grid; gap: 8px; justify-items: center; z-index: 2; animation: rise .7s ease both }
.wh-webcap .eyebrow { color: #e7c27a } .wh-webcap h2 { font: 500 clamp(28px, 3.6vw, 50px)/1.06 var(--display); color: #fff6ea; text-shadow: 0 2px 18px rgba(0,0,0,.5) }
.wh-browser.low { top: 58%; width: min(64vw, 98vh) }
.wh-scene.cont .wh-browser, .wh-scene.cont .wh-browser > img, .wh-scene.cont .wh-dhead { animation: none }
/* desktop: each site under its own clean logo and web address, no browser bar */
.wh-dhead { position: absolute; left: 0; right: 0; top: clamp(28px, 6vh, 64px); display: grid; gap: 10px; justify-items: center; z-index: 2; animation: rise .7s ease both }
.wh-dhead .mw-logo img { height: clamp(48px, 7.5vh, 84px); width: auto; max-width: 60vw; filter: drop-shadow(0 2px 12px rgba(0,0,0,.6)) }
.wh-dhead .u { font: 600 clamp(12px, 1.1vw, 15px) var(--sc); letter-spacing: .2em; text-transform: lowercase; color: #e7c27a; text-shadow: 0 1px 8px rgba(0,0,0,.6) }
.wh-dhead .mw-logo img.lg-doubledip { filter: drop-shadow(0 0 1px #fff6ea) drop-shadow(0 0 1px #fff6ea) drop-shadow(0 2px 10px rgba(0,0,0,.6)) }

/* the opening lines: one at a time, larger, over a soft dark backing */
.wh-lines { top: 0; bottom: 0; transform: none; display: block }
.wh-lines::before { content: ""; position: absolute; left: 50%; top: 50%; width: min(1100px, 92vw); height: min(360px, 40vh); transform: translate(-50%, -50%); background: radial-gradient(ellipse at center, rgba(20,10,5,.55), transparent 70%); pointer-events: none }
.wh-lines p { position: absolute; left: 0; right: 0; top: 50%; padding-inline: 20px; font-size: clamp(40px, 6.2vw, 100px); transform: translateY(-40%); text-shadow: 0 2px 30px rgba(0,0,0,.7) }
.wh-lines p.on { transform: translateY(-50%) }
/* the close: the Bloomfield logo and one line, nothing else */
.wh-endbg { background: radial-gradient(ellipse at 50% 46%, rgba(40,20,12,.72), rgba(20,10,6,.9) 75%), url(img/town/painted-dusk.jpg) center / cover; animation: endsettle 6s ease-out both }
@keyframes endsettle { from { background-size: auto, 112% auto } to { background-size: auto, 104% auto } }
.wh.at-end .wh-end { background: none; align-content: center; gap: 26px; padding: 20px }
.wh.at-end .wh-endlogo svg { width: min(460px, 70vw) }
.wh.at-end .wh-end h1 { font-size: clamp(34px, 4.8vw, 66px) }
.wh.at-end .wh-stage::after { background: radial-gradient(ellipse at 50% 45%, transparent 50%, rgba(10,5,2,.4) 100%) }

/* the packages, as a feature: three cards, big */
.wh-cards { position: absolute; left: 0; right: 0; top: clamp(130px, 21vh, 200px); display: flex; justify-content: center; align-items: flex-start; gap: clamp(14px, 2vw, 30px); z-index: 2 }
.wh-cards img { width: min(26vw, 34vh); height: auto; border-radius: 10px; box-shadow: 0 24px 60px rgba(0,0,0,.5); opacity: 0; animation: cardrise .8s ease both; animation-delay: calc(.3s + var(--i) * .22s) }
@keyframes cardrise { from { opacity: 0; transform: translateY(30px) } to { opacity: 1; transform: none } }

/* the pitch's start screen: the painting, the logo and a play button */
.wh-start { position: absolute; inset: 0; z-index: 6; display: none; place-items: center; align-content: center; gap: 26px; text-align: center; background: radial-gradient(ellipse at 50% 50%, rgba(20,10,5,.35), rgba(20,10,5,.75)) }
.wh.at-start .wh-start { display: grid }
.wh.at-start .wh-skip, .wh.at-start .wh-mute, .wh.at-start .wh-lines, .wh.at-start .wh-dock { display: none }
.wh-startlogo svg { width: min(480px, 76vw); height: auto; filter: drop-shadow(0 4px 30px rgba(0,0,0,.6)) }
.wh-play { width: 104px; height: 104px; border-radius: 50%; border: 0; background: #e7c27a; color: #2a1710; display: grid; place-items: center; cursor: pointer; box-shadow: 0 0 0 10px rgba(231,194,122,.22), 0 18px 40px rgba(0,0,0,.45); transition: transform .2s, box-shadow .2s }
.wh-play svg { margin-left: 6px } .wh-play:hover { transform: scale(1.06); box-shadow: 0 0 0 16px rgba(231,194,122,.2), 0 18px 40px rgba(0,0,0,.45) }
.wh-playhint { font: 600 14px var(--sc); letter-spacing: .2em; text-transform: lowercase; color: #f3dfc2 }
/* the pitch's controls, top right: back, pause, forward, sound, skip */
.wh-ctls { position: absolute; right: 18px; top: 18px; z-index: 5; display: flex; gap: 8px; align-items: center }
.wh-ctls .wh-skip, .wh-ctls .wh-mute { position: static }
.wh-ctl { width: 34px; height: 32px; padding: 0; display: grid; place-items: center; background: rgba(20,10,5,.45); color: #fff6ea; border: 1px solid rgba(255,246,234,.35); border-radius: 20px; backdrop-filter: blur(6px); cursor: pointer; transition: background .2s }
.wh-ctl:hover, .wh-mute:hover { background: rgba(20,10,5,.7) }
.wh-pp .i-play, .wh-pp .i-replay { display: none }
.wh[data-paused] .wh-pp .i-pause { display: none } .wh[data-paused] .wh-pp .i-play { display: block }
.wh.at-end .wh-pp .i-play, .wh.at-end .wh-pp .i-pause { display: none } .wh.at-end .wh-pp .i-replay { display: block }
.wh.at-start .wh-ctls, .wh.at-end .wh-fwd, .wh.at-end .wh-dock .wh-mute, .wh.at-end .wh-ctls .wh-skip { display: none }
.wh[data-paused] * { animation-play-state: paused !important }
.wh-mute { position: absolute; right: 86px; top: 18px; width: 34px; height: 32px; display: grid; place-items: center; background: rgba(20,10,5,.45); color: #fff6ea; border: 1px solid rgba(255,246,234,.35); border-radius: 20px; backdrop-filter: blur(6px); cursor: pointer; z-index: 5 }

.wh.at-end .wh-mute { opacity: 0; pointer-events: none }
.wh.at-end .wh-more { bottom: calc(clamp(26px, 6vh, 56px) + 56px) }
/* the end frame: a quiet cue to keep going, with a slow drifting arrow */
.wh-more { position: absolute; left: 50%; bottom: clamp(26px, 6vh, 56px); transform: translateX(-50%); display: grid; justify-items: center; gap: 12px; border: 0; background: none; cursor: pointer; font: 600 clamp(14px, 1.25vw, 17px) var(--sc); letter-spacing: .24em; text-transform: lowercase; color: #e7c27a; opacity: 0; transition: opacity 1s 1.6s }
.wh.at-end .wh-more { opacity: 1 }
.wh-more svg { width: 46px; height: 46px; padding: 11px; box-sizing: border-box; border: 1px solid rgba(231,194,122,.6); border-radius: 50%; fill: none; stroke: #f4efe6; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; animation: moredrift 2.2s ease-in-out infinite }
.wh-more:hover svg { stroke: #e7c27a; border-color: #e7c27a }
@keyframes moredrift { 0%, 100% { transform: translateY(0); opacity: .55 } 50% { transform: translateY(7px); opacity: 1 } }

/* what visitors will see: bigger captions, titles and address bars */
.screens { gap: 26px }
.screen .bar { padding: 9px 12px } .screen .bar i { width: 10px; height: 10px } .screen .bar span { font-size: 14px }

  box-shadow: 0 0 0 0 rgba(231,194,122,.55), 0 20px 44px rgba(0,0,0,.35); animation: ctapulse 2.4s ease-in-out infinite; transition: transform .2s, background .2s }
